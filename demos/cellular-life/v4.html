<script>
(() => {
'use strict';
// Pelagic (Cellular Life v4): world geometry, cell types, genes, body plans and species.
// No DOM here, so the simulation also runs headless in Node for tuning.

// ---- the ocean ------------------------------------------------------------------------
// WW x WH units, wrapping round at every edge. A 25-unit grid holds light, current and food.
const WW = 1200, WH = 750, TPS = 30, TAU = Math.PI * 2;
const BIN = 25, BW = WW / BIN, BH = WH / BIN, NB = BW * BH;

const mod = (v, m) => ((v % m) + m) % m;
const wrapX = (x) => (x < 0 ? x + WW : x >= WW ? x - WW : x);
const wrapY = (y) => (y < 0 ? y + WH : y >= WH ? y - WH : y);
const wdx = (d) => (d > WW / 2 ? d - WW : d < -WW / 2 ? d + WW : d); // the short way round
const wdy = (d) => (d > WH / 2 ? d - WH : d < -WH / 2 ? d + WH : d);
const binAt = (x, y) => ((mod(y, WH) / BIN) | 0) * BW + ((mod(x, WW) / BIN) | 0);

// ---- helpers -------------------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (n) => (Math.random() * n) | 0;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
function gauss() {
  let u = 0;
  while (!u) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random());
}
function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}
const angWrap = (a) => mod(a + Math.PI, TAU) - Math.PI;

// ---- cell types --------------------------------------------------------------------------------
const PHOTO = 0, MOUTH = 1, FLAG = 2, SPIKE = 3, SHELL = 4, EYE = 5, NT = 6;
const TYPES = [
  { name: 'Photo', role: 'harvests light', cost: 4, upkeep: 0.011, hp: 1, size: 1, rgb: [96, 240, 170] },
  { name: 'Mouth', role: 'eats drifting food and bites other creatures', cost: 4, upkeep: 0.013, hp: 1, size: 1, rgb: [255, 190, 90] },
  { name: 'Flagellum', role: 'swims', cost: 4, upkeep: 0.012, hp: 1, size: 0.85, rgb: [90, 205, 255] },
  { name: 'Spike', role: 'stings whatever touches it', cost: 6, upkeep: 0.018, hp: 1.5, size: 0.85, rgb: [255, 90, 120] },
  { name: 'Shell', role: 'armour against bites and stings, but heavy', cost: 6, upkeep: 0.012, hp: 4, size: 1.1, rgb: [178, 160, 255] },
  { name: 'Eye', role: 'sees food, prey, kin and threats', cost: 6, upkeep: 0.016, hp: 1, size: 0.85, rgb: [240, 245, 255] },
];
const COST = TYPES.map((t) => t.cost);
const UPKEEP = TYPES.map((t) => t.upkeep);
const cellRadius = (t, z) => (3 + 2.6 * z) * TYPES[t].size;

// ---- genes ---------------------------------------------------------------------------------------
// Gait and behaviour ride alongside the body plan. tag is a neutral marker that drifts over
// the generations: creatures with close tags are kin, and never bite or sting each other.
const GENES = [
  ['f', 'Beat rate'], ['amp', 'Undulation'], ['pulse', 'Pulsing'], ['agility', 'Agility'],
  ['light', 'Light seeking'], ['food', 'Foraging'], ['prey', 'Hunting'], ['flee', 'Caution'],
  ['school', 'Schooling'], ['invest', 'Offspring size'],
];
const GENE_KEYS = ['f', 'amp', 'wave', 'pulse', 'agility', 'light', 'food', 'prey', 'flee', 'school'];
function randomGenes() {
  const g = { tag: Math.random(), invest: rand(0.4, 0.6) };
  for (const k of GENE_KEYS) g[k] = Math.random();
  g.amp *= 0.5;
  g.pulse = Math.random() < 0.3 ? g.pulse : 0;
  return g;
}
function mutateGenes(g, rate) {
  const c = { ...g };
  c.tag = mod(g.tag + gauss() * 0.01 * rate, 1);
  for (const k of GENE_KEYS) if (Math.random() < 0.2 * rate) c[k] = clamp(g[k] + gauss() * 0.12, 0, 1);
  if (Math.random() < 0.2 * rate) c.invest = clamp(g.invest + gauss() * 0.05, 0.15, 1);
  return c;
}
// Mating mixes two parents' genes, each gene from one or the other.
function crossGenes(a, b) {
  const c = { tag: mod(a.tag + angWrap((b.tag - a.tag) * TAU) / TAU / 2, 1) };
  for (const k of [...GENE_KEYS, 'invest']) c[k] = Math.random() < 0.5 ? a[k] : b[k];
  return c;
}

// ---- body plans ------------------------------------------------------------------------------------
// A plan is the zygote's type and size plus base cells {p, a, t, z}: parent (0 = the zygote,
// k = base cell k), angle from the parent's direction, type, and size 0..1. The symmetry
// copies branches: mirrored left and right, or repeated round the zygote. The creature
// starts as the zygote and grows the rest of its body one cell at a time, in plan order.
const MAX_BODY = 32;
const SYMS = ['asymmetric', 'bilateral', 'triradial', 'tetraradial', 'pentaradial'];
const AXIAL = 0.14; // branches this close to straight ahead or behind lie on the body axis

function makePlan(root, rz, cells, sym) {
  const par = [-1], ang = [0], typ = [root], siz = [rz], dep = [0];
  const imgs = [[{ i: 0, sg: 1, ax: true }]];
  for (const c of cells) {
    const out = [];
    for (const P of imgs[c.p]) {
      let list;
      if (sym >= 2 && c.p === 0) {
        const k = sym + 1;
        list = [];
        for (let j = 0; j < k; j++) list.push({ a: c.a + (TAU * j) / k, sg: 1, ax: false });
      } else if (sym === 1 && P.ax) {
        const axial = Math.abs(c.a) < AXIAL || Math.PI - Math.abs(c.a) < AXIAL;
        list = axial ? [{ a: c.a, sg: 1, ax: true }] : [{ a: c.a, sg: 1, ax: false }, { a: -c.a, sg: -1, ax: false }];
      } else list = [{ a: P.sg * c.a, sg: P.sg, ax: false }];
      for (const L of list) {
        if (par.length >= MAX_BODY) return null;
        out.push({ i: par.length, sg: L.sg, ax: L.ax });
        par.push(P.i); ang.push(L.a); typ.push(c.t); siz.push(c.z); dep.push(dep[P.i] + 1);
      }
    }
    imgs.push(out);
  }
  const n = par.length, rad = new Float32Array(n), len = new Float32Array(n);
  const rx = new Float32Array(n), ry = new Float32Array(n), dir = new Float32Array(n);
  const count = new Int16Array(NT);
  let cost = 0, mass = 0, reach = 0, depthMax = 0;
  for (let i = 0; i < n; i++) {
    const t = typ[i];
    rad[i] = cellRadius(t, siz[i]);
    count[t]++; cost += COST[t];
    mass += ((rad[i] * rad[i]) / 16) * (t === SHELL ? 2 : 1);
    depthMax = Math.max(depthMax, dep[i]);
    if (i === 0) continue;
    const p = par[i];
    len[i] = 0.88 * (rad[p] + rad[i]);
    dir[i] = (p === 0 ? 0 : dir[p]) + ang[i];               // resting pose, heading along +x
    rx[i] = rx[p] + Math.cos(dir[i]) * len[i];
    ry[i] = ry[p] + Math.sin(dir[i]) * len[i];
    reach = Math.max(reach, Math.hypot(rx[i], ry[i]) + rad[i]);
  }
  return {
    root, rz, cells, sym, n, cost, mass, count, depthMax,
    reach: Math.max(reach, rad[0]),
    kinds: count.reduce((a, c) => a + (c > 0 ? 1 : 0), 0),
    par: Int16Array.from(par), ang: Float32Array.from(ang), typ: Uint8Array.from(typ),
    dep: Uint8Array.from(dep), rad, len, rx, ry,
  };
}

function randomType(not) {
  let t;
  do t = randi(NT); while (t === not);
  return t;
}

// One random change to a body plan. Returns a new plan, or null if the change was invalid.
function mutatePlan(pl) {
  const cells = pl.cells.map((c) => ({ ...c }));
  let root = pl.root, rz = pl.rz, sym = pl.sym;
  const r = Math.random();
  if (r < 0.42) {                                   // the body gains a cell
    const p = randi(cells.length + 1), pt = p ? cells[p - 1].t : root;
    cells.push({ p, a: p ? angWrap(gauss() * 0.8) : rand(-Math.PI, Math.PI), t: Math.random() < 0.5 ? pt : randi(NT), z: Math.random() });
  } else if (r < 0.56) {                            // the body loses an end cell
    const leaves = [];
    for (let k = 0; k < cells.length; k++) if (!cells.some((c) => c.p === k + 1)) leaves.push(k);
    if (!leaves.length) return null;
    const k = leaves[randi(leaves.length)];
    cells.splice(k, 1);
    for (const c of cells) if (c.p > k + 1) c.p--;
  } else if (r < 0.74) {                            // a cell changes type
    const k = randi(cells.length + 1);
    if (k === 0) root = randomType(root);
    else cells[k - 1].t = randomType(cells[k - 1].t);
  } else if (r < 0.92) {                            // a cell changes angle or size
    if (!cells.length) rz = clamp(rz + gauss() * 0.25, 0, 1);
    else {
      const c = cells[randi(cells.length)];
      if (Math.random() < 0.6) c.a = angWrap(c.a + gauss() * 0.4);
      else c.z = clamp(c.z + gauss() * 0.25, 0, 1);
    }
  } else {                                          // the symmetry changes
    do sym = randi(SYMS.length); while (sym === pl.sym);
  }
  return makePlan(root, rz, cells, sym);
}

// How different two plans are. Becoming multicellular always counts as a big step.
function planDist(a, b) {
  let d = (a.root !== b.root) + (a.sym !== b.sym) + Math.abs(a.cells.length - b.cells.length);
  if ((a.n === 1) !== (b.n === 1)) d += 2;
  const n = Math.min(a.cells.length, b.cells.length);
  for (let i = 0; i < n; i++) {
    const x = a.cells[i], y = b.cells[i];
    d += (x.t !== y.t) + 0.5 * (x.p !== y.p) + 0.25 * Math.abs(angWrap(x.a - y.a)) + 0.25 * Math.abs(x.z - y.z);
  }
  return d;
}

// ---- species -------------------------------------------------------------------------------------
// A species is a cluster of similar plans around a founding plan. A child whose plan has
// drifted far enough from its species' founder starts a new species, with a related colour.
const SPECIES_D = 2;
let speciesSeq = 0;
const SYL1 = ['Thal', 'Nere', 'Pela', 'Cora', 'Myx', 'Sal', 'Teth', 'Aby', 'Med', 'Cten', 'Siph',
  'Noct', 'Vel', 'Ech', 'Plan', 'Aur', 'Lum', 'Hyd', 'Zo', 'Oph', 'Phy', 'Glau'];
const SYL2 = ['ella', 'ia', 'ops', 'ix', 'ara', 'ina', 'oda', 'ula', 'ena', 'ys', 'aster', 'opsis',
  'ora', 'eon', 'ite', 'ax', 'is', 'ana', 'ea', 'on', 'ura', 'ida'];

function newSpecies(proto, hue, parent, name) {
  const id = ++speciesSeq, h = hash32(id * 7919 + 13);
  const sp = {
    id, proto, hue: mod(hue, 360), parent: parent ? parent.name : '', kids: [],
    name: name || SYL1[h % SYL1.length] + SYL2[(h >>> 11) % SYL2.length] + '-' + id,
    born: world.t, alive: 0, peak: 0, total: 0, mass: 0, glyph: null,
  };
  if (parent) parent.kids.push(sp);
  return sp;
}

function speciesFor(sp, plan) {
  if (plan === sp.proto || planDist(plan, sp.proto) < SPECIES_D) return sp;
  sp.kids = sp.kids.filter((k) => k.alive > 0);
  for (const k of sp.kids) if (planDist(plan, k.proto) < SPECIES_D) return k;
  return newSpecies(plan, sp.hue + (Math.random() < 0.5 ? -1 : 1) * rand(18, 45), sp);
}

// Pelagic: the living ocean. Creatures are soft bodies of cells that grow from a single
// zygote cell along their body plan. They drift in the current or swim with flagella,
// graze, hunt, mate and die. No DOM, so it also runs headless in Node.

const P = { light: 0.5, food: 0.5, mutation: 0.5 }; // slider settings, 0..1

// ---- tuning --------------------------------------------------------------------------------
const AMBIENT = 0.08;          // light away from the light pools
const PHOTO_GAIN = 0.05;       // energy per tick from one photo cell in full light
const BIN_CAP = 2.5;           // photo cells one 25x25 patch of light feeds at the full rate
const SHADE = 1.5 * BIN_CAP;   // light demand above which light-feeders stop breeding there
const GRAZE_COOL = 4;          // ticks between mouthfuls for one mouth
const BITE_RATE = 0.12, STING_RATE = 0.2, SHELL_BLOCK = 0.9, PREY_SHARE = 0.8;
const THRUST = 0.2;            // push per tick from one flagellum, per unit of mass
const DRAG = 0.08;             // share of its speed through the water a body loses per tick
const VMAX = 1.6;              // top speed, units per tick
const FOLLOW = 0.4;            // how fast cells settle into their place in the body
const MOVE_COST = 0.003;       // energy per tick per flagellum at full effort
const GROW_EVERY = 8;          // ticks between new cells while growing
const LIFE_BASE = 35, LIFE_PER_CELL = 2.5; // lifespan in seconds
const KIN = 0.05;              // tag distance below which creatures are kin
const STRUCT_RATE = 0.12;      // body-plan mutations per birth at default mutation
const SENSE_BASE = 36, SENSE_EYE = 36, SENSE_MAX = 140;
const MAX_ORGS = 2000, MAX_CELLS = 8000, MAX_FOOD = 4000;
const VENT_RATE = 0.25, SNOW_RATE = 0.06, FOOD_E = 1.4;
const M_DRIFT = 0, M_GROW = 1, M_WANDER = 2, M_FORAGE = 3, M_HUNT = 4, M_FLEE = 5, M_LIGHT = 6, M_SCHOOL = 7;
const MODE_NAMES = ['Drifting', 'Growing', 'Wandering', 'Foraging', 'Hunting', 'Fleeing', 'Seeking light', 'Schooling'];

// ---- state -------------------------------------------------------------------------------------
const light = new Float32Array(NB), demandNow = new Float32Array(NB), demandPrev = new Float32Array(NB);
const flowU = new Float32Array(NB), flowV = new Float32Array(NB), flowW = new Float32Array(NB);
const fx = new Float32Array(MAX_FOOD), fy = new Float32Array(MAX_FOOD), fe = new Float32Array(MAX_FOOD);
const fhead = new Int32Array(NB).fill(-1), fnext = new Int32Array(MAX_FOOD);
let nFood = 0;
// every living cell, hashed into 12.5-unit buckets each tick (no wider than two cells), for contact and sight
const HB = 12.5, HBW = WW / HB, HBH = WH / HB, HMAX = MAX_CELLS + 4000;
const hhead = new Int32Array(HBW * HBH).fill(-1), hnext = new Int32Array(HMAX);
const hx = new Float32Array(HMAX), hy = new Float32Array(HMAX), hr = new Float32Array(HMAX);
const ho = new Int32Array(HMAX), hi = new Uint8Array(HMAX);
let nCells = 0;
// bigger bodies pay less upkeep per cell, and overshadow small ones where light is crowded
const SCALE = Float32Array.from({ length: MAX_BODY + 1 }, (_, n) => (n ? Math.max(0.45, n ** -0.25) : 1));
const REACH_UP = Float32Array.from({ length: MAX_BODY + 1 }, (_, n) => 1 + 0.7 * Math.log2(Math.max(1, n)));

const slots = [], freeSlots = [];
const world = { t: 0, seq: 0, orgs: [], born: [], species: new Set(), events: [], flags: {}, era: 0, eraT: [0], links: [], swirls: [] };

class Org {
  constructor(slot, plan, genes, sp, x, y, h, E, gen) {
    const n = plan.n, t0 = plan.typ[0];
    this.slot = slot; this.id = ++world.seq;
    this.plan = plan; this.genes = genes; this.sp = sp;
    this.x = new Float32Array(n); this.y = new Float32Array(n);  // cell positions, unwrapped round the zygote
    this.s = new Float32Array(n);                                 // growth of each cell, 0..1
    this.hp = new Float32Array(n); this.on = new Uint8Array(n); this.cool = new Uint8Array(n);
    this.count = new Int16Array(NT);
    this.x[0] = x; this.y[0] = y; this.s[0] = 0.45; this.hp[0] = TYPES[t0].hp; this.on[0] = 1;
    this.n = 1; this.count[t0] = 1;
    this.h = h; this.want = h; this.vx = 0; this.vy = 0; this.phase = rand(0, TAU);
    this.cap = 10 + 1.5 * plan.cost;
    this.e0 = 1 + genes.invest * plan.cost;                       // energy given to each offspring
    this.seed = this.e0 + COST[t0] + 1;                           // what an offspring costs, zygote cell included
    this.repE = this.seed + 0.2 * this.cap;
    this.E = E; this.age = 0; this.gen = gen;
    this.life = Math.round(TPS * (LIFE_BASE + LIFE_PER_CELL * n) * rand(0.8, 1.2));
    this.mass = 0.3; this.income = 0; this.win = 0; this.urge = 0.6; this.effort = 0;
    this.grown = n === 1; this.alive = true;
    this.kills = 0; this.kids = 0; this.mates = 0; this.cause = '';
    this.mode = M_DRIFT; this.tx = 0; this.ty = 0; this.seen = 0;
  }
}

// ---- setup ---------------------------------------------------------------------------------------
function resetWorld(seeds = 120) {
  demandNow.fill(0); demandPrev.fill(0); fhead.fill(-1); hhead.fill(-1);
  nFood = 0; nCells = 0; speciesSeq = 0;
  slots.length = 0; freeSlots.length = 0;
  Object.assign(world, {
    t: 0, seq: 0, orgs: [], born: [], species: new Set(), events: [], flags: {}, era: 0, eraT: [0],
    links: [], swirls: [], births: 0, deaths: 0, kills: 0, matings: 0, top: [], lead: null, leadT: -1e9,
    stats: { orgs: 0, cells: 0, multi: 0, swim: 0, hunt: 0, sighted: 0, complex: 0, maxN: 0, wavg: 0, species: 0, food: 0, types: new Int32Array(NT) },
    hist: { every: TPS, next: 0, t: [], wavg: [], max: [] },
    suns: Array.from({ length: 3 }, () => ({
      x0: rand(0, WW), y0: rand(0, WH), vx: rand(-1, 1) * 3.5, vy: rand(-1, 1) * 2.5,
      amp: rand(0.75, 0.95), r: rand(110, 160), x: 0, y: 0,
    })),
    modes: [[1, 1], [2, 1], [1, 2]].map(([m, k]) => ({
      kx: (TAU * m) / WW, ky: (TAU * k) / WH, a: rand(0.12, 0.2) / Math.max((TAU * m) / WW, (TAU * k) / WH),
      px: rand(0, TAU), py: rand(0, TAU), dx: rand(-1, 1) * 0.02, dy: rand(-1, 1) * 0.02, cx: 0, cy: 0,
    })),
    vents: Array.from({ length: 3 }, () => ({ x: rand(0, WW), y: rand(0, WH) })),
  });
  updateLight();
  updateFlow();
  for (let i = 0; i < 900; i++) addFood(rand(0, WW), rand(0, WH), FOOD_E);
  for (let i = 0; i < seeds; i++) {
    const sp = protoSpecies(Math.random() < 0.65 ? PHOTO : MOUTH);
    spawn(sp.proto, randomGenes(), sp, rand(0, WW), rand(0, WH), rand(0, TAU), 4, 0, null);
  }
  flushBorn();
  hashCells();
  hashFood();
  logEvent('era', `Era I · Primordial: ${seeds} lone cells adrift in the current`);
  census();
}

// Light pools drift slowly across the ocean, wrapping round.
function updateLight() {
  const secs = world.t / TPS, k = 0.4 + 1.2 * P.light;
  for (const s of world.suns) { s.x = mod(s.x0 + s.vx * secs, WW); s.y = mod(s.y0 + s.vy * secs, WH); }
  for (let by = 0; by < BH; by++) {
    for (let bx = 0; bx < BW; bx++) {
      const x = (bx + 0.5) * BIN, y = (by + 0.5) * BIN;
      let L = AMBIENT;
      for (const s of world.suns) {
        const dx = wdx(x - s.x), dy = wdy(y - s.y);
        L += s.amp * Math.exp(-(dx * dx + dy * dy) / (2 * s.r * s.r));
      }
      light[by * BW + bx] = Math.min(1, L) * k;
    }
  }
}

// The current: the curl of a few slowly shifting waves that tile the ocean, so it swirls
// without piling up anywhere, plus any eddies stirred by hand.
function updateFlow() {
  const secs = world.t / TPS, sw = world.swirls;
  for (const m of world.modes) { m.cx = m.px + m.dx * secs; m.cy = m.py + m.dy * secs; }
  for (let by = 0; by < BH; by++) {
    const y = (by + 0.5) * BIN;
    for (let bx = 0; bx < BW; bx++) {
      const x = (bx + 0.5) * BIN;
      let u = 0, v = 0, w = 0;
      for (const m of world.modes) {
        const sx = Math.sin(m.kx * x + m.cx), cx = Math.cos(m.kx * x + m.cx);
        const sy = Math.sin(m.ky * y + m.cy), cy = Math.cos(m.ky * y + m.cy);
        u += m.a * m.ky * sx * cy;
        v -= m.a * m.kx * cx * sy;
        w += m.a * (m.kx * m.kx + m.ky * m.ky) * sx * sy;
      }
      for (const s of sw) {
        const dx = wdx(x - s.x), dy = wdy(y - s.y), f = s.str * Math.exp(-(dx * dx + dy * dy) / (s.r * s.r));
        u += s.u * f; v += s.v * f;
      }
      const b = by * BW + bx;
      flowU[b] = u; flowV[b] = v; flowW[b] = w;
    }
  }
  for (let i = sw.length - 1; i >= 0; i--) if ((sw[i].str *= 0.96) < 0.02) sw.splice(i, 1);
}

let FU = 0, FV = 0, FW = 0; // sampleFlow's result
function sampleFlow(x, y) {
  const gx = mod(x, WW) / BIN - 0.5, gy = mod(y, WH) / BIN - 0.5;
  const x0 = Math.floor(gx), y0 = Math.floor(gy), tx = gx - x0, ty = gy - y0;
  const xa = (x0 + BW) % BW, xb = (x0 + 1) % BW, ya = ((y0 + BH) % BH) * BW, yb = ((y0 + 1) % BH) * BW;
  const a = ya + xa, b = ya + xb, c = yb + xa, d = yb + xb;
  const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
  FU = flowU[a] * w00 + flowU[b] * w10 + flowU[c] * w01 + flowU[d] * w11;
  FV = flowV[a] * w00 + flowV[b] * w10 + flowV[c] * w01 + flowV[d] * w11;
  FW = flowW[a] * w00 + flowW[b] * w10 + flowW[c] * w01 + flowW[d] * w11;
}

function addFood(x, y, e) {
  if (nFood >= MAX_FOOD || e < 0.15) return;
  fx[nFood] = mod(x, WW); fy[nFood] = mod(y, WH); fe[nFood] = e;
  nFood++;
}

// ---- birth and death ---------------------------------------------------------------------------
function spawn(plan, genes, sp, x, y, h, E, gen, parent) {
  const slot = freeSlots.length ? freeSlots.pop() : slots.length;
  const o = new Org(slot, plan, genes, sp, mod(x, WW), mod(y, WH), h, E, gen);
  slots[slot] = o;
  world.born.push(o);
  if (sp.alive++ === 0) world.species.add(sp);
  sp.total++;
  if (sp.alive > sp.peak) sp.peak = sp.alive;
  if (parent) { parent.kids++; o.vx = parent.vx * 0.5; o.vy = parent.vy * 0.5; }
  world.births++;
  return o;
}

function flushBorn() {
  for (const o of world.born) if (o.alive) world.orgs.push(o);
  world.born.length = 0;
}

function die(o, cause, remains = true) {
  if (!o.alive) return;
  o.alive = false; o.cause = cause;
  const pl = o.plan, spare = Math.max(0, o.E) / Math.max(1, o.n);
  if (remains) {
    for (let i = 0; i < pl.n; i++) if (o.on[i]) addFood(o.x[i], o.y[i], COST[pl.typ[i]] * 0.4 + spare * 0.5);
  }
  slots[o.slot] = null; freeSlots.push(o.slot);
  if (--o.sp.alive === 0) extinct(o.sp);
  world.deaths++;
}

function extinct(sp) {
  world.species.delete(sp);
  if (sp.proto.n > 1 && sp.peak >= 60) logEvent('extinct', `${sp.name} died out after peaking at ${sp.peak}`, sp);
}

// Lose cell i and everything that grew from it. Losing the zygote cell is fatal.
function cutCell(o, i, food) {
  if (i === 0) return die(o, o.cause || 'eaten');
  const pl = o.plan;
  o.on[i] = 0; o.n--;
  if (food) addFood(o.x[i], o.y[i], COST[pl.typ[i]] * 0.4);
  for (let j = i + 1; j < pl.n; j++) {
    if (o.on[j] && !o.on[pl.par[j]]) {
      o.on[j] = 0; o.n--;
      addFood(o.x[j], o.y[j], COST[pl.typ[j]] * 0.4);
    }
  }
  o.grown = false;
}

const kin = (a, b) => {
  const d = Math.abs(a.genes.tag - b.genes.tag);
  return (d > 0.5 ? 1 - d : d) < KIN;
};

// ---- a tick of one creature's life --------------------------------------------------------------
function live(o) {
  const pl = o.plan, n = pl.n, w = REACH_UP[o.n];
  o.age++;
  let gain = 0, mass = 0;
  o.count.fill(0);
  for (let i = 0; i < n; i++) {
    if (!o.on[i]) continue;
    const t = pl.typ[i], s = o.s[i], r = pl.rad[i] * s;
    o.count[t]++;
    mass += ((r * r) / 16) * (t === SHELL ? 2 : 1);
    if (s < 1) o.s[i] = Math.min(1, s + 0.035);
    if (t === PHOTO) {
      const b = ((wrapY(o.y[i]) / BIN) | 0) * BW + ((wrapX(o.x[i]) / BIN) | 0), share = (w * BIN_CAP) / demandPrev[b];
      demandNow[b] += w;
      gain += PHOTO_GAIN * light[b] * (share < 1 ? share : 1) * s;
    } else if (t === MOUTH) {
      if (o.cool[i]) o.cool[i]--;
      else gain += graze(o, i);
    }
  }
  o.mass = Math.max(0.2, mass);
  let up = 0;
  for (let t = 0; t < NT; t++) up += o.count[t] * UPKEEP[t];
  const flags = o.count[FLAG];
  o.effort = flags ? gait(o) * o.urge : 0;
  up = up * SCALE[o.n] + MOVE_COST * flags * o.effort * o.effort;
  o.income = gain;
  o.E += gain - up;
  if (o.E > o.cap) o.E = o.cap;
  if (o.E <= 0) return die(o, 'starved');
  if (o.age > o.life) return die(o, 'died of old age');
  if (!o.grown) {
    if ((world.t + o.slot) % GROW_EVERY === 0) grow(o);
  } else if (o.E >= o.repE) reproduce(o);
  if ((world.t + o.slot) % 5 === 0) think(o);
  move(o);
}

// A mouth takes the nearest drifting morsel within reach.
function graze(o, i) {
  const x = mod(o.x[i], WW), y = mod(o.y[i], WH), reach = o.plan.rad[i] * o.s[i] + 3, r2 = reach * reach;
  const bx = (x / BIN) | 0, by = (y / BIN) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    const row = ((by + dy + BH) % BH) * BW;
    for (let dx = -1; dx <= 1; dx++) {
      for (let k = fhead[row + ((bx + dx + BW) % BW)]; k >= 0; k = fnext[k]) {
        if (fe[k] <= 0) continue;
        const ex = wdx(fx[k] - x), ey = wdy(fy[k] - y);
        if (ex * ex + ey * ey > r2) continue;
        const e = fe[k];
        fe[k] = 0;
        o.cool[i] = GRAZE_COOL;
        return e * 0.9;
      }
    }
  }
  o.cool[i] = 2;
  return 0;
}

// How hard the flagella are pushing right now: a steady beat, helped by undulating a long
// body, or a jet-like burst once per stroke.
function gait(o) {
  const g = o.genes, c = Math.cos(o.phase);
  const glide = 0.6 + 0.8 * g.amp * (o.plan.depthMax >= 2 ? 1 : 0.3);
  const burst = c > 0 ? c * c * c * 2.4 : 0;
  return ((1 - g.pulse) * glide + g.pulse * burst) * (0.5 + g.f);
}

function grow(o) {
  const pl = o.plan;
  for (let i = 1; i < pl.n; i++) {
    if (o.on[i] || !o.on[pl.par[i]]) continue;
    const c = COST[pl.typ[i]];
    if (o.E < c + 1) return;
    o.E -= c;
    o.on[i] = 1; o.n++; o.s[i] = 0.2; o.hp[i] = TYPES[pl.typ[i]].hp;
    o.x[i] = o.x[pl.par[i]]; o.y[i] = o.y[pl.par[i]];   // buds out of its parent cell
    return;
  }
  o.grown = true;
}

function reproduce(o) {
  if (world.orgs.length + world.born.length >= MAX_ORGS || nCells >= MAX_CELLS) return;
  const pl = o.plan, g = o.genes, back = pl.reach + 4;
  const bx = o.x[0] - Math.cos(o.h) * back + rand(-4, 4), by = o.y[0] - Math.sin(o.h) * back + rand(-4, 4);
  if (pl.typ[0] === PHOTO && demandPrev[binAt(bx, by)] > SHADE) return; // no room in the light
  const mate = pl.n > 1 && Math.random() < 0.7 ? findMate(o) : null; // single cells just divide
  let plan = pl, genes = g;
  if (mate) {
    plan = Math.random() < 0.5 ? pl : mate.plan;
    genes = crossGenes(g, mate.genes);
    o.E -= o.seed * 0.5;
    mate.E -= o.seed * 0.5;
    o.mates++; mate.mates++; world.matings++;
    world.links.push({ a: o, b: mate, t: 20 });
    if (!world.flags.mate && o.sp.proto.n > 1) first('mate', `First mating: two ${o.sp.name} pair up`, o.sp);
  } else o.E -= o.seed;
  const rate = 2 * P.mutation;
  if (Math.random() < STRUCT_RATE * rate) plan = mutatePlan(plan) || plan;
  genes = mutateGenes(genes, rate);
  if (o.n < pl.n) o.grown = false;
  spawn(plan, genes, speciesFor(o.sp, plan), bx, by, rand(0, TAU), o.e0, o.gen + 1, o);
}

// A grown member of the same species nearby with energy to spare.
function findMate(o) {
  const x = mod(o.x[0], WW), y = mod(o.y[0], WH), R = 40 + o.plan.reach * 2, me = o.slot + 1;
  const bx = (x / HB) | 0, by = (y / HB) | 0, span = Math.ceil(R / HB);
  for (let dy = -span; dy <= span; dy++) {
    const row = ((by + dy + HBH) % HBH) * HBW;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = hhead[row + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        if (ho[k] === me || hi[k] !== 0) continue;   // look at zygote cells only
        const v = slots[ho[k] - 1];
        if (!v || v.sp !== o.sp || !v.grown || v.E < v.seed * 0.6 + 2) continue;
        const ex = wdx(hx[k] - x), ey = wdy(hy[k] - y);
        if (ex * ex + ey * ey < R * R) return v;
      }
    }
  }
  return null;
}

// ---- senses and steering --------------------------------------------------------------------------
let stamp = 0;
function think(o) {
  const g = o.genes;
  if (!o.count[FLAG]) { o.mode = o.grown ? M_DRIFT : M_GROW; return; }
  const worse = o.income < o.win;                   // income now against at the last look
  o.win = o.income;
  const R = Math.min(SENSE_MAX, SENSE_BASE + SENSE_EYE * o.count[EYE]), R2 = R * R, me = o.slot + 1;
  const x0 = mod(o.x[0], WW), y0 = mod(o.y[0], WH), eats = o.count[MOUTH] > 0;
  const hungry = o.E < o.repE;
  let preyD = R2, preyX = 0, preyY = 0, ax = 0, ay = 0, fear = 0;
  let ku = 0, kv = 0, kx = 0, ky = 0, kn = 0, checked = 0;
  stamp++;
  const span = Math.ceil(R / HB), bx = (x0 / HB) | 0, by = (y0 / HB) | 0, stride = span > 6 ? 2 : 1;
  for (let dy = -span; dy <= span && checked < 700; dy += stride) {
    const row = ((by + dy + HBH) % HBH) * HBW;
    for (let dx = -span; dx <= span; dx += stride) {
      for (let k = hhead[row + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        if (ho[k] === me) continue;
        checked++;
        const v = slots[ho[k] - 1];
        if (!v || !v.alive) continue;
        const ex = wdx(hx[k] - x0), ey = wdy(hy[k] - y0), d2 = ex * ex + ey * ey;
        if (d2 > R2) continue;
        if (kin(o, v)) {
          if (v.seen !== stamp) { v.seen = stamp; ku += Math.cos(v.h); kv += Math.sin(v.h); kx += ex; ky += ey; kn++; }
          continue;
        }
        if ((v.count[MOUTH] || v.count[SPIKE]) && v.mass > o.mass * 0.8) {
          const wt = 1 / (d2 + 100);
          ax -= ex * wt; ay -= ey * wt; fear += wt;
        }
        if (eats && hungry && d2 < preyD && v.mass < o.mass * 1.5 && v.plan.typ[hi[k]] !== SHELL) {
          preyD = d2; preyX = ex; preyY = ey;
        }
      }
    }
  }
  let ux = 0, uy = 0, best = 0, mode = M_WANDER, urge = 0.55, tx = 0, ty = 0;
  const pull = (vx, vy, wt, m, u) => {
    const L = Math.hypot(vx, vy);
    if (!L || wt <= 0) return;
    ux += (vx / L) * wt; uy += (vy / L) * wt;
    if (wt > best) { best = wt; mode = m; urge = u; tx = vx; ty = vy; }
  };
  if (fear > 0) pull(ax, ay, g.flee * 3 * Math.min(1, fear * 300), M_FLEE, 1.4);
  if (preyD < R2) pull(preyX, preyY, g.prey * 2 * (1.3 - Math.sqrt(preyD) / R), M_HUNT, 1.25);
  if (eats && g.food > 0.05) {
    const f = nearestFood(x0, y0, Math.min(R, 90));
    if (f) pull(f[0], f[1], g.food * 1.5 * (1.2 - Math.hypot(f[0], f[1]) / 90), M_FORAGE, 0.9);
  }
  if (o.count[PHOTO] && g.light > 0.05) {
    const here = light[binAt(x0, y0)], r = R * 0.6;
    let bl = here, bxl = 0, byl = 0;
    for (let k = 0; k < 6; k++) {
      const a = o.h + (k * TAU) / 6, lx = Math.cos(a) * r, ly = Math.sin(a) * r, L = light[binAt(x0 + lx, y0 + ly)];
      if (L > bl) { bl = L; bxl = lx; byl = ly; }
    }
    if (bl > here) pull(bxl, byl, g.light * 6 * (bl - here), M_LIGHT, 0.75);
  }
  if (kn) {
    pull(ku / kn + (kx / kn) * 0.01, kv / kn + (ky / kn) * 0.01, g.school * (0.6 + 0.1 * kn), M_SCHOOL, 0.8);
    if (kn >= 4 && g.school > 0.5 && o.sp.proto.n > 1 && o.sp.proto.count[FLAG] && o.sp.alive >= 5 && !world.flags.school) {
      first('school', `First school: ${o.sp.name} swim together`, o.sp);
    }
  }
  if (best < 0.12) {
    // run and tumble: keep going while income improves, turn when it falls
    if (worse || Math.random() < 0.08) o.want = o.h + gauss() * 1.4;
    o.mode = M_WANDER; o.urge = 0.55;
    return;
  }
  o.want = Math.atan2(uy, ux);
  o.mode = mode; o.urge = urge; o.tx = x0 + tx; o.ty = y0 + ty;
}

function nearestFood(x, y, R) {
  const span = Math.ceil(R / BIN), bx = (x / BIN) | 0, by = (y / BIN) | 0;
  let bd = R * R, best = null;
  for (let dy = -span; dy <= span; dy++) {
    const row = ((by + dy + BH) % BH) * BW;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = fhead[row + ((bx + dx + BW) % BW)]; k >= 0; k = fnext[k]) {
        if (fe[k] <= 0) continue;
        const ex = wdx(fx[k] - x), ey = wdy(fy[k] - y), d2 = ex * ex + ey * ey;
        if (d2 < bd) { bd = d2; best = [ex, ey]; }
      }
    }
  }
  return best;
}

// ---- movement ----------------------------------------------------------------------------------------
// The zygote cell carries the body: thrust pushes it along its heading, and drag pulls it
// toward the local current. Every other cell springs toward its place relative to its
// parent, with the muscles bending each joint in a travelling wave, so tails trail and
// sway and turns ripple down the body.
function move(o) {
  const pl = o.plan, g = o.genes, n = pl.n, M = o.mass;
  o.phase += (TAU * (0.3 + 2 * g.f)) / TPS;
  sampleFlow(o.x[0], o.y[0]);
  if (o.count[FLAG]) {
    const turn = (0.03 + 0.1 * g.agility) / Math.sqrt(M);
    o.h += clamp(angWrap(o.want - o.h), -turn, turn);
    const push = (THRUST * o.count[FLAG] * o.effort) / M;
    o.vx += Math.cos(o.h) * push; o.vy += Math.sin(o.h) * push;
  }
  o.h = angWrap(o.h + FW * 0.5);                      // eddies turn drifting bodies
  const k = DRAG / Math.pow(M, 0.2);
  o.vx = FU + (o.vx - FU) * (1 - k);
  o.vy = FV + (o.vy - FV) * (1 - k);
  const sp = Math.hypot(o.vx, o.vy);
  if (sp > VMAX) { o.vx *= VMAX / sp; o.vy *= VMAX / sp; }
  const dx = o.vx, dy = o.vy;
  o.x[0] += dx; o.y[0] += dy;
  const amp = 0.6 * g.amp, wave = 1.6 * g.wave, pulse = g.pulse > 0 ? g.pulse * Math.max(0, Math.cos(o.phase)) ** 3 : 0;
  for (let i = 1; i < n; i++) {
    if (!o.on[i]) continue;
    const p = pl.par[i], d = pl.dep[i];
    let base;
    if (p === 0) base = o.h;
    else { const q = pl.par[p]; base = Math.atan2(o.y[p] - o.y[q], o.x[p] - o.x[q]); }
    let a = pl.ang[i];
    if (p === 0 && pulse) a += Math.sign(a) * pulse * 0.7;   // the power stroke sweeps arms back
    const phi = base + a + amp * (d > 1 ? 1 : 0.5) * Math.sin(o.phase - wave * d);
    const L = pl.len[i] * (0.35 + 0.65 * o.s[i]);
    const x = o.x[i] + dx, y = o.y[i] + dy;
    o.x[i] = x + (o.x[p] + Math.cos(phi) * L - x) * FOLLOW;
    o.y[i] = y + (o.y[p] + Math.sin(phi) * L - y) * FOLLOW;
  }
  // keep the zygote cell inside the ocean, carrying the body with it
  const sx = o.x[0] < 0 ? WW : o.x[0] >= WW ? -WW : 0, sy = o.y[0] < 0 ? WH : o.y[0] >= WH ? -WH : 0;
  if (sx || sy) for (let i = 0; i < n; i++) { o.x[i] += sx; o.y[i] += sy; }
}

// ---- contact ---------------------------------------------------------------------------------------
function hashCells() {
  hhead.fill(-1);
  let k = 0;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const pl = o.plan;
    for (let i = 0; i < pl.n && k < HMAX; i++) {
      if (!o.on[i]) continue;
      const x = wrapX(o.x[i]), y = wrapY(o.y[i]), b = ((y / HB) | 0) * HBW + ((x / HB) | 0);
      hx[k] = x; hy[k] = y; hr[k] = pl.rad[i] * o.s[i]; ho[k] = o.slot + 1; hi[k] = i;
      hnext[k] = hhead[b]; hhead[b] = k;
      k++;
    }
  }
  nCells = k;
}

// Cells of different creatures that overlap push apart, and mouths and spikes act.
// Each pair is checked once: within a bucket, then against four of its eight neighbours.
const FWD_X = [1, -1, 0, 1], FWD_Y = [0, 1, 1, 1];
function collide() {
  hashCells();
  const HX = WW / 2, HY = WH / 2;
  for (let by = 0; by < HBH; by++) {
    for (let bx = 0; bx < HBW; bx++) {
      const first = hhead[by * HBW + bx];
      if (first < 0) continue;
      for (let a = first; a >= 0; a = hnext[a]) {
        const ax = hx[a], ay = hy[a], ar = hr[a], ao = ho[a];
        for (let k = -1; k < 4; k++) {
          let b;
          if (k < 0) b = hnext[a];
          else {
            const nx = bx + FWD_X[k], ny = by + FWD_Y[k];
            b = hhead[(ny >= HBH ? ny - HBH : ny) * HBW + (nx < 0 ? nx + HBW : nx >= HBW ? nx - HBW : nx)];
          }
          for (; b >= 0; b = hnext[b]) {
            if (ho[b] === ao) continue;
            let dx = hx[b] - ax, dy = hy[b] - ay;
            if (dx > HX) dx -= WW; else if (dx < -HX) dx += WW;
            if (dy > HY) dy -= WH; else if (dy < -HY) dy += WH;
            const rr = ar + hr[b];
            if (dx * dx + dy * dy < rr * rr) touch(a, b, dx, dy, rr);
          }
        }
      }
    }
  }
}

function touch(a, b, dx, dy, rr) {
  const A = slots[ho[a] - 1], B = slots[ho[b] - 1];
  if (!A || !B || !A.alive || !B.alive) return;
  const ia = hi[a], ib = hi[b];
  if (!A.on[ia] || !B.on[ib]) return;
  const d = Math.sqrt(dx * dx + dy * dy) || 0.01, over = rr - d, nx = dx / d, ny = dy / d;
  const wa = B.mass / (A.mass + B.mass), wb = 1 - wa, push = over * 0.5;
  A.x[ia] -= nx * push * wa; A.y[ia] -= ny * push * wa;
  B.x[ib] += nx * push * wb; B.y[ib] += ny * push * wb;
  A.vx -= nx * over * 0.03 * wa; A.vy -= ny * over * 0.03 * wa;
  B.vx += nx * over * 0.03 * wb; B.vy += ny * over * 0.03 * wb;
  const ta = A.plan.typ[ia], tb = B.plan.typ[ib];
  if (ta === MOUTH || ta === SPIKE) attack(A, ia, B, ib, ta);
  if (A.alive && B.alive && B.on[ib] && A.on[ia] && (tb === MOUTH || tb === SPIKE)) attack(B, ib, A, ia, tb);
}

function attack(A, ia, B, ib, type) {
  if (kin(A, B)) return;
  if (type === MOUTH && B.n === 1 && A.n > 1 && B.mass < A.mass * 0.25) { // a body swallows a lone cell whole
    if (Math.random() > BITE_RATE) return;
    A.E = Math.min(A.cap, A.E + Math.max(0, B.E) * 0.8 + B.plan.cost * 0.3);
    A.kills++; world.kills++;
    if (!world.flags.engulf && A.sp.proto.n > 1) first('engulf', `First engulfing: ${A.sp.name} swallows a ${B.sp.name}`, A.sp);
    die(B, 'swallowed by ' + A.sp.name, false);
    return;
  }
  if (Math.random() > (type === MOUTH ? BITE_RATE : STING_RATE)) return;
  if (B.mass > A.mass * 1.5 && Math.random() * B.mass > A.mass * 1.5) return; // too big to hurt
  const tb = B.plan.typ[ib];
  if (tb === SHELL && Math.random() < SHELL_BLOCK) return;
  if ((B.hp[ib] -= 1) > 0) return;
  const share = B.E > 0 ? B.E / B.n : 0;
  B.E -= share;
  if (type === MOUTH) {
    A.E = Math.min(A.cap, A.E + COST[tb] * 0.5 + share * PREY_SHARE);
    A.kills++; world.kills++;
    B.cause = 'eaten by ' + A.sp.name;
    if (!world.flags.bite && A.sp.proto.n > 1) first('bite', `First predator: ${A.sp.name} bites into a ${B.sp.name}`, A.sp);
    cutCell(B, ib, false);
  } else {
    B.cause = 'stung by ' + A.sp.name;
    addFood(B.x[ib], B.y[ib], share * 0.8);
    cutCell(B, ib, true);
  }
}

// ---- food -------------------------------------------------------------------------------------------
// Morsels well up at vents and drift off in plumes; a fine snow falls everywhere, and the
// dead break down into food. Everything drifts with the current and slowly decays.
function foodStep() {
  let k = 0;
  for (let i = 0; i < nFood; i++) {
    const e = fe[i];
    if (e < 0.15) continue;
    sampleFlow(fx[i], fy[i]);
    fx[k] = wrapX(fx[i] + FU + (Math.random() - 0.5) * 0.3);
    fy[k] = wrapY(fy[i] + FV + (Math.random() - 0.5) * 0.3);
    fe[k] = e * 0.998;
    k++;
  }
  nFood = k;
  const rate = 2 * P.food;
  for (const v of world.vents) {
    if (Math.random() < VENT_RATE * rate) addFood(v.x + rand(-8, 8), v.y + rand(-8, 8), FOOD_E);
  }
  if (Math.random() < SNOW_RATE * rate * 4) addFood(rand(0, WW), rand(0, WH), FOOD_E);
  hashFood();
}

function hashFood() {
  fhead.fill(-1);
  for (let i = 0; i < nFood; i++) {
    const b = binAt(fx[i], fy[i]);
    fnext[i] = fhead[b]; fhead[b] = i;
  }
}

// ---- the world tick -------------------------------------------------------------------------------
function step() {
  const t = ++world.t;
  if (t % 30 === 1) updateLight();
  if (t % 3 === 0) updateFlow();
  demandPrev.set(demandNow); demandNow.fill(0);
  const orgs = world.orgs;
  for (let i = orgs.length - 1; i > 0; i--) {     // fair turn order
    const j = randi(i + 1), tmp = orgs[i];
    orgs[i] = orgs[j]; orgs[j] = tmp;
  }
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) live(orgs[i]);
  collide();
  let k = 0;
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) orgs[k++] = orgs[i];
  orgs.length = k;
  flushBorn();
  foodStep();
  for (let i = world.links.length - 1; i >= 0; i--) if (--world.links[i].t <= 0) world.links.splice(i, 1);
  if (t % 15 === 0) census();
}

// ---- census, eras and the record -------------------------------------------------------------------
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
const ERAS = [
  ['Primordial', 'lone cells adrift in the current'],
  ['Colonial', 'cells that stay together after dividing'],
  ['Swimmers', 'multicellular bodies that swim'],
  ['Hunters', 'creatures that eat other creatures'],
  ['Sighted', 'creatures with eyes'],
  ['Complex', 'large bodies of three or more cell types'],
];

function census() {
  const st = world.stats, F = world.flags, types = st.types;
  types.fill(0);
  let orgs = 0, cells = 0, sq = 0, multi = 0, swim = 0, hunt = 0, sighted = 0, complex = 0, maxN = 0, big = null;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const n = o.n, sp = o.sp;
    orgs++; cells += n; sq += n * n;
    for (let t = 0; t < NT; t++) types[t] += o.count[t];
    if (n > maxN) { maxN = n; big = o; }
    if (n < 2) continue;
    multi++;
    let kinds = 0;
    for (let t = 0; t < NT; t++) if (o.count[t]) kinds++;
    // milestones wait for an established species whose founding body has the trait
    const pr = sp.proto, est = sp.alive >= 5 && pr.n > 1;
    if (est && !F.multi) first('multi', `First multicellular species: ${sp.name}`, sp);
    if (o.count[FLAG]) { swim++; if (est && pr.count[FLAG] && !F.swim) first('swim', `A multicellular body swims: ${sp.name}`, sp); }
    if (o.count[MOUTH] && o.kills) hunt++;
    if (o.count[EYE]) { sighted++; if (est && pr.count[EYE] && !F.eye) first('eye', `Eyes evolve: ${sp.name}`, sp); }
    if (est && pr.count[SPIKE] && !F.spike) first('spike', `Spines evolve: ${sp.name}`, sp);
    if (est && pr.count[SHELL] && !F.shell) first('shell', `Armour evolves: ${sp.name}`, sp);
    if (est && pr.sym && pr.n >= 6 && !F['sym' + pr.sym]) first('sym' + pr.sym, `First ${SYMS[pr.sym]} body plan: ${sp.name}`, sp);
    if (kinds >= 3 && n >= 12) {
      complex++;
      if (est && pr.kinds >= 3 && pr.n >= 12 && !F.complex) first('complex', `Complex life: ${sp.name}, ${pr.n} cells of ${pr.kinds} types`, sp);
    }
  }
  for (const k of [5, 10, 20, 30]) {
    if (maxN >= k && !F['size' + k]) first('size' + k, `First ${k}-cell creature: ${big.sp.name}`, big.sp);
  }
  Object.assign(st, {
    orgs, cells, multi, swim, hunt, sighted, complex, maxN, food: nFood,
    wavg: cells ? sq / cells : 0, species: world.species.size,
  });
  const ok = [true, multi >= 15, swim >= 10, hunt >= 5, sighted >= 8, complex >= 3];
  if (world.era < 5 && ok[world.era + 1] && world.t - world.eraT[world.era] > 30 * TPS) {
    const e = ++world.era;
    world.eraT.push(world.t);
    logEvent('era', `Era ${ROMAN[e]} · ${ERAS[e][0]}: ${ERAS[e][1]}`);
  }
  rankSpecies();
  sampleHistory();
  if (!orgs && !F.dead) {
    F.dead = world.t;
    logEvent('extinct', 'All life is extinct. Seed the ocean or start a new world.');
  } else if (orgs && F.dead) F.dead = 0;
}

function rankSpecies() {
  const list = [...world.species];
  for (const sp of list) sp.mass = sp.alive * sp.proto.n;
  list.sort((a, b) => b.mass - a.mass);
  world.top = list.slice(0, 8);
  const lead = list[0];
  if (lead && lead.proto.n > 1 && lead !== world.lead && world.t - world.leadT > 60 * TPS) {
    world.lead = lead; world.leadT = world.t;
    logEvent('lead', `New dominant species: ${lead.name}, ${lead.alive} creatures`, lead);
  }
}

function sampleHistory() {
  const h = world.hist;
  if (world.t < h.next) return;
  h.next = world.t + h.every;
  h.t.push(world.t); h.wavg.push(world.stats.wavg); h.max.push(world.stats.maxN);
  if (h.t.length >= 480) {
    for (const k of ['t', 'wavg', 'max']) h[k] = h[k].filter((_, i) => i % 2 === 0);
    h.every *= 2;
  }
}

function logEvent(kind, text, sp) {
  world.events.unshift({ t: world.t, kind, text, sp: sp || null });
  if (world.events.length > 80) world.events.length = 80;
}
function first(key, text, sp) {
  world.flags[key] = world.t;
  logEvent('first', text, sp);
}

// ---- tools -------------------------------------------------------------------------------------------
function feedAt(x, y, r, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = Math.sqrt(Math.random()) * r;
    addFood(x + Math.cos(a) * d, y + Math.sin(a) * d, FOOD_E);
  }
}

// Push the water along the drag. The push spreads a little and fades over a few seconds.
function stirAt(x, y, dx, dy) {
  const L = Math.hypot(dx, dy);
  if (L < 0.5) return;
  world.swirls.push({ x: mod(x, WW), y: mod(y, WH), r: 60, u: dx / L, v: dy / L, str: clamp(L * 0.08, 0.8, 2.6) });
  if (world.swirls.length > 16) world.swirls.shift();
  updateFlow();
}

function zapAt(x, y, r) {
  const span = Math.ceil(r / HB) + 1, bx = (mod(x, WW) / HB) | 0, by = (mod(y, WH) / HB) | 0;
  for (let dy = -span; dy <= span; dy++) {
    const row = ((by + dy + HBH) % HBH) * HBW;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = hhead[row + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        const o = slots[ho[k] - 1];
        if (!o || !o.alive || !o.on[hi[k]]) continue;
        const ex = wdx(hx[k] - x), ey = wdy(hy[k] - y);
        if (ex * ex + ey * ey > r * r) continue;
        o.cause = 'vaporised';
        cutCell(o, hi[k], true);
      }
    }
  }
}

function protoSpecies(t) {
  for (const sp of world.species) if (!sp.parent && sp.proto.n === 1 && sp.proto.root === t) return sp;
  return newSpecies(makePlan(t, 0.5, [], 0), t === PHOTO ? 150 : 35, null, TYPES[t].name + ' protocell');
}

function seedAt(x, y, n) {
  for (let i = 0; i < n; i++) {
    const sp = protoSpecies(Math.random() < 0.65 ? PHOTO : MOUTH);
    spawn(sp.proto, randomGenes(), sp, x + rand(-20, 20), y + rand(-20, 20), rand(0, TAU), 4, 0, null);
  }
}

function pickOrg(x, y) {
  let best = null, bd = 14 * 14;
  const bx = (mod(x, WW) / HB) | 0, by = (mod(y, WH) / HB) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    const row = ((by + dy + HBH) % HBH) * HBW;
    for (let dx = -1; dx <= 1; dx++) {
      for (let k = hhead[row + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        const ex = wdx(hx[k] - x), ey = wdy(hy[k] - y), d2 = ex * ex + ey * ey;
        const o = slots[ho[k] - 1];
        if (d2 < bd && o && o.alive) { bd = d2; best = o; }
      }
    }
  }
  return best;
}

// Pelagic: canvas renderer. Creatures are drawn in batches: one translucent membrane path
// per species (overlapping cells merge into a single silhouette), then the cell bodies,
// then each kind of organelle. A downscaled copy of the frame added back on top gives the
// glow. The ocean wraps, so anything near a seam is drawn on both sides.

const BG = '#03070c', ACCENT = '#5cf2b6';
const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace';
const view = {
  zoom: 1, cx: WW / 2, cy: WH / 2, cw: 1, ch: 1, dpr: 1, glow: true, currents: false,
  selected: null, follow: false, highlight: null, hover: null, pointer: null, tool: 'inspect', brush: 40,
};
let cv, ctx, bloom, bctx;
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

function initRender(canvas) {
  cv = canvas;
  ctx = cv.getContext('2d');
  bloom = document.createElement('canvas');
  bctx = bloom.getContext('2d');
}

// ---- view geometry: zoom 1 fills the window with ocean ----------------------------------------
const viewScale = () => Math.max(view.cw / WW, view.ch / WH) * view.zoom; // css px per unit
function screenToWorld(px, py) {
  const sc = viewScale();
  return { x: mod(view.cx + (px - view.cw / 2) / sc, WW), y: mod(view.cy + (py - view.ch / 2) / sc, WH) };
}
function resizeView(w, h) {
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.cw = Math.max(1, w); view.ch = Math.max(1, h);
  cv.width = Math.round(view.cw * view.dpr);
  cv.height = Math.round(view.ch * view.dpr);
  bloom.width = Math.max(1, cv.width >> 2);
  bloom.height = Math.max(1, cv.height >> 2);
}
function speciesColors(sp) {
  if (!sp.col) {
    const h = sp.hue.toFixed(0);
    sp.col = { skin: `hsla(${h},70%,56%,0.3)`, body: `hsla(${h},72%,62%,0.88)`, line: `hsl(${h},80%,70%)` };
  }
  return sp.col;
}

// The images of a creature that fall on screen, as offsets to add to its coordinates: the
// copy nearest the view centre, plus a copy across any seam the window spans.
const imgX = [], imgY = [];
function images(o, halfW, halfH) {
  const pad = o.plan.reach + 12, rx = o.x[0] - view.cx, ry = o.y[0] - view.cy, bx = wdx(rx), by = wdy(ry);
  let n = 0;
  for (const sy of [0, -WH, WH]) {
    const y = by + sy;
    if (y + pad < -halfH || y - pad > halfH) continue;
    for (const sx of [0, -WW, WW]) {
      const x = bx + sx;
      if (x + pad < -halfW || x - pad > halfW) continue;
      imgX[n] = x - rx; imgY[n] = y - ry; n++;
    }
  }
  return n;
}

// ---- frame ----------------------------------------------------------------------------------------
const groups = new Map();
function render() {
  const d = view.dpr, sc = viewScale(), S = sc * d, W2 = cv.width / 2, H2 = cv.height / 2;
  const halfW = view.cw / 2 / sc, halfH = view.ch / 2 / sc;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cv.width, cv.height);
  // screen position of a world point, given an image offset
  const X = (x, ox) => W2 + (x + ox - view.cx) * S, Y = (y, oy) => H2 + (y + oy - view.cy) * S;
  drawLight(S, W2, H2);
  if (view.currents) drawCurrents(S, W2, H2, halfW, halfH);
  drawFood(S, W2, H2, halfW, halfH);

  // gather visible creature images by species
  for (const list of groups.values()) list.length = 0;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const n = images(o, halfW, halfH);
    if (!n) continue;
    let list = groups.get(o.sp);
    if (!list) groups.set(o.sp, (list = []));
    for (let k = 0; k < n; k++) list.push(o, imgX[k], imgY[k]);
  }
  const detail = 4.2 * S, organelles = detail >= 2.4;
  // Each creature's membrane is its own shape: a disc round every cell and a band of
  // tissue to its parent cell, so a body reads as one organism and neighbours stay apart.
  for (const [sp, list] of groups) {
    ctx.fillStyle = speciesColors(sp).skin;
    for (let j = 0; j < list.length; j += 3) {
      const o = list[j], ox = list[j + 1], oy = list[j + 2], pl = o.plan;
      ctx.beginPath();
      for (let i = 0; i < pl.n; i++) {
        if (!o.on[i]) continue;
        const r = Math.max(1, pl.rad[i] * o.s[i] * S * 1.18), x = X(o.x[i], ox), y = Y(o.y[i], oy);
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
        if (i === 0) continue;
        const p = pl.par[i], px = X(o.x[p], ox), py = Y(o.y[p], oy), dx = x - px, dy = y - py, L = Math.hypot(dx, dy);
        if (L < 0.5) continue;
        const nx = -dy / L, ny = dx / L, w = r * 0.62, wp = pl.rad[p] * o.s[p] * S * 0.74;
        ctx.moveTo(px + nx * wp, py + ny * wp);
        ctx.lineTo(x + nx * w, y + ny * w);
        ctx.lineTo(x - nx * w, y - ny * w);
        ctx.lineTo(px - nx * wp, py - ny * wp);
        ctx.closePath();
      }
      ctx.fill();
    }
  }
  if (detail >= 1.6) {                      // the cells inside, unless far out
    for (const [sp, list] of groups) {
      if (!list.length) continue;
      ctx.fillStyle = speciesColors(sp).body;
      ctx.beginPath();
      for (let j = 0; j < list.length; j += 3) {
        const o = list[j], ox = list[j + 1], oy = list[j + 2], pl = o.plan;
        for (let i = 0; i < pl.n; i++) {
          if (!o.on[i]) continue;
          const r = Math.max(0.6, pl.rad[i] * o.s[i] * S * 0.66), x = X(o.x[i], ox), y = Y(o.y[i], oy);
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, TAU);
        }
      }
      ctx.fill();
    }
  }
  if (organelles) drawOrganelles(S, X, Y);
  if (view.glow) {
    bctx.globalCompositeOperation = 'copy';
    bctx.drawImage(cv, 0, 0, bloom.width, bloom.height);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 / Math.sqrt(view.zoom);   // the halo stays subtle up close
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  drawOverlay(S, X, Y, halfW, halfH);
}

function drawLight(S, W2, H2) {
  ctx.globalCompositeOperation = 'lighter';
  const k = 0.4 + 1.2 * P.light;
  for (const s of world.suns) {
    for (const sy of [0, -WH, WH]) {
      for (const sx of [0, -WW, WW]) {
        const x = W2 + (wdx(s.x - view.cx) + sx) * S, y = H2 + (wdy(s.y - view.cy) + sy) * S, r = s.r * 2.2 * S;
        if (x + r < 0 || x - r > cv.width || y + r < 0 || y - r > cv.height) continue;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(40,150,170,${(0.13 * s.amp * k).toFixed(3)})`);
        g.addColorStop(0.5, `rgba(30,110,150,${(0.05 * s.amp * k).toFixed(3)})`);
        g.addColorStop(1, 'rgba(20,80,120,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
  }
  for (const v of world.vents) {
    const x = W2 + wdx(v.x - view.cx) * S, y = H2 + wdy(v.y - view.cy) * S, r = 26 * S;
    if (x + r < 0 || x - r > cv.width || y + r < 0 || y - r > cv.height) continue;
    const pulse = 0.75 + 0.25 * Math.sin(world.t * 0.05 + v.x);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,170,110,${(0.22 * pulse).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,120,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawCurrents(S, W2, H2, halfW, halfH) {
  ctx.strokeStyle = 'rgba(160,200,230,0.09)';
  ctx.lineWidth = view.dpr;
  ctx.beginPath();
  const step = 40, x0 = Math.floor((view.cx - halfW) / step) * step, y0 = Math.floor((view.cy - halfH) / step) * step;
  for (let y = y0; y <= view.cy + halfH + step; y += step) {
    for (let x = x0; x <= view.cx + halfW + step; x += step) {
      sampleFlow(x, y);
      const sx = W2 + (x - view.cx) * S, sy = H2 + (y - view.cy) * S;
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + FU * 28 * S, sy + FV * 28 * S);
    }
  }
  ctx.stroke();
}

function drawFood(S, W2, H2, halfW, halfH) {
  const d = view.dpr, r = clamp(0.8 * S, 0.7 * d, 2.4 * d), round = r > 1.6 * d;
  ctx.fillStyle = 'rgba(255,214,160,0.6)';
  ctx.beginPath();
  for (let i = 0; i < nFood; i++) {
    const dx = wdx(fx[i] - view.cx), dy = wdy(fy[i] - view.cy);
    if (dx < -halfW || dx > halfW || dy < -halfH || dy > halfH) continue;
    const x = W2 + dx * S, y = H2 + dy * S;
    if (round) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); } else ctx.rect(x - r, y - r, r * 2, r * 2);
  }
  ctx.fill();
}

// Organelles, one batch per kind across every visible creature.
function drawOrganelles(S, X, Y) {
  const lists = [...groups.values()];
  const each = (fn) => {
    for (const list of lists) {
      for (let j = 0; j < list.length; j += 3) {
        const o = list[j], ox = list[j + 1], oy = list[j + 2], pl = o.plan;
        for (let i = 0; i < pl.n; i++) if (o.on[i]) fn(o, i, X(o.x[i], ox), Y(o.y[i], oy), pl.rad[i] * o.s[i] * S, pl.typ[i]);
      }
    }
  };
  // the direction a cell faces: away from its parent, or the heading for the zygote cell
  const face = (o, i) => {
    if (i === 0) return o.h;
    const p = o.plan.par[i];
    return Math.atan2(o.y[i] - o.y[p], o.x[i] - o.x[p]);
  };
  // flagella: beating whips
  ctx.strokeStyle = rgba(TYPES[FLAG].rgb, 0.85);
  ctx.lineWidth = Math.max(0.8, 0.9 * S);
  ctx.lineCap = 'round';
  ctx.beginPath();
  each((o, i, x, y, r, t) => {
    if (t !== FLAG) return;
    const a = i === 0 ? o.h + Math.PI : face(o, i), c = Math.cos(a), s = Math.sin(a), L = r * 3.4;
    const wob = Math.sin(o.phase * 1.7 + i) * r * 1.3, x1 = x + c * r, y1 = y + s * r;
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(x1 + c * L * 0.5 - s * wob, y1 + s * L * 0.5 + c * wob, x1 + c * L + s * wob * 0.6, y1 + s * L - c * wob * 0.6);
  });
  ctx.stroke();
  // spikes: thorns pointing outward
  ctx.fillStyle = rgba(TYPES[SPIKE].rgb, 0.9);
  ctx.beginPath();
  each((o, i, x, y, r, t) => {
    if (t !== SPIKE) return;
    const a = face(o, i), c = Math.cos(a), s = Math.sin(a);
    ctx.moveTo(x - s * r * 0.55, y + c * r * 0.55);
    ctx.lineTo(x + c * r * 2.3, y + s * r * 2.3);
    ctx.lineTo(x + s * r * 0.55, y - c * r * 0.55);
    ctx.closePath();
  });
  ctx.fill();
  // shells: a bright rim
  ctx.strokeStyle = rgba(TYPES[SHELL].rgb, 0.9);
  ctx.lineWidth = Math.max(0.8, 1.1 * S);
  ctx.beginPath();
  each((o, i, x, y, r, t) => {
    if (t !== SHELL) return;
    ctx.moveTo(x + r * 1.02, y);
    ctx.arc(x, y, r * 1.02, 0, TAU);
  });
  ctx.stroke();
  // chloroplasts, mouths and eyes
  for (const [type, k, col] of [[PHOTO, 0.42, rgba(TYPES[PHOTO].rgb, 0.95)], [MOUTH, 0.5, rgba(TYPES[MOUTH].rgb, 0.95)], [EYE, 0.55, rgba(TYPES[EYE].rgb, 1)]]) {
    ctx.fillStyle = col;
    ctx.beginPath();
    each((o, i, x, y, r, t) => {
      if (t !== type) return;
      ctx.moveTo(x + r * k, y);
      ctx.arc(x, y, r * k, 0, TAU);
    });
    ctx.fill();
  }
  // mouth openings and pupils
  ctx.fillStyle = 'rgba(8,10,16,0.9)';
  ctx.beginPath();
  each((o, i, x, y, r, t) => {
    if (t === MOUTH) {
      const a = face(o, i), px = x + Math.cos(a) * r * 0.18, py = y + Math.sin(a) * r * 0.18;
      ctx.moveTo(px + r * 0.24, py);
      ctx.arc(px, py, r * 0.24, 0, TAU);
    } else if (t === EYE) {
      const a = o.mode >= M_FORAGE ? Math.atan2(wdy(o.ty - o.y[i]), wdx(o.tx - o.x[i])) : o.h;
      const px = x + Math.cos(a) * r * 0.24, py = y + Math.sin(a) * r * 0.24;
      ctx.moveTo(px + r * 0.27, py);
      ctx.arc(px, py, r * 0.27, 0, TAU);
    }
  });
  ctx.fill();
}

// ---- overlay ------------------------------------------------------------------------------------
const MODE_COLOR = ['', '', '', '#ffc45c', '#ff526e', '#eef3ff', '#5cf2b6', '#5ac8ff'];
function bounds(o) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const pl = o.plan;
  for (let i = 0; i < pl.n; i++) {
    if (!o.on[i]) continue;
    const r = pl.rad[i] * o.s[i];
    x0 = Math.min(x0, o.x[i] - r); x1 = Math.max(x1, o.x[i] + r);
    y0 = Math.min(y0, o.y[i] - r); y1 = Math.max(y1, o.y[i] + r);
  }
  return { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
function bracket(x0, y0, x1, y1, L) {
  ctx.beginPath();
  ctx.moveTo(x0, y0 + L); ctx.lineTo(x0, y0); ctx.lineTo(x0 + L, y0);
  ctx.moveTo(x1 - L, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + L);
  ctx.moveTo(x1, y1 - L); ctx.lineTo(x1, y1); ctx.lineTo(x1 - L, y1);
  ctx.moveTo(x0 + L, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - L);
  ctx.stroke();
}
function drawTag(text, x, y, color) {
  const d = view.dpr;
  ctx.font = `${10 * d}px ${MONO}`;
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(3,7,12,0.7)';
  ctx.fillRect(x - 2 * d, y - 12 * d, ctx.measureText(text).width + 4 * d, 13 * d);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawOverlay(S, X, Y, halfW, halfH) {
  const d = view.dpr;
  // the nearest image of a creature, in screen space
  const near = (o) => [wdx(o.x[0] - view.cx) - (o.x[0] - view.cx), wdy(o.y[0] - view.cy) - (o.y[0] - view.cy)];
  ctx.lineWidth = d;
  for (const L of world.links) {
    if (!L.a.alive || !L.b.alive) continue;
    const [ox, oy] = near(L.a), bx = L.a.x[0] + ox + wdx(L.b.x[0] - L.a.x[0]), by = L.a.y[0] + oy + wdy(L.b.y[0] - L.a.y[0]);
    ctx.strokeStyle = `rgba(255,170,220,${(L.t / 20) * 0.7})`;
    ctx.beginPath();
    ctx.moveTo(X(L.a.x[0], ox), Y(L.a.y[0], oy));
    ctx.lineTo(X(bx, 0), Y(by, 0));
    ctx.stroke();
  }
  const hl = view.highlight;
  if (hl && hl.alive > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    let k = 0;
    for (const o of world.orgs) {
      if (o.sp !== hl || !o.alive) continue;
      const [ox, oy] = near(o), x = X(o.x[0], ox), y = Y(o.y[0], oy), r = (o.plan.reach + 6) * S;
      if (x < -r || y < -r || x > cv.width + r || y > cv.height + r) continue;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.stroke();
      if (++k >= 300) break;
    }
  }
  const o = view.selected;
  if (o && o.alive) {
    const [ox, oy] = near(o), b = bounds(o), pad = 5 * d;
    const x0 = X(b.x0, ox) - pad, y0 = Y(b.y0, oy) - pad, x1 = X(b.x1, ox) + pad, y1 = Y(b.y1, oy) + pad;
    const cx = X(o.x[0], ox), cy = Y(o.y[0], oy);
    if (o.count[FLAG]) {
      ctx.setLineDash([3 * d, 5 * d]);
      ctx.strokeStyle = 'rgba(236,242,255,0.25)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(SENSE_MAX, SENSE_BASE + SENSE_EYE * o.count[EYE]) * S, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      if (o.mode >= M_FORAGE && MODE_COLOR[o.mode]) {
        ctx.strokeStyle = MODE_COLOR[o.mode];
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + wdx(o.tx - o.x[0]) * S, cy + wdy(o.ty - o.y[0]) * S);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 1.5 * d;
    bracket(x0, y0, x1, y1, Math.max(4 * d, Math.min(12 * d, (x1 - x0) / 3)));
    drawTag(o.sp.name.toUpperCase(), x0, y0 - 6 * d, ACCENT);
  }
  const h = view.hover;
  if (h && h.alive && h !== o && view.tool === 'inspect') {
    const [ox, oy] = near(h), b = bounds(h), pad = 4 * d;
    ctx.strokeStyle = 'rgba(230,237,247,0.6)';
    ctx.lineWidth = d;
    bracket(X(b.x0, ox) - pad, Y(b.y0, oy) - pad, X(b.x1, ox) + pad, Y(b.y1, oy) + pad, 5 * d);
    drawTag(`${h.sp.name} · ${h.n}`, X(b.x0, ox) - pad, Y(b.y0, oy) - pad - 4 * d, 'rgba(230,237,247,0.85)');
  }
  const p = view.pointer;
  if (p && view.tool !== 'inspect') {
    const r = (view.tool === 'zap' ? 14 : view.tool === 'seed' ? 20 : view.brush) * S;
    ctx.strokeStyle = view.tool === 'zap' ? 'rgba(205,195,255,0.8)' : 'rgba(230,237,247,0.45)';
    ctx.lineWidth = d;
    ctx.beginPath();
    ctx.arc(cv.width / 2 + wdx(p.x - view.cx) * S, cv.height / 2 + wdy(p.y - view.cy) * S, r, 0, TAU);
    ctx.stroke();
  }
}

// A small picture of a species' founding body at rest, for the HUD. Cached on the species.
function glyph(sp, size) {
  const key = 'g' + size;
  if (sp[key]) return sp[key];
  const d = Math.max(1, view.dpr), c = document.createElement('canvas'), pl = sp.proto;
  c.width = c.height = Math.round(size * d);
  const g = c.getContext('2d'), span = Math.max(12, pl.reach * 2.4), k = c.width / span;
  let mx = 0, my = 0;
  for (let i = 0; i < pl.n; i++) { mx += pl.rx[i]; my += pl.ry[i]; }
  mx /= pl.n; my /= pl.n;
  // pointing up, centred on the body
  const P = (i) => [c.width / 2 + (pl.ry[i] - my) * k, c.height / 2 - (pl.rx[i] - mx) * k];
  const col = speciesColors(sp);
  for (const [style, f] of [[col.skin, 1.3], [col.body, 0.72]]) {
    g.fillStyle = style;
    g.beginPath();
    for (let i = 0; i < pl.n; i++) {
      const [x, y] = P(i), r = pl.rad[i] * k * f;
      g.moveTo(x + r, y);
      g.arc(x, y, r, 0, TAU);
    }
    g.fill();
  }
  for (let i = 0; i < pl.n; i++) {
    const t = pl.typ[i], [x, y] = P(i), r = pl.rad[i] * k;
    g.fillStyle = g.strokeStyle = rgba(TYPES[t].rgb, 0.95);
    g.beginPath();
    if (t === SHELL) { g.lineWidth = Math.max(1, r * 0.3); g.arc(x, y, r, 0, TAU); g.stroke(); continue; }
    if (t === FLAG) {
      const a = i === 0 ? Math.PI / 2 : Math.atan2(y - P(pl.par[i])[1], x - P(pl.par[i])[0]);
      g.lineWidth = Math.max(1, r * 0.25);
      g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 3, y + Math.sin(a) * r * 3);
      g.stroke();
      continue;
    }
    g.arc(x, y, r * (t === SPIKE ? 0.6 : 0.45), 0, TAU);
    g.fill();
  }
  sp[key] = c;
  return c;
}

// Pelagic: controls, HUD and the main loop.

const SPEEDS = [0.5, 1, 2, 4, 8];
const TOOL_KEYS = ['inspect', 'feed', 'stir', 'zap', 'seed'];
const TOOL_HINTS = {
  inspect: 'Click a creature to inspect it · drag to pan · scroll to zoom · H hides the HUD',
  feed: 'Drag to scatter food',
  stir: 'Drag to push the water',
  zap: 'Drag to vaporise cells · whatever grew from a lost cell goes with it',
  seed: 'Click to release a cluster of lone cells',
};
const $ = (id) => document.getElementById(id);
const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let running = true, speed = 1, acc = 0, last = 0, hudWait = 0, hintWait = 0, pointer = null, logKey = '';

function clockText(secs) {
  const s = Math.floor(secs), h = Math.floor(s / 3600);
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function roleOf(pl) {
  const c = pl.count, p = c[PHOTO] > 0, m = c[MOUTH] > 0, f = c[FLAG] > 0;
  let r = m && f ? (p ? 'Hunting mixotroph' : 'Hunter') : p && m ? 'Mixotroph' : p ? 'Phototroph' : m ? 'Grazer' : 'Drifter';
  const mods = [];
  if (f && !m) mods.push('swimmer');
  if (c[EYE]) mods.push('sighted');
  if (c[SHELL]) mods.push('armoured');
  if (c[SPIKE]) mods.push('spined');
  return mods.length ? `${r} · ${mods.join(', ')}` : r;
}

function gaitOf(o) {
  if (!o.count[FLAG]) return 'drifts';
  const g = o.genes;
  if (g.pulse > 0.5) return 'pulses';
  if (g.amp > 0.35 && o.plan.depthMax >= 2) return 'undulates';
  return 'glides';
}

function statusOf(o) {
  return o.alive ? MODE_NAMES[o.mode] : 'Dead · ' + o.cause;
}

// ---- controls --------------------------------------------------------------------------------
function setRunning(on) {
  running = on;
  const b = $('play');
  b.textContent = on ? 'Pause' : 'Play';
  b.title = `${on ? 'Pause' : 'Play'} (Space)`;
  b.classList.toggle('on', !on);
}
function setSpeed(i) {
  speed = clamp(i, 0, SPEEDS.length - 1);
  document.querySelectorAll('[data-speed]').forEach((b) => b.classList.toggle('on', +b.dataset.speed === speed));
}
function setTool(name) {
  view.tool = name;
  document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === name));
  $('view').style.cursor = name === 'inspect' ? 'default' : 'crosshair';
  showHint(TOOL_HINTS[name]);
}
function showHint(text) {
  $('hint').textContent = text;
  $('hint').classList.add('show');
  hintWait = 7;
}
function toggle(key) {
  view[key] = !view[key];
  $(key === 'glow' ? 't-glow' : 't-flow').classList.toggle('on', view[key]);
}
function fitView() { view.zoom = 1; }
function newWorld() {
  resetWorld();
  select(null);
  view.highlight = null; logKey = '';
  updateHud();
}
function select(o) {
  view.selected = o;
  if (!o) { view.follow = false; $('i-follow').checked = false; }
  updateInspector();
}

function bindControls() {
  document.querySelectorAll('[data-speed]').forEach((b) => (b.onclick = () => setSpeed(+b.dataset.speed)));
  document.querySelectorAll('[data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
  $('play').onclick = () => setRunning(!running);
  $('new').onclick = newWorld;
  $('t-glow').onclick = () => toggle('glow');
  $('t-flow').onclick = () => toggle('currents');
  $('i-close').onclick = () => select(null);
  $('i-follow').onchange = (e) => {
    view.follow = e.target.checked;
    if (view.follow && view.zoom < 2.5) view.zoom = 3;
  };
  $('p-light').oninput = (e) => { P.light = e.target.value / 100; updateLight(); };
  $('p-food').oninput = (e) => { P.food = e.target.value / 100; };
  $('p-mut').oninput = (e) => { P.mutation = e.target.value / 100; };
  // Buttons drop focus after a click, so Space and the shortcuts keep working.
  document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });
  $('legend').innerHTML = TYPES.map((T, t) =>
    `<li title="${T.name}: ${T.role}"><i style="background:rgb(${T.rgb});box-shadow:0 0 5px rgb(${T.rgb})"></i>${T.name}<b id="lg-${t}">0</b></li>`).join('');
  $('comp').innerHTML = TYPES.map((T) => `<i style="background:rgb(${T.rgb})"></i>`).join('');
  $('i-genes').innerHTML = GENES.map(([k, name]) => `<div class="gene"><span>${name}</span><u><i data-gene="${k}"></i></u></div>`).join('');
  const ol = $('species');
  for (let i = 0; i < 6; i++) {
    const li = document.createElement('li');
    li.innerHTML = '<canvas width="56" height="56"></canvas><div class="f-txt"><b></b><span></span></div><em></em>';
    li.title = 'Highlight this species in the ocean';
    li.onclick = () => {
      if (!li.sp) return;
      view.highlight = view.highlight === li.sp ? null : li.sp;
      updateForms();
    };
    ol.appendChild(li);
  }
}

function bindKeys() {
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.type === 'range' && e.key.startsWith('Arrow')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === ' ') setRunning(!running);
    else if (k >= '1' && k <= '5') setTool(TOOL_KEYS[+k - 1]);
    else if (k === 'r') newWorld();
    else if (k === 'f') fitView();
    else if (k === 'g') toggle('glow');
    else if (k === 'c') toggle('currents');
    else if (k === 'h') document.body.classList.toggle('bare');
    else if (k === '+' || k === '=' || k === ']') setSpeed(speed + 1);
    else if (k === '-' || k === '_' || k === '[') setSpeed(speed - 1);
    else if (k === '.' && !running) step();
    else if (k === 'Escape') { select(null); view.highlight = null; }
    else return;
    e.preventDefault();
  });
}

// ---- pointer --------------------------------------------------------------------------------------
function bindPointer() {
  const el = $('view');
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    const pan = { mode: 'pan', x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: 0, clear: false };
    if (e.button !== 0 || e.shiftKey) pointer = pan;
    else if (view.tool === 'inspect') {
      const o = pickOrg(w.x, w.y);
      if (o) { select(o); pointer = null; } else pointer = Object.assign(pan, { clear: true });
    } else {
      pointer = { mode: 'tool', wait: 0, px: e.clientX, py: e.clientY };
      useTool(w, 0, true, 0, 0);
    }
  });
  el.addEventListener('pointermove', (e) => {
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    if (pointer && pointer.mode === 'pan') {
      const sc = viewScale();
      pointer.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      view.cx = mod(pointer.cx - (e.clientX - pointer.x) / sc, WW);
      view.cy = mod(pointer.cy - (e.clientY - pointer.y) / sc, WH);
      if (pointer.moved > 4) view.follow = $('i-follow').checked = false;
    } else if (pointer && pointer.mode === 'tool' && view.tool === 'stir') {
      const sc = viewScale();
      stirAt(w.x, w.y, (e.clientX - pointer.px) / sc, (e.clientY - pointer.py) / sc);
      pointer.px = e.clientX; pointer.py = e.clientY;
    } else if (!pointer && view.tool === 'inspect') view.hover = pickOrg(w.x, w.y);
  });
  const end = () => {
    if (pointer && pointer.mode === 'pan' && pointer.clear && pointer.moved <= 4) select(null);
    pointer = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (!pointer) view.pointer = view.hover = null; });
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const sc0 = viewScale(), mx = e.offsetX - view.cw / 2, my = e.offsetY - view.ch / 2;
    view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0015), 1, 12);
    const sc1 = viewScale();
    view.cx = mod(view.cx + mx / sc0 - mx / sc1, WW);
    view.cy = mod(view.cy + my / sc0 - my / sc1, WH);
  }, { passive: false });
}

function useTool(w, dt, first) {
  if (view.tool === 'feed') feedAt(w.x, w.y, view.brush, first ? 12 : Math.ceil(90 * dt));
  else if (view.tool === 'zap') zapAt(w.x, w.y, 14);
  else if (view.tool === 'seed' && (first || (pointer.wait += dt) > 0.3)) {
    pointer.wait = 0;
    seedAt(w.x, w.y, 8);
  }
}

// ---- HUD ----------------------------------------------------------------------------------------
function setText(id, v) {
  const el = $(id);
  if (el.textContent !== v) el.textContent = v;
}

function updateHud() {
  const st = world.stats, e = world.era;
  setText('era-num', 'Era ' + ROMAN[e]);
  setText('era-name', ERAS[e][0]);
  setText('era-desc', ERAS[e][1]);
  document.querySelectorAll('#era-track i').forEach((el, i) => el.classList.toggle('on', i <= e));
  setText('clock', 'T+' + clockText(world.t / TPS));
  setText('s-orgs', fmtInt(st.orgs));
  setText('s-cells', fmtInt(st.cells));
  setText('s-multi', fmtInt(st.multi));
  setText('s-swim', fmtInt(st.swim));
  setText('s-species', fmtInt(st.species));
  setText('s-max', String(st.maxN));
  setText('s-mean', st.wavg.toFixed(1));
  const bars = $('comp').children, total = Math.max(1, st.cells);
  for (let t = 0; t < NT; t++) {
    bars[t].style.width = ((100 * st.types[t]) / total).toFixed(2) + '%';
    setText('lg-' + t, fmtInt(st.types[t]));
  }
  updateForms();
  updateInspector();
  updateLog();
  drawChart();
}

function updateForms() {
  const top = world.top.slice(0, 6);
  $('species').querySelectorAll('li').forEach((li, i) => {
    const sp = top[i];
    li.hidden = !sp;
    if (!sp) { li.sp = null; return; }
    if (li.sp !== sp) {
      li.sp = sp;
      const c = li.querySelector('canvas'), g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.drawImage(glyph(sp, 28), 0, 0, c.width, c.height);
      li.querySelector('b').textContent = sp.name;
      li.querySelector('span').textContent = `${sp.proto.n} ${sp.proto.n === 1 ? 'cell' : 'cells'} · ${roleOf(sp.proto)}`;
    }
    li.querySelector('em').textContent = '×' + fmtInt(sp.alive);
    li.classList.toggle('on', view.highlight === sp);
  });
}

function updateInspector() {
  const o = view.selected, card = $('inspector');
  card.hidden = !o;
  $('right').classList.toggle('inspecting', !!o);
  if (!o) return;
  const pl = o.plan;
  if (card.o !== o) {
    card.o = o;
    const c = $('i-glyph'), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(glyph(o.sp, 48), 0, 0, c.width, c.height);
    $('i-name').textContent = o.sp.name;
    $('i-role').textContent = roleOf(pl);
    document.querySelectorAll('[data-gene]').forEach((el) => { el.style.width = (o.genes[el.dataset.gene] * 100).toFixed(0) + '%'; });
  }
  const status = $('i-status');
  status.textContent = statusOf(o);
  status.style.color = o.alive ? MODE_COLOR[o.mode] || 'var(--ink)' : 'var(--coral)';
  $('i-energy').style.width = (o.alive ? clamp(o.E / o.cap, 0, 1) * 100 : 0) + '%';
  const rows = [
    ['Cells', `${o.n} / ${pl.n}`], ['Body plan', SYMS[pl.sym]], ['Gait', gaitOf(o)], ['Generation', o.gen],
    ['Age', clockText(o.age / TPS)], ['Offspring', o.kids], ['Mates', o.mates], ['Kills', o.kills],
    ['Of its species', fmtInt(o.sp.alive)], ['Descends from', o.sp.parent || 'the first cells'],
  ];
  const html = rows.map(([k, v]) => `<div><dt>${k}</dt><dd title="${esc(v)}">${esc(v)}</dd></div>`).join('');
  const dl = $('i-stats');
  if (dl.html !== html) { dl.html = html; dl.innerHTML = html; }
}

function updateLog() {
  const items = world.events.slice(0, 6);
  const key = items.map((e) => e.t + e.text).join('|');
  if (key === logKey) return;
  logKey = key;
  $('log').innerHTML = items.map((e) =>
    `<li class="k-${e.kind}"><time>${clockText(e.t / TPS)}</time><span>${esc(e.text)}</span></li>`).join('');
}

// Body size over the whole run, on a log scale, with era marks.
function drawChart() {
  const c = $('chart'), d = view.dpr, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);
  const hs = world.hist, n = hs.t.length, t1 = Math.max(world.t, 60 * TPS);
  const X = (t) => (t / t1) * (w - 1), Y = (v) => h - 1 - (Math.log2(Math.max(1, v)) / 5) * (h - 6);
  g.font = `9px ${MONO}`;
  g.textAlign = 'right';
  g.lineWidth = 1;
  for (const v of [4, 16]) {
    const y = Math.round(Y(v)) + 0.5;
    g.strokeStyle = 'rgba(150, 180, 220, 0.09)';
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.fillStyle = 'rgba(150, 170, 200, 0.5)';
    g.fillText(String(v), w - 2, y - 3);
  }
  g.textAlign = 'left';
  for (let i = 1; i < world.eraT.length; i++) {
    const x = Math.round(X(world.eraT[i])) + 0.5;
    g.strokeStyle = 'rgba(92, 242, 182, 0.28)';
    g.beginPath(); g.moveTo(x, 10); g.lineTo(x, h); g.stroke();
    g.fillStyle = 'rgba(92, 242, 182, 0.75)';
    g.fillText(ROMAN[i], x + 2, 7);
  }
  if (n < 2) return;
  g.beginPath();
  g.moveTo(X(hs.t[0]), h);
  for (let i = 0; i < n; i++) g.lineTo(X(hs.t[i]), Y(hs.wavg[i]));
  g.lineTo(X(hs.t[n - 1]), h);
  g.closePath();
  g.fillStyle = 'rgba(230, 237, 247, 0.1)';
  g.fill();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.wavg[i]));
  g.strokeStyle = 'rgba(230, 237, 247, 0.6)';
  g.stroke();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.max[i]));
  g.strokeStyle = ACCENT;
  g.shadowColor = ACCENT; g.shadowBlur = 4;
  g.stroke();
  g.shadowBlur = 0;
}

// ---- main loop -----------------------------------------------------------------------------------
function follow() {
  const o = view.selected;
  if (!view.follow || !o || !o.alive) return;
  view.cx = mod(view.cx + wdx(o.x[0] - view.cx) * 0.12, WW);
  view.cy = mod(view.cy + wdy(o.y[0] - view.cy) * 0.12, WH);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  if (running) {
    acc += dt * TPS * SPEEDS[speed];
    const t0 = performance.now();
    while (acc >= 1) {
      step();
      acc -= 1;
      if (performance.now() - t0 > 12) { acc = 0; break; } // can't keep up: drop the backlog
    }
  }
  if (pointer && pointer.mode === 'tool' && view.pointer) useTool(view.pointer, dt, false);
  follow();
  render();
  if ((hudWait -= dt) <= 0) { hudWait = 0.25; updateHud(); }
  if (hintWait > 0 && (hintWait -= dt) <= 0) $('hint').classList.remove('show');
}

function boot() {
  initRender($('view'));
  bindControls();
  bindPointer();
  bindKeys();
  const fit = () => resizeView(innerWidth, innerHeight);
  addEventListener('resize', fit);
  fit();
  setSpeed(1);
  setTool('inspect');
  setRunning(true);
  newWorld();
  requestAnimationFrame(frame);
}

boot();

})();
</script>
</body>
</html>
