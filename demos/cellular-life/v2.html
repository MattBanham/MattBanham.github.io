<script>
(() => {
'use strict';
// ===================================================================== core
// Petri dish world: constants, genomes, nutrient/antibiotic fields, spatial hash.
// Pure logic, no DOM, so it can also run headless in Node for tuning.

const TAU = Math.PI * 2;
const R = 360;                    // dish radius, world units
const G = 90;                     // field grid resolution (G x G)
const GS = (2 * R) / G;           // field cell size
const FOOD_CAP = 14;              // mass held by a grid cell at concentration 1
const MAX_CELLS = 1400;           // living-cell cap
const DT = 1 / 30;                // fixed simulation step (s)
const KIN = 0.25;                 // genome distance below which cells are "kin"
const DIGEST_TIME = 3;            // seconds for a predator to digest its prey

const ALIVE = 0, ENGULFED = 1, DEAD = 2, GONE = 3;

// Live-tunable parameters (bound to UI sliders).
const P = { speed: 1, nutrients: 0.6, mutation: 0.06, temperature: 0.5 };

const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
const hueDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

// ------------------------------------------------------------------ genome
// Every trait is 0..1. hue is 0..360 and only drives looks + kin recognition.
const TRAITS = ['size', 'speed', 'sense', 'aggr', 'stick', 'fuse', 'resist', 'elong', 'wobble'];
const TRAIT_LABELS = {
  size: 'Size', speed: 'Motility', sense: 'Senses', aggr: 'Appetite (predation)',
  stick: 'Stickiness', fuse: 'Fusion', resist: 'Antibiotic resistance', elong: 'Rod shape', wobble: 'Softness',
};

const STRAINS = [
  { key: 'grazer', name: 'Grazer cocci', g: { hue: 165, size: .35, speed: .15, sense: .35, aggr: .05, stick: .2, fuse: .1, resist: .1, elong: 0, wobble: .25 } },
  { key: 'swimmer', name: 'Swimming bacilli', g: { hue: 205, size: .3, speed: .8, sense: .75, aggr: .08, stick: .05, fuse: .05, resist: .1, elong: .85, wobble: .15 } },
  { key: 'hunter', name: 'Hunting amoebae', g: { hue: 8, size: .9, speed: .45, sense: .85, aggr: .9, stick: 0, fuse: 0, resist: .1, elong: .05, wobble: .95 } },
  { key: 'chain', name: 'Chain formers', g: { hue: 95, size: .3, speed: .1, sense: .2, aggr: .05, stick: .9, fuse: .05, resist: .15, elong: .6, wobble: .3 } },
  { key: 'cluster', name: 'Cluster cocci', g: { hue: 48, size: .35, speed: .08, sense: .2, aggr: .05, stick: .85, fuse: .1, resist: .35, elong: 0, wobble: .25 } },
  { key: 'fuser', name: 'Fusing syncytia', g: { hue: 275, size: .5, speed: .3, sense: .45, aggr: .15, stick: .15, fuse: .95, resist: .1, elong: .1, wobble: .6 } },
];

function randomGenome() {
  const g = { hue: rand(360) };
  for (const t of TRAITS) g[t] = Math.random();
  g.aggr *= g.aggr;   // predators are the exception, not the rule
  return g;
}

function mutate(g, rate) {
  const n = { ...g };
  for (const t of TRAITS) n[t] = clamp01(n[t] + gauss() * rate);
  n.hue = (n.hue + gauss() * rate * 60 + 360) % 360;
  // rare larger jump: visibly new strain
  if (Math.random() < rate * 0.12) n.hue = (n.hue + (Math.random() < 0.5 ? -1 : 1) * rand(30, 80) + 360) % 360;
  return n;
}

// Sexual mixing when two cells fuse: random crossover of traits + circular mean hue.
function blend(a, b, rate) {
  const n = {};
  for (const t of TRAITS) n[t] = Math.random() < 0.5 ? a[t] : b[t];
  const ha = a.hue * Math.PI / 180, hb = b.hue * Math.PI / 180;
  n.hue = ((Math.atan2(Math.sin(ha) + Math.sin(hb), Math.cos(ha) + Math.cos(hb)) * 180 / Math.PI) + 360) % 360;
  return mutate(n, rate * 0.5);
}

function gdist(a, b) {
  let d = 0;
  for (const t of TRAITS) { const x = a[t] - b[t]; d += x * x; }
  return Math.sqrt(d / TRAITS.length) * 0.7 + (hueDiff(a.hue, b.hue) / 180) * 0.6;
}

// Phenotype derived from genome (cached on the cell).
function pheno(g) {
  return {
    divMass: 60 + 220 * g.size,
    vmax: 6 + 70 * g.speed,
    senseR: 30 + 110 * g.sense,
    absorb: 1 - 0.85 * g.aggr,
    // bigger cells are cheaper to run per unit of mass
    upkeep: (0.028 + 0.03 * g.resist + 0.012 * g.sense + 0.012 * g.aggr) * (1 - 0.4 * g.size),
    moveCost: 0.05 * g.speed * g.speed,
    maxBonds: g.elong > 0.5 ? 2 : 2 + Math.floor(g.stick * 2.5),   // rods chain, cocci cluster
    aspect: 1 + 0.9 * g.elong,
    flagella: g.speed > 0.7 ? 2 : g.speed > 0.4 ? 1 : 0,
    predator: g.aggr > 0.35,
  };
}

function cellColors(h, g) {
  const s = 45 + 30 * (1 - g.resist * 0.5);
  return {
    body: `hsla(${h},${s}%,52%,0.42)`,
    inner: `hsla(${h},${s + 10}%,74%,0.22)`,
    edge: `hsla(${h},${s + 20}%,72%,0.9)`,
    nuc: `hsla(${(h + 25) % 360},40%,26%,0.7)`,
    dot: `hsl(${h},70%,68%)`,
  };
}

// ------------------------------------------------------------------- cells
let nextId = 1;
function makeCell(x, y, g, mass, lineage, gen = 0) {
  return {
    id: nextId++, x, y, vx: 0, vy: 0, r: Math.sqrt(mass) * 1.05, mass, g, ph: pheno(g),
    col: cellColors(g.hue, g), lineage, gen,
    heading: rand(TAU), age: 0, life: rand(120, 260),
    state: ALIVE, links: [], prey: 0, kills: 0, kids: 0, fusions: 0,
    lastFood: 0, intake: 0, mode: 'drifting', target: null, threat: null,
    fusing: null, fuseT: 0, host: null, digest: 0, relx: 0, rely: 0, m0: 0,
    deadT: 0, cause: '', px: 0, py: 0, phase: rand(TAU), flash: 0,
  };
}
const radiusOf = (mass) => Math.sqrt(mass) * 1.05;

// ------------------------------------------------------------------ fields
const food = new Float32Array(G * G);
const toxin = new Float32Array(G * G);
const base = new Float32Array(G * G);     // patchy agar richness the food regrows toward
const mask = new Uint8Array(G * G);       // 1 inside the dish
const ftmp = new Float32Array(G * G);

function initFields() {
  const blobs = [];
  for (let k = 0; k < 16; k++) {
    const a = rand(TAU), d = Math.sqrt(Math.random()) * R * 0.9;
    blobs.push([Math.cos(a) * d, Math.sin(a) * d, rand(40, 120), rand(0.3, 0.8)]);
  }
  for (let j = 0; j < G; j++) {
    for (let i = 0; i < G; i++) {
      const k = j * G + i, x = -R + (i + 0.5) * GS, y = -R + (j + 0.5) * GS;
      mask[k] = x * x + y * y < (R - GS * 0.5) ** 2 ? 1 : 0;
      let b = 0.3;
      for (const [bx, by, br, bs] of blobs) b += bs * Math.exp(-((x - bx) ** 2 + (y - by) ** 2) / (br * br));
      base[k] = mask[k] ? Math.min(1, b) : 0;
      food[k] = base[k] * 0.85;
      toxin[k] = 0;
    }
  }
}

function sampleField(arr, x, y) {
  const fx = (x + R) / GS - 0.5, fy = (y + R) / GS - 0.5;
  const i = clamp(Math.floor(fx), 0, G - 2), j = clamp(Math.floor(fy), 0, G - 2);
  const tx = clamp(fx - i, 0, 1), ty = clamp(fy - j, 0, 1), k = j * G + i;
  return (arr[k] * (1 - tx) + arr[k + 1] * tx) * (1 - ty) + (arr[k + G] * (1 - tx) + arr[k + G + 1] * tx) * ty;
}

// Take up to `want` mass of food from the 2x2 cells under (x, y).
function takeFood(x, y, want) {
  const i = clamp(Math.floor((x + R) / GS - 0.5), 0, G - 2), j = clamp(Math.floor((y + R) / GS - 0.5), 0, G - 2);
  let got = 0;
  const per = want / 4 / FOOD_CAP;
  for (const k of [j * G + i, j * G + i + 1, (j + 1) * G + i, (j + 1) * G + i + 1]) {
    const t = Math.min(food[k], per);
    food[k] -= t; got += t;
  }
  return got * FOOD_CAP;
}

// Gaussian splat of `amount` (concentration units summed over cells) into a field.
function splat(arr, x, y, radius, amount, cap = 1.5) {
  const ci = (x + R) / GS - 0.5, cj = (y + R) / GS - 0.5, rr = radius / GS, n = Math.ceil(rr * 2);
  const i0 = Math.max(0, Math.floor(ci - n)), i1 = Math.min(G - 1, Math.ceil(ci + n));
  const j0 = Math.max(0, Math.floor(cj - n)), j1 = Math.min(G - 1, Math.ceil(cj + n));
  let wsum = 0;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (mask[j * G + i]) wsum += Math.exp(-((i - ci) ** 2 + (j - cj) ** 2) / (rr * rr));
  }
  if (wsum <= 0) return;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const k = j * G + i;
    if (!mask[k]) continue;
    const w = Math.exp(-((i - ci) ** 2 + (j - cj) ** 2) / (rr * rr)) / wsum;
    arr[k] = Math.min(cap, arr[k] + amount * w);
  }
}
const releaseMass = (x, y, mass) => splat(food, x, y, 14, mass / FOOD_CAP);

function diffuse(arr, rate) {
  ftmp.set(arr);
  for (let j = 1; j < G - 1; j++) {
    for (let i = 1; i < G - 1; i++) {
      const k = j * G + i;
      if (!mask[k]) continue;
      let s = 0, n = 0;
      if (mask[k - 1]) { s += ftmp[k - 1]; n++; }
      if (mask[k + 1]) { s += ftmp[k + 1]; n++; }
      if (mask[k - G]) { s += ftmp[k - G]; n++; }
      if (mask[k + G]) { s += ftmp[k + G]; n++; }
      if (n) arr[k] += rate * (s - n * ftmp[k]);
    }
  }
}

function updateFields(dt, stepNo) {
  const regen = 0.05 * P.nutrients * dt, decay = 1 - 0.035 * dt;
  for (let k = 0; k < G * G; k++) {
    if (!mask[k]) continue;
    if (food[k] < base[k]) food[k] += (base[k] - food[k]) * regen;
    if (toxin[k] > 0.001) toxin[k] *= decay; else toxin[k] = 0;
  }
  if (stepNo % 3 === 0) { diffuse(food, 0.08); diffuse(toxin, 0.12); }
}

// ------------------------------------------------------------- spatial hash
const HS = 40;
const HN = Math.ceil((2 * R) / HS) + 1;
const hHead = new Int32Array(HN * HN);
let hNext = new Int32Array(4096);
const hcell = (v) => clamp(Math.floor((v + R) / HS), 0, HN - 1);

function hashBuild(cells) {
  hHead.fill(-1);
  if (hNext.length < cells.length) hNext = new Int32Array(cells.length * 2);
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.state !== ALIVE) continue;
    const k = hcell(c.y) * HN + hcell(c.x);
    hNext[i] = hHead[k];
    hHead[k] = i;
  }
}

// Calls fn(index) for every live cell in buckets overlapping the circle (x, y, rad).
function forNear(x, y, rad, fn) {
  const i0 = hcell(x - rad), i1 = hcell(x + rad), j0 = hcell(y - rad), j1 = hcell(y + rad);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      for (let n = hHead[j * HN + i]; n !== -1; n = hNext[n]) fn(n);
    }
  }
}

// ===================================================================== step
// Cell behaviour: chemotaxis, eating, division, fusion, engulfing, colonies, death.

const world = {
  cells: [], bonds: [], particles: [], t: 0, steps: 0, alive: 0,
  stats: null, events: [], hist: [], lineages: new Map(), hybrids: new Map(), lastLog: {}, colonyMark: 0,
};
let nextLineage = 1;

function logEvent(kind, text, hue, minGap = 0) {
  if (minGap && world.t - (world.lastLog[kind] ?? -1e9) < minGap) return;
  world.lastLog[kind] = world.t;
  world.events.unshift({ text, hue, t: world.t });
  if (world.events.length > 8) world.events.pop();
}

function newLineage(name, hue, parent = null) {
  const id = nextLineage++;
  const root = parent ? world.lineages.get(parent)?.root ?? id : id;
  world.lineages.set(id, { id, name, hue, parent, root, alive: 0, peak: 0, extinct: false, variants: 0 });
  return id;
}
const lineageName = (id) => world.lineages.get(id)?.name ?? 'Unknown strain';
const rootOf = (id) => { const L = world.lineages.get(id); return L ? world.lineages.get(L.root) ?? L : null; };

function resetWorld() {
  Object.assign(world, {
    cells: [], bonds: [], particles: [], t: 0, steps: 0, alive: 0, events: [], hist: [],
    lineages: new Map(), hybrids: new Map(), founders: {}, lastLog: {}, colonyMark: 0,
    stats: { births: 0, deaths: 0, eaten: 0, fusions: 0, colonies: 0, biggestColony: 0 },
  });
  initFields();
  // five grazing strains around the dish, hunters in the middle
  const plan = [['grazer', 16], ['swimmer', 14], ['chain', 12], ['cluster', 12], ['fuser', 12]];
  const spin = rand(TAU);
  plan.forEach(([key, n], i) => {
    const s = STRAINS.find((x) => x.key === key);
    const a = spin + (i / plan.length) * TAU, d = R * rand(0.4, 0.6);
    inoculate(Math.cos(a) * d, Math.sin(a) * d, s, n);
  });
  inoculate(rand(-30, 30), rand(-30, 30), STRAINS.find((x) => x.key === 'hunter'), 4);
  logEvent('start', 'Dish inoculated with 6 strains', 165);
  census();
}

// Spawn n cells of a strain ({name, g}) around (x, y); founders of a preset share one lineage.
function inoculate(x, y, strain, n) {
  let lin = strain.key && world.founders[strain.key];
  if (!lin || !world.lineages.has(lin)) {
    lin = newLineage(strain.name, strain.g.hue);
    if (strain.key) world.founders[strain.key] = lin;
  }
  for (let k = 0; k < n && world.alive < MAX_CELLS; k++) {
    const a = rand(TAU), d = Math.sqrt(Math.random()) * (10 + n * 2.5);
    let px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const m = Math.hypot(px, py), lim = R - 20;
    if (m > lim) { px *= lim / m; py *= lim / m; }
    const g = mutate(strain.g, 0.02);
    world.cells.push(makeCell(px, py, g, pheno(g).divMass * rand(0.45, 0.75), lin));
    world.alive++;
  }
  return lin;
}

// --------------------------------------------------------------- helpers
function linked(a, b) {
  for (const L of a.links) if (L.a === b || L.b === b) return L;
  return null;
}
function addBond(a, b, type) {
  const L = { a, b, type, rest: type === 'mitosis' ? 0 : a.r + b.r, t: 0, dead: false };
  world.bonds.push(L); a.links.push(L); b.links.push(L);
  return L;
}
function cutBond(L) {
  if (L.dead) return;
  L.dead = true;
  for (const c of [L.a, L.b]) { const i = c.links.indexOf(L); if (i >= 0) c.links.splice(i, 1); }
}
function cutLinks(c) { while (c.links.length) cutBond(c.links[0]); }
function unfuse(c) { if (c.fusing) { if (c.fusing.fusing === c) c.fusing.fusing = null; c.fusing = null; } }

function edible(pred, prey) {
  // bonded cells count as bigger: colonies are a defence against predators
  return pred.ph.predator && pred.r > 1.15 * prey.r * (1 + 0.3 * prey.links.length) && !linked(pred, prey) && gdist(pred.g, prey.g) > KIN;
}
function turnToward(c, ang, rate, dt) { c.heading += clamp(angDiff(c.heading, ang), -rate * dt, rate * dt); }

function burst(c, n) {
  for (let k = 0; k < n && world.particles.length < 600; k++) {
    const a = rand(TAU), s = rand(8, 30);
    world.particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: rand(0.8, 1.8), size: rand(0.6, 1.6), hue: c.g.hue });
  }
}

// ---------------------------------------------------------------- senses
function sense(c) {
  c.target = null; c.threat = null;
  const hunt = c.ph.predator && !c.prey && !c.fusing && c.mass < c.ph.divMass * 0.8;   // only hungry hunters hunt
  const wary = !c.ph.predator && c.g.speed > 0.25;
  if (!hunt && !wary) return;
  const cells = world.cells, sr2 = c.ph.senseR * c.ph.senseR;
  let best = Infinity;
  forNear(c.x, c.y, c.ph.senseR, (j) => {
    const o = cells[j];
    if (o === c) return;
    const dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
    if (d2 > sr2 || d2 >= best) return;
    if (hunt ? edible(c, o) : edible(o, c)) { best = d2; if (hunt) c.target = o; else c.threat = o; }
  });
}

function steer(c, dt, senseNow) {
  const g = c.g, ph = c.ph;
  c.r = radiusOf(c.mass);
  if (senseNow) sense(c);
  const f = sampleField(food, c.x, c.y);
  let throttle = 0.25 + 0.75 * clamp01(1 - f * 1.3);           // hungry cells swim more
  if (c.target && c.target.state === ALIVE) {
    turnToward(c, Math.atan2(c.target.y - c.y, c.target.x - c.x), 4.5, dt);
    throttle = 1; c.mode = 'hunting';
  } else if (c.threat && c.threat.state === ALIVE) {
    turnToward(c, Math.atan2(c.y - c.threat.y, c.x - c.threat.x), 5, dt);
    throttle = 1; c.mode = 'fleeing';
  } else {
    c.target = c.threat = null;
    // run-and-tumble: keep going while food improves, tumble more often when it doesn't
    const tumble = f > c.lastFood ? 0.4 * (1 - g.sense) : 0.6 + 1.6 * g.sense;
    if (Math.random() < tumble * dt) c.heading += rand(-2.4, 2.4);
    c.heading += gauss() * 0.8 * Math.sqrt(dt);
    c.mode = c.fusing ? 'fusing' : c.prey ? 'digesting' : c.links.length ? 'in a colony' : f > 0.35 ? 'feeding' : 'searching';
  }
  c.lastFood = f;
  if (c.links.length) throttle *= 0.4;
  const sp = ph.vmax * throttle * (0.6 + 0.8 * P.temperature), k = Math.min(1, 3 * dt);
  c.vx += (Math.cos(c.heading) * sp - c.vx) * k;
  c.vy += (Math.sin(c.heading) * sp - c.vy) * k;
  const jit = ((3 + 14 * P.temperature) / Math.sqrt(c.r)) * Math.sqrt(dt);   // Brownian motion
  c.x += c.vx * dt + gauss() * jit;
  c.y += c.vy * dt + gauss() * jit;
}

// -------------------------------------------------------------- contacts
function contact(a, b, dt) {
  if (a.state !== ALIVE || b.state !== ALIVE) return;
  const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r, d2 = dx * dx + dy * dy;
  if (d2 >= rs * rs) return;
  const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = rs - d;
  a.px -= nx * ov; a.py -= ny * ov; b.px += nx * ov; b.py += ny * ov;   // squish for rendering
  if (tryEngulf(a, b, dt) || tryEngulf(b, a, dt)) return;
  const L = linked(a, b);
  if (L && L.type === 'mitosis') return;
  if (!L && !tryFuse(a, b, dt)) tryAdhere(a, b, dt);
  if (a.fusing === b) return;                                            // fusing cells may overlap
  const push = ov * 0.45, tm = a.mass + b.mass;
  a.x -= nx * push * (b.mass / tm); a.y -= ny * push * (b.mass / tm);
  b.x += nx * push * (a.mass / tm); b.y += ny * push * (a.mass / tm);
}

function tryEngulf(p, q, dt) {
  if (!p.ph.predator || p.prey || p.fusing || p.mass > p.ph.divMass * 0.8 || !edible(p, q)) return false;
  if (Math.random() > ((p.g.aggr * 5) / (1 + 3 * q.links.length)) * dt) return false;  // colonies resist
  cutLinks(q); unfuse(q);
  q.state = ENGULFED; q.host = p; q.digest = 0; q.m0 = q.mass; q.relx = q.x - p.x; q.rely = q.y - p.y;
  q.cause = `engulfed by ${lineageName(p.lineage)}`;
  p.prey++; p.flash = 1; p.target = null;
  world.stats.eaten++;
  logEvent('eat', `${lineageName(p.lineage)} engulfed a ${lineageName(q.lineage)} cell`, p.g.hue, 4);
  return true;
}

function digestStep(q, dt) {
  const h = q.host;
  if (!h || h.state !== ALIVE) {                    // host died: prey remains are released
    q.state = DEAD; q.deadT = 1.2;
    releaseMass(q.x, q.y, q.mass);
    return;
  }
  q.digest += dt / DIGEST_TIME;
  const pull = Math.max(0, 1 - 2.5 * dt);
  q.relx *= pull; q.rely *= pull;
  q.x = h.x + q.relx; q.y = h.y + q.rely;
  h.mass += (q.m0 * 0.7 * dt) / DIGEST_TIME;
  q.mass = q.m0 * Math.max(0, 1 - q.digest);
  if (q.digest >= 1) { q.state = GONE; h.prey--; h.kills++; }
}

function tryFuse(a, b, dt) {
  if (a.fusing || b.fusing || a.prey || b.prey) return false;
  if (a.g.fuse < 0.4 || b.g.fuse < 0.4 || a.age < 2 || b.age < 2) return false;
  if (a.mass + b.mass > Math.max(a.ph.divMass, b.ph.divMass) * 1.2) return false;
  if (gdist(a.g, b.g) > 0.5) return false;
  if (Math.random() > a.g.fuse * b.g.fuse * 1.2 * dt) return false;
  a.fusing = b; b.fusing = a; a.fuseT = 0; b.fuseT = 0;
  return true;
}

function fuseStep(a, b, dt) {
  if (b.state !== ALIVE || b.fusing !== a) { unfuse(a); return; }
  a.fuseT += dt;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d < 0.3 * (a.r + b.r)) { merge(a, b); return; }
  if (a.fuseT > 2.5) { if (d < a.r + b.r) merge(a, b); else unfuse(a); return; }
  const pull = Math.min(0.5, 2.2 * dt), tm = a.mass + b.mass;
  a.x += dx * pull * (b.mass / tm); a.y += dy * pull * (b.mass / tm);
  b.x -= dx * pull * (a.mass / tm); b.y -= dy * pull * (a.mass / tm);
}

function merge(a, b) {
  const [s, o] = a.mass >= b.mass ? [a, b] : [b, a];
  const tm = s.mass + o.mass;
  s.x = (s.x * s.mass + o.x * o.mass) / tm; s.y = (s.y * s.mass + o.y * o.mass) / tm;
  s.vx = (s.vx * s.mass + o.vx * o.mass) / tm; s.vy = (s.vy * s.mass + o.vy * o.mass) / tm;
  s.g = blend(s.g, o.g, P.mutation); s.ph = pheno(s.g); s.col = cellColors(s.g.hue, s.g);
  s.mass = tm; s.r = radiusOf(tm); s.fusions++; s.flash = 1; s.age = 0;
  unfuse(s); unfuse(o);
  for (const L of [...o.links]) {                       // the survivor inherits the partner's colony bonds
    const other = L.a === o ? L.b : L.a;
    cutBond(L);
    if (other !== s && !linked(s, other) && s.links.length < s.ph.maxBonds) addBond(s, other, 'adhere');
  }
  // fusion across founding strains makes a hybrid, named after the founders it combines
  const parts = (L) => (L.hybrid ? L.hybrid : [L.name.split(' ')[0]]);
  const rs = rootOf(s.lineage), ro = rootOf(o.lineage);
  if (rs && ro && rs !== ro) {
    const mix = [...new Set([...parts(rs), ...parts(ro)])].sort();
    const key = mix.join('–');
    if (mix.length > 1 && key !== parts(rs).slice().sort().join('–')) {
      if (!world.hybrids.has(key)) {
        const id = newLineage(mix.length > 3 ? `Mixed hybrid ${world.hybrids.size + 1}` : `${key} hybrid`, s.g.hue);
        world.lineages.get(id).hybrid = mix;
        world.hybrids.set(key, id);
        logEvent('hybrid', `${rs.name} and ${ro.name} fused into a new hybrid strain`, s.g.hue);
      }
      s.lineage = world.hybrids.get(key);
    }
  }
  o.state = GONE; o.cause = 'fused into another cell';
  world.stats.fusions++;
  logEvent('fuse', `Two ${lineageName(s.lineage)} cells fused into one`, s.g.hue, 5);
}

function tryAdhere(a, b, dt) {
  if (a.g.stick < 0.35 || b.g.stick < 0.35 || a.fusing || b.fusing) return false;
  if (a.links.length >= a.ph.maxBonds || b.links.length >= b.ph.maxBonds) return false;
  if (gdist(a.g, b.g) > KIN) return false;
  if (Math.random() > a.g.stick * b.g.stick * 2.5 * dt) return false;
  addBond(a, b, 'adhere');
  return true;
}

function alignAxis(c, dx, dy, dt) {
  const ax = Math.atan2(dy, dx);
  let d = angDiff(c.heading, ax);
  if (Math.abs(d) > Math.PI / 2) d = angDiff(c.heading, ax + Math.PI);
  c.heading += d * Math.min(1, 3 * dt);
}

function updateBonds(dt) {
  const bonds = world.bonds;
  let w = 0;
  for (let i = 0; i < bonds.length; i++) {
    const L = bonds[i];
    if (L.dead) continue;
    const { a, b } = L;
    if (a.state !== ALIVE || b.state !== ALIVE) { cutBond(L); continue; }
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const full = (a.r * Math.sqrt(a.ph.aspect) + b.r * Math.sqrt(b.ph.aspect)) * 0.9;
    L.t += dt;
    if (L.type === 'mitosis') {                         // daughters pinch apart over ~1s
      const p = Math.min(1, L.t / 1.1);
      L.rest = full * p;
      if (p >= 1) {
        const keep = a.g.stick >= 0.35 && b.g.stick >= 0.35 && a.links.length <= a.ph.maxBonds && b.links.length <= b.ph.maxBonds;
        if (keep) L.type = 'adhere'; else { cutBond(L); continue; }
      }
    } else {
      L.rest = full;
      if (d > full * 1.9 || Math.random() < (1 - Math.min(a.g.stick, b.g.stick)) * 0.01 * dt) { cutBond(L); continue; }
      const flow = (a.mass / a.ph.divMass - b.mass / b.ph.divMass) * Math.min(a.mass, b.mass) * 0.6 * dt;
      a.mass -= flow; b.mass += flow;                   // colony members share food
      if (a.g.elong > 0.4) alignAxis(a, dx, dy, dt);
      if (b.g.elong > 0.4) alignAxis(b, dx, dy, dt);
    }
    const k = L.type === 'mitosis' ? 0.5 : 0.22, tm = a.mass + b.mass, corr = ((d - L.rest) / d) * k;
    a.x += dx * corr * (b.mass / tm); a.y += dy * corr * (b.mass / tm);
    b.x -= dx * corr * (a.mass / tm); b.y -= dy * corr * (a.mass / tm);
    bonds[w++] = L;
  }
  bonds.length = w;
}

// ------------------------------------------------------------- life cycle
function wall(c) {
  const d = Math.hypot(c.x, c.y), lim = R - c.r * 0.9;
  if (d <= lim) return;
  c.x *= lim / d; c.y *= lim / d;
  const nx = c.x / lim, ny = c.y / lim, vn = c.vx * nx + c.vy * ny;
  if (vn > 0) { c.vx -= nx * vn * 1.5; c.vy -= ny * vn * 1.5; }
  if (Math.cos(c.heading) * nx + Math.sin(c.heading) * ny > 0) c.heading = Math.atan2(-ny, -nx) + rand(-1.2, 1.2);
}

function live(c, dt) {
  c.age += dt;
  const ph = c.ph;
  const got = takeFood(c.x, c.y, ph.absorb * sampleField(food, c.x, c.y) * 1.6 * c.r * dt);
  c.mass += got;
  c.intake += (got / dt - c.intake) * 0.05;
  const spd = Math.hypot(c.vx, c.vy) / ph.vmax;
  const colony = 1 - 0.12 * Math.min(3, c.links.length);   // biofilm living is cheaper
  c.mass -= c.mass * (ph.upkeep * colony + ph.moveCost * spd) * (0.6 + 0.8 * P.temperature) * dt;
  const tx = sampleField(toxin, c.x, c.y);
  const hit = tx - 0.7 * c.g.resist;                    // resistance neutralises part of the dose
  if (hit > 0) c.mass -= hit * 0.9 * c.mass * dt;
  c.r = radiusOf(c.mass);
  if (c.mass < 10) return die(c, tx > 0.15 ? 'killed by antibiotic' : 'starved');
  if (c.age > c.life && Math.random() < 0.1 * dt) return die(c, 'died of old age');
  if (c.mass >= ph.divMass && c.age > 3 && !c.fusing && !c.prey) divide(c);
}

function divide(c) {
  if (world.alive >= MAX_CELLS) return;
  const ang = c.g.elong > 0.4 ? c.heading : rand(TAU), ca = Math.cos(ang), sa = Math.sin(ang);
  const half = c.mass / 2, off = radiusOf(half) * 0.35;
  const g2 = mutate(c.g, P.mutation);
  let lin = c.lineage;
  if (hueDiff(g2.hue, c.g.hue) > 25) {                  // a visible jump founds a new strain
    const root = rootOf(c.lineage), n = root ? ++root.variants : 1;
    lin = newLineage(`${root ? root.name : 'Unknown'} variant ${n}`, g2.hue, c.lineage);
    logEvent('strain', `New strain: ${lineageName(lin)}`, g2.hue, 6);
  }
  const d = makeCell(c.x + ca * off, c.y + sa * off, g2, half, lin, c.gen + 1);
  c.x -= ca * off; c.y -= sa * off; c.mass = half; c.r = radiusOf(half); c.age = 0; c.kids++;
  d.heading = c.heading; d.vx = c.vx; d.vy = c.vy; d.lastFood = c.lastFood;
  world.cells.push(d); world.alive++; world.stats.births++;
  addBond(c, d, 'mitosis');
}

function die(c, cause) {
  c.state = DEAD; c.deadT = 0; c.cause = cause;
  cutLinks(c); unfuse(c);
  releaseMass(c.x, c.y, c.mass * 0.9);                  // nutrients recycle into the agar
  burst(c, 6);
  world.stats.deaths++;
}

// ------------------------------------------------------------- bookkeeping
function census() {
  for (const L of world.lineages.values()) L.alive = 0;
  for (const c of world.cells) if (c.state === ALIVE) { const L = world.lineages.get(c.lineage); if (L) L.alive++; }
  for (const L of world.lineages.values()) {
    if (L.alive > L.peak) L.peak = L.alive;
    if (L.alive) L.extinct = false;
    else if (!L.extinct && L.peak >= (L.parent ? 8 : 4)) {
      L.extinct = true;
      logEvent('ext' + L.id, `${L.name} died out`, L.hue);
    }
  }
  // colonies = connected groups of bonded cells
  const seen = new Set();
  let count = 0, biggest = 0, bigHue = 0;
  for (const c of world.cells) {
    if (c.state !== ALIVE || !c.links.length || seen.has(c)) continue;
    let size = 0;
    const stack = [c];
    seen.add(c);
    while (stack.length) {
      const x = stack.pop();
      size++;
      for (const L of x.links) {
        const o = L.a === x ? L.b : L.a;
        if (o.state === ALIVE && !seen.has(o)) { seen.add(o); stack.push(o); }
      }
    }
    if (size >= 3) count++;
    if (size > biggest) { biggest = size; bigHue = c.g.hue; }
  }
  world.stats.colonies = count; world.stats.biggestColony = biggest;
  for (const m of [10, 25, 50, 100]) {
    if (biggest >= m && world.colonyMark < m) { world.colonyMark = m; logEvent('colony', `A colony of ${biggest} cells has formed`, bigHue); }
  }
  const b = new Array(12).fill(0);
  for (const c of world.cells) if (c.state === ALIVE) b[Math.floor(c.g.hue / 30) % 12]++;
  world.hist.push(b);
  if (world.hist.length > 240) world.hist.shift();
}

function step(dt) {
  const cells = world.cells;
  world.t += dt; world.steps++;
  hashBuild(cells);
  const n = cells.length, slot = world.steps % 4;
  for (let i = 0; i < n; i++) {
    const c = cells[i];
    if (c.state === ALIVE) { c.px = 0; c.py = 0; steer(c, dt, (c.id & 3) === slot); }
  }
  for (let i = 0; i < n; i++) {
    const a = cells[i];
    if (a.state !== ALIVE) continue;
    const rr = a.r + 22, i0 = hcell(a.x - rr), i1 = hcell(a.x + rr), j0 = hcell(a.y - rr), j1 = hcell(a.y + rr);
    for (let j = j0; j <= j1 && a.state === ALIVE; j++) {
      for (let i2 = i0; i2 <= i1; i2++) {
        for (let m = hHead[j * HN + i2]; m !== -1; m = hNext[m]) if (m > i) contact(a, cells[m], dt);
      }
    }
  }
  for (let i = 0; i < n; i++) { const c = cells[i]; if (c.state === ALIVE && c.fusing && c.id < c.fusing.id) fuseStep(c, c.fusing, dt); }
  updateBonds(dt);
  for (let i = 0; i < n; i++) {
    const c = cells[i];
    if (c.state === ALIVE) { wall(c); live(c, dt); }
    else if (c.state === ENGULFED) digestStep(c, dt);
    else if (c.state === DEAD && (c.deadT += dt) > 2.6) c.state = GONE;
    if (c.flash > 0) c.flash = Math.max(0, c.flash - dt * 1.5);
  }
  const ps = world.particles;
  let w = 0;
  for (const p of ps) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt;
    if (p.age < p.life) ps[w++] = p;
  }
  ps.length = w;
  updateFields(dt, world.steps);
  let alive = 0;
  w = 0;
  for (const c of cells) { if (c.state === GONE) continue; if (c.state === ALIVE) alive++; cells[w++] = c; }
  cells.length = w; world.alive = alive;
  if (world.steps % 15 === 0) census();
}

// ------------------------------------------------------------ user tools
const feedAt = (x, y, amount) => splat(food, x, y, 26, amount);
const doseAt = (x, y, amount) => splat(toxin, x, y, 30, amount, 1.2);
function stirAt(x, y, dx, dy, radius) {
  for (const c of world.cells) {
    if (c.state !== ALIVE) continue;
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < radius) { const w = 1 - d / radius; c.vx += dx * 6 * w; c.vy += dy * 6 * w; c.x += dx * 0.5 * w; c.y += dy * 0.5 * w; }
  }
}
function pickCell(x, y, slop) {
  let best = null, bd = Infinity;
  for (const c of world.cells) {
    if (c.state !== ALIVE) continue;
    const d = Math.hypot(c.x - x, c.y - y) - c.r;
    if (d < slop && d < bd) { bd = d; best = c; }
  }
  return best;
}

// =================================================================== render
// Canvas drawing: agar dish, nutrient/antibiotic stain, soft-bodied cells.

const view = {
  x: 0, y: 0, zoom: 1, cw: 0, ch: 0, dpr: 1, frame: 0,
  showField: true, follow: false, selected: null, hover: null, tool: 'inspect', brush: 26, strainHue: 165,
};
let canvas = null, ctx = null, agarGrad = null;

const fieldCanvas = document.createElement('canvas');
fieldCanvas.width = fieldCanvas.height = G;
const fctx = fieldCanvas.getContext('2d');
const fieldImg = fctx.createImageData(G, G);
const fieldU32 = new Uint32Array(fieldImg.data.buffer);
const pts = new Float32Array(64);

const viewScale = () => (Math.min(view.cw, view.ch) / (2 * R * 1.08)) * view.zoom;
function screenToWorld(sx, sy) {
  const s = viewScale();
  return { x: (sx - view.cw / 2) / s + view.x, y: (sy - view.ch / 2) / s + view.y };
}

function initRender(cv) {
  canvas = cv;
  ctx = canvas.getContext('2d');
  agarGrad = ctx.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.05, 0, 0, R);
  agarGrad.addColorStop(0, '#22322f');
  agarGrad.addColorStop(0.6, '#16221f');
  agarGrad.addColorStop(1, '#0e1715');
}

function resizeView(w, h) {
  view.dpr = window.devicePixelRatio || 1;
  view.cw = w; view.ch = h;
  canvas.width = Math.round(w * view.dpr);
  canvas.height = Math.round(h * view.dpr);
}

// Nutrients glow pale yellow-green, antibiotic stains magenta.
function paintField() {
  for (let k = 0; k < G * G; k++) {
    if (!mask[k]) { fieldU32[k] = 0; continue; }
    const af = Math.min(1.2, food[k]) * 0.3, at = Math.min(1, toxin[k]) * 0.6, sum = af + at;
    if (sum < 0.004) { fieldU32[k] = 0; continue; }
    const r = (196 * af + 236 * at) / sum, g = (220 * af + 70 * at) / sum, b = (120 * af + 186 * at) / sum;
    fieldU32[k] = ((Math.min(255, sum * 255) << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }
  fctx.putImageData(fieldImg, 0, 0);
}

// Membrane outline: wobble + amoeboid pseudopods + rod elongation + squash against neighbours.
function shape(c, t, n, k = 1) {
  const g = c.g, r = c.r * k, sa = Math.sqrt(c.ph.aspect);
  const ch = Math.cos(c.heading), sh = Math.sin(c.heading);
  const wob = 0.035 + 0.11 * g.wobble, amoeba = g.aggr > 0.4 ? g.aggr * 0.24 : 0;
  const pl = Math.hypot(c.px, c.py), sq = Math.min(0.3, (pl / (c.r + 1)) * 0.5);
  const pcx = pl ? c.px / pl : 0, pcy = pl ? c.py / pl : 0;
  const ph = c.phase, ts = t * (0.8 + g.wobble);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    let rr = 1 + wob * Math.sin(3 * a + ts * 1.3 + ph) + wob * 0.6 * Math.sin(5 * a - ts * 2.1 + ph * 1.7);
    if (amoeba) { const p = Math.sin(2 * a + ts * 0.6 + ph); rr += amoeba * (p > 0 ? p * p * p : p * 0.15); }
    const lx = Math.cos(a) * rr * sa, ly = (Math.sin(a) * rr) / sa;
    let wx = lx * ch - ly * sh, wy = lx * sh + ly * ch;
    if (sq > 0.01) {
      const cd = (wx * pcx + wy * pcy) / (Math.hypot(wx, wy) || 1);
      if (cd < 0) { const f = 1 - sq * cd * cd; wx *= f; wy *= f; }   // flatten where pressed
    }
    pts[i * 2] = c.x + wx * r;
    pts[i * 2 + 1] = c.y + wy * r;
  }
}

function tracePath(n) {
  ctx.beginPath();
  ctx.moveTo((pts[(n - 1) * 2] + pts[0]) / 2, (pts[(n - 1) * 2 + 1] + pts[1]) / 2);
  for (let i = 0; i < n; i++) {
    const j = ((i + 1) % n) * 2;
    ctx.quadraticCurveTo(pts[i * 2], pts[i * 2 + 1], (pts[i * 2] + pts[j]) / 2, (pts[i * 2 + 1] + pts[j + 1]) / 2);
  }
  ctx.closePath();
}

function drawFlagella(c, t, s, alpha) {
  const back = c.heading + Math.PI, sa = Math.sqrt(c.ph.aspect);
  const bx = c.x + Math.cos(back) * c.r * sa * 0.92, by = c.y + Math.sin(back) * c.r * sa * 0.92;
  const len = c.r * (1.6 + c.g.speed * 1.5), freq = 10 + 16 * c.g.speed;
  ctx.globalAlpha = 0.5 * alpha;
  ctx.strokeStyle = c.col.edge;
  ctx.lineWidth = Math.max(0.6 / s, c.r * 0.07);
  for (let f = 0; f < c.ph.flagella; f++) {
    const dir = back + (f - (c.ph.flagella - 1) / 2) * 0.5;
    const dx = Math.cos(dir), dy = Math.sin(dir);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    for (let i = 1; i <= 8; i++) {
      const u = i / 8, w = Math.sin(u * 7 - t * freq + c.phase + f * 2) * c.r * 0.3 * u;
      ctx.lineTo(bx + dx * len * u - dy * w, by + dy * len * u + dx * w);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawCell(c, t, s) {
  const sr = c.r * s, vigor = clamp(c.mass / (c.ph.divMass * 0.45), 0.35, 1);
  if (sr < 1.6) {                                         // far away: a dot is enough
    ctx.globalAlpha = vigor;
    ctx.fillStyle = c.col.dot;
    ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(c.r, 1.1 / s), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }
  const n = sr < 5 ? 10 : sr < 12 ? 16 : 24;
  if (c.ph.flagella && sr > 3) drawFlagella(c, t, s, vigor);
  if (c.flash > 0) {
    ctx.globalAlpha = c.flash * 0.35;
    ctx.fillStyle = c.col.edge;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * (1.3 + (1 - c.flash) * 0.8), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = vigor;
  shape(c, t, n);
  tracePath(n);
  ctx.fillStyle = c.col.body; ctx.fill();
  ctx.lineWidth = Math.max(0.8 / s, c.r * 0.09);
  ctx.strokeStyle = c.col.edge; ctx.stroke();
  if (sr > 4) {
    shape(c, t * 0.7 + 3, n, 0.62);                      // endoplasm sloshes out of phase
    tracePath(n);
    ctx.fillStyle = c.col.inner; ctx.fill();
    const na = c.phase + t * 0.15, nr = c.r * (c.ph.predator ? 0.32 : 0.25);
    ctx.fillStyle = c.col.nuc;
    ctx.beginPath(); ctx.arc(c.x + Math.cos(na) * c.r * 0.18, c.y + Math.sin(na) * c.r * 0.18, nr, 0, TAU); ctx.fill();
  }
  if (sr > 9) {
    ctx.fillStyle = c.col.edge;
    for (let k = 0; k < 3; k++) {
      const a = c.phase * (k + 2) + t * 0.3 * (k % 2 ? 1 : -1), d = c.r * (0.35 + 0.15 * k);
      ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, c.r * 0.06, 0, TAU); ctx.fill();
    }
  }
  if (sr > 6) {
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.ellipse(c.x - c.r * 0.3, c.y - c.r * 0.38, c.r * 0.36, c.r * 0.18, -0.6, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Engulfed prey: a shrinking body inside a food vacuole.
function drawPrey(q, s) {
  const k = 1 - q.digest, pr = radiusOf(q.m0) * (0.35 + 0.6 * k);
  ctx.globalAlpha = 0.3 + 0.6 * k;
  ctx.fillStyle = q.col.body;
  ctx.beginPath(); ctx.arc(q.x, q.y, pr, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(0.6 / s, pr * 0.12);
  ctx.strokeStyle = q.col.edge; ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgba(255,236,210,0.6)';
  ctx.lineWidth = Math.max(0.5 / s, pr * 0.06);
  ctx.beginPath(); ctx.arc(q.x, q.y, pr * 1.3 + 1, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawCorpse(c, s) {
  const k = c.deadT / 2.6;
  ctx.globalAlpha = (1 - k) * 0.22;
  ctx.fillStyle = c.col.body;
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r * (1 + k * 0.4), 0, TAU); ctx.fill();
  ctx.globalAlpha = (1 - k) * 0.7;
  ctx.setLineDash([c.r * 0.35, c.r * 0.3]);
  ctx.lineWidth = Math.max(0.6 / s, c.r * 0.07);
  ctx.strokeStyle = c.col.edge; ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

// Cytoplasm bridges: colony bonds, the pinching neck of a dividing cell, fusing pairs.
function drawBridges() {
  ctx.lineCap = 'round';
  for (const L of world.bonds) {
    if (L.dead) continue;
    const { a, b } = L, m = Math.min(a.r, b.r);
    ctx.lineWidth = L.type === 'mitosis' ? m * 2 * (1 - 0.8 * Math.min(1, L.t / 1.1)) : m * 0.8;
    ctx.strokeStyle = a.col.body;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const c of world.cells) {
    const o = c.fusing;
    if (c.state !== ALIVE || !o || c.id > o.id) continue;
    ctx.lineWidth = Math.min(c.r, o.r) * (0.6 + Math.min(1, c.fuseT / 1.2));
    ctx.strokeStyle = c.col.body;
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(o.x, o.y); ctx.stroke();
  }
}

function drawDish(s) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 40 * view.dpr;
  ctx.fillStyle = agarGrad;
  ctx.beginPath(); ctx.arc(0, 0, R + 4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawRim(s) {
  ctx.lineWidth = 9;
  ctx.strokeStyle = 'rgba(170,205,215,0.07)';
  ctx.beginPath(); ctx.arc(0, 0, R + 6, 0, TAU); ctx.stroke();
  ctx.lineWidth = Math.max(1 / s, 1.4);
  ctx.strokeStyle = 'rgba(205,232,238,0.32)';
  ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, TAU); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.arc(0, 0, R - 8, -2.7, -1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, R - 8, 0.45, 0.85); ctx.stroke();
}

const TOOL_COLORS = { feed: 'rgba(214,232,140,0.8)', dose: 'rgba(236,90,190,0.85)', stir: 'rgba(220,235,240,0.6)' };

function drawOverlay(s) {
  const c = view.selected;
  if (c && c.state === ALIVE) {
    ctx.setLineDash([4 / s, 4 / s]);
    ctx.lineWidth = 1.2 / s;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * Math.sqrt(c.ph.aspect) * 1.25 + 4 / s, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.ph.senseR, 0, TAU); ctx.stroke();       // sensing range
    const o = c.target || c.threat;
    if (o && o.state === ALIVE) {
      ctx.strokeStyle = c.target ? 'rgba(255,120,100,0.6)' : 'rgba(140,200,255,0.6)';
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(o.x, o.y); ctx.stroke();
    }
  }
  const h = view.hover;
  if (h && view.tool !== 'inspect') {
    ctx.lineWidth = 1.2 / s;
    ctx.strokeStyle = view.tool === 'seed' ? `hsla(${view.strainHue},70%,70%,0.8)` : TOOL_COLORS[view.tool];
    ctx.beginPath(); ctx.arc(h.x, h.y, view.tool === 'seed' ? 18 : view.brush, 0, TAU); ctx.stroke();
  }
}

function render() {
  const t = world.t, s = viewScale(), cells = world.cells;
  view.frame++;
  const sel = view.selected;
  if (view.follow && sel && sel.state === ALIVE) { view.x += (sel.x - view.x) * 0.12; view.y += (sel.y - view.y) * 0.12; }
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, view.cw, view.ch);
  ctx.translate(view.cw / 2, view.ch / 2);
  ctx.scale(s, s);
  ctx.translate(-view.x, -view.y);

  drawDish(s);
  if (view.showField) {
    if (view.frame % 4 === 1) paintField();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(fieldCanvas, -R, -R, 2 * R, 2 * R);
    ctx.restore();
  }

  const hw = view.cw / 2 / s + 40, hh = view.ch / 2 / s + 40;
  const vis = (c) => Math.abs(c.x - view.x) < hw && Math.abs(c.y - view.y) < hh;
  for (const c of cells) if (c.state === DEAD && vis(c)) drawCorpse(c, s);
  drawBridges();
  for (const c of cells) if (c.state === ALIVE && vis(c)) drawCell(c, t, s);
  for (const c of cells) if (c.state === ENGULFED && vis(c)) drawPrey(c, s);
  for (const p of world.particles) {
    const a = 1 - p.age / p.life;
    ctx.fillStyle = `hsla(${p.hue},60%,72%,${a * 0.7})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  drawRim(s);
  drawOverlay(s);
}

// ======================================================================= ui
// Controls, pointer tools, inspector, stats panel and the main loop.

const $ = (id) => document.getElementById(id);
const SPEEDS = [0.25, 0.5, 1, 2, 4];
const TOOL_HINTS = {
  inspect: 'Click a cell to inspect it; drag it to move it. Drag empty agar to pan.',
  feed: 'Click and drag to drip nutrients onto the agar.',
  dose: 'Drip antibiotic. Cells die unless their lineage evolves resistance.',
  seed: 'Click to inoculate a small group of the chosen strain.',
  stir: 'Drag to stir the medium and sweep cells along.',
};
const fmtTime = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

let running = true, pointer = null, wildCount = 0;
const dish = $('dish'), stage = $('stage');
initRender(dish);

// ------------------------------------------------------------- controls
function setRunning(on) {
  running = on;
  $('play').textContent = on ? '❚❚ Pause' : '▶ Play';
  $('play').classList.toggle('paused', !on);
}
function setTool(t) {
  view.tool = t;
  for (const b of $('tools').children) b.classList.toggle('on', b.dataset.tool === t);
  $('strain').hidden = t !== 'seed';
  $('toolHint').textContent = TOOL_HINTS[t];
}
function select(c) {
  view.selected = c;
  $('inspector').hidden = !c;
  if (c) updateInspector();
}
function fitView() { view.x = 0; view.y = 0; view.zoom = 1; }
function newDish() { resetWorld(); select(null); fitView(); wildCount = 0; updatePanel(); }

$('play').addEventListener('click', () => setRunning(!running));
$('reset').addEventListener('click', newDish);
$('tools').addEventListener('click', (e) => { if (e.target.dataset.tool) setTool(e.target.dataset.tool); });
$('iClose').addEventListener('click', () => select(null));

const strainSel = $('strain');
STRAINS.forEach((s, i) => strainSel.add(new Option(s.name, i)));
strainSel.add(new Option('Random wild strain', 'random'));
const pickedStrain = () => (strainSel.value === 'random' ? null : STRAINS[+strainSel.value]);
strainSel.addEventListener('change', () => { const s = pickedStrain(); view.strainHue = s ? s.g.hue : 0; strainSel.blur(); });

function bindSlider(id, apply, show) {
  const el = $(id);
  const update = () => { apply(+el.value); $(id + 'Val').textContent = show(+el.value); };
  el.addEventListener('input', update);
  update();
}
bindSlider('speed', (v) => { P.speed = SPEEDS[v]; }, (v) => `${SPEEDS[v]}×`);
bindSlider('nutrients', (v) => { P.nutrients = v / 100; }, (v) => `${v}%`);
bindSlider('mutation', (v) => { P.mutation = (v / 100) * 0.2; }, (v) => (v < 15 ? 'low' : v < 50 ? 'normal' : v < 80 ? 'high' : 'extreme'));
bindSlider('temperature', (v) => { P.temperature = v / 100; }, (v) => `${Math.round(15 + v * 0.3)} °C`);
$('showField').addEventListener('change', (e) => { view.showField = e.target.checked; });
$('follow').addEventListener('change', (e) => { view.follow = e.target.checked; });

// --------------------------------------------------------------- pointer
function eventWorld(e) {
  const r = dish.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  return { sx, sy, w: screenToWorld(sx, sy) };
}
function seedAt(w) {
  const s = pickedStrain();
  const strain = s || { name: `Wild strain ${++wildCount}`, g: randomGenome() };
  if (!s) view.strainHue = strain.g.hue;
  inoculate(w.x, w.y, strain, 8);
  logEvent('seed', `You inoculated ${strain.name}`, strain.g.hue);
}

dish.addEventListener('contextmenu', (e) => e.preventDefault());
dish.addEventListener('pointerdown', (e) => {
  dish.setPointerCapture(e.pointerId);
  const { sx, sy, w } = eventWorld(e);
  view.hover = w;
  const pan = { mode: 'pan', sx, sy, vx: view.x, vy: view.y };
  if (e.button === 1 || e.button === 2 || e.shiftKey) { pointer = pan; dish.classList.add('grab'); return; }
  if (e.button !== 0) return;
  if (view.tool === 'inspect') {
    const c = pickCell(w.x, w.y, 8 / viewScale());
    select(c);
    pointer = c ? { mode: 'drag', cell: c } : pan;
    if (!c) dish.classList.add('grab');
  } else if (view.tool === 'seed') {
    seedAt(w);
  } else {
    pointer = { mode: 'tool', last: w };
    drip(w, 0.25);                                       // a click alone leaves a drop
  }
});

// Drip nutrients / antibiotic worth `secs` seconds of flow at w.
function drip(w, secs) {
  if (view.tool === 'feed') feedAt(w.x, w.y, 40 * secs);
  else if (view.tool === 'dose') doseAt(w.x, w.y, 30 * secs);
}
dish.addEventListener('pointermove', (e) => {
  const { sx, sy, w } = eventWorld(e);
  view.hover = w;
  if (!pointer) return;
  if (pointer.mode === 'pan') {
    const s = viewScale();
    view.x = pointer.vx - (sx - pointer.sx) / s;
    view.y = pointer.vy - (sy - pointer.sy) / s;
  } else if (pointer.mode === 'drag' && pointer.cell.state === ALIVE) {
    const c = pointer.cell, d = Math.hypot(w.x, w.y), lim = R - c.r;
    const k = d > lim ? lim / d : 1;
    c.x = w.x * k; c.y = w.y * k; c.vx = 0; c.vy = 0;
  } else if (pointer.mode === 'tool') {
    const dx = w.x - pointer.last.x, dy = w.y - pointer.last.y;
    if (view.tool === 'stir') stirAt(w.x, w.y, dx, dy, 60);
    else drip(w, Math.hypot(dx, dy) * 0.006);           // strokes paint evenly at any frame rate
    pointer.last = w;
  }
});
const endPointer = () => { pointer = null; dish.classList.remove('grab'); };
dish.addEventListener('pointerup', endPointer);
dish.addEventListener('pointercancel', endPointer);
dish.addEventListener('pointerleave', () => { if (!pointer) view.hover = null; });
dish.addEventListener('wheel', (e) => {
  e.preventDefault();
  const { w: before, sx, sy } = eventWorld(e);
  view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0015), 0.6, 14);
  const after = screenToWorld(sx, sy);
  view.x += before.x - after.x;
  view.y += before.y - after.y;
}, { passive: false });

// Feed and antibiotic keep dripping while the button is held (even when paused).
function applyTools(dt) {
  if (pointer && pointer.mode === 'tool' && view.hover) drip(view.hover, dt);
}

window.addEventListener('keydown', (e) => {
  if (e.target.matches('select, textarea, input:not([type=range]):not([type=checkbox])')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tools = ['inspect', 'feed', 'dose', 'seed', 'stir'];
  if (e.key >= '1' && e.key <= '5') { setTool(tools[+e.key - 1]); return; }
  switch (e.key.toLowerCase()) {
    case ' ': e.preventDefault(); setRunning(!running); break;
    case 'r': newDish(); break;
    case 'f': fitView(); break;
    case 'escape': select(null); break;
    default: return;
  }
});

// ------------------------------------------------------------ inspector
function updateInspector() {
  const c = view.selected;
  if (!c) return;
  $('iName').textContent = lineageName(c.lineage);
  $('iDot').style.background = c.col.dot;
  const st = $('iStatus');
  st.classList.toggle('dead', c.state !== ALIVE);
  if (c.state === ALIVE) {
    st.textContent = c.mode[0].toUpperCase() + c.mode.slice(1) + (c.prey ? ' · digesting prey' : '');
  } else if (c.state === ENGULFED) {
    st.textContent = `Being digested (${Math.round(c.digest * 100)}%)`;
  } else {
    st.textContent = c.cause ? c.cause[0].toUpperCase() + c.cause.slice(1) : 'Gone';
  }
  const rows = [
    ['Generation', c.gen], ['Age', `${Math.floor(c.age)} s`],
    ['Size', `${Math.round(c.mass)} / ${Math.round(c.ph.divMass)}`], ['Children', c.kids],
    ['Cells devoured', c.kills], ['Fusions', c.fusions], ['Colony bonds', c.links.length],
  ];
  $('iStats').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('iGenes').innerHTML = TRAITS.map((t) =>
    `<div class="gene"><span>${TRAIT_LABELS[t]}</span><i style="--v:${Math.round(c.g[t] * 100)}%;--c:${c.col.dot}"></i></div>`).join('');
}

// ---------------------------------------------------------------- panel
const chart = $('chart'), cctx = chart.getContext('2d');
function drawChart() {
  const w = chart.clientWidth, h = chart.clientHeight, dpr = view.dpr;
  if (chart.width !== Math.round(w * dpr)) { chart.width = Math.round(w * dpr); chart.height = Math.round(h * dpr); }
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cctx.clearRect(0, 0, w, h);
  const H = world.hist;
  if (H.length < 2) return;
  let max = 1;
  for (const b of H) { let s = 0; for (const v of b) s += v; if (s > max) max = s; }
  const dx = w / 239, x0 = w - (H.length - 1) * dx, acc = new Float32Array(H.length), sy = (v) => h - (v / max) * (h - 4);
  for (let k = 0; k < 12; k++) {
    cctx.beginPath();
    for (let i = 0; i < H.length; i++) cctx.lineTo(x0 + i * dx, sy(acc[i] + H[i][k]));
    for (let i = H.length - 1; i >= 0; i--) cctx.lineTo(x0 + i * dx, sy(acc[i]));
    cctx.fillStyle = `hsla(${k * 30 + 15},60%,58%,0.85)`;
    cctx.fill();
    for (let i = 0; i < H.length; i++) acc[i] += H[i][k];
  }
}

let lastEvent = null;
function updatePanel() {
  const st = world.stats;
  $('sAlive').textContent = world.alive.toLocaleString();
  $('sBirths').textContent = st.births.toLocaleString();
  $('sDeaths').textContent = st.deaths.toLocaleString();
  $('sEaten').textContent = st.eaten.toLocaleString();
  $('sFusions').textContent = st.fusions.toLocaleString();
  $('sColonies').textContent = st.colonies;
  $('sBiggest').textContent = st.biggestColony;
  $('clock').textContent = `${fmtTime(world.t)} · ${world.alive} cells${running ? '' : ' · paused'}`;
  drawChart();

  const all = [...world.lineages.values()];
  const living = all.filter((L) => L.alive > 0).sort((a, b) => b.alive - a.alive).slice(0, 7);
  const lost = all.filter((L) => L.extinct && !L.parent && !L.hybrid).slice(0, 4);
  $('strains').innerHTML = [...living, ...lost].map((L) =>
    `<li class="${L.alive ? '' : 'gone'}"><span class="dot" style="background:hsl(${L.hue},70%,62%)"></span>${L.name}<span class="n">${L.alive || 'extinct'}</span></li>`).join('');

  if (world.events[0] !== lastEvent) {
    lastEvent = world.events[0];
    $('events').innerHTML = world.events.slice(0, 5).map((ev) =>
      `<li><span class="dot" style="background:hsl(${ev.hue},70%,62%)"></span><time>${fmtTime(ev.t)}</time>${ev.text}</li>`).join('');
  }
  updateInspector();
}

// ------------------------------------------------------------ main loop
let lastT = performance.now(), acc = 0, uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  if (running) {
    acc += dt * P.speed;
    let n = 0;
    while (acc >= DT && n < 12) { step(DT); acc -= DT; n++; }
    if (n === 12) acc = 0;
  }
  applyTools(dt);
  if (view.cw > 0) render();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updatePanel(); }
  requestAnimationFrame(frame);
}

new ResizeObserver(() => resizeView(stage.clientWidth, stage.clientHeight)).observe(stage);
resizeView(stage.clientWidth, stage.clientHeight);
setTool('inspect');
newDish();
requestAnimationFrame(frame);

})();
</script>
