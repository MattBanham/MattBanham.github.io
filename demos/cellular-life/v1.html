<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cellular Life</title>
  <style>
:root {
  --bg: #0b0f17;
  --panel: #111827;
  --panel-2: #1a2233;
  --line: #263044;
  --text: #e5e7eb;
  --muted: #8b95a7;
  --accent: #3ce0c0;
  --accent-ink: #062a24;
  --bad: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}

#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#panel {
  width: 270px;
  flex: none;
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 14px 16px 20px;
}

h1 {
  margin: 0 0 12px;
  font-size: 17px;
  letter-spacing: 0.02em;
}
h1::before {
  content: "";
  display: inline-block;
  width: 10px; height: 10px;
  margin-right: 8px;
  background: var(--accent);
  box-shadow: 12px 0 0 #3b82f6, 6px -6px 0 #8b5cf6;
  transform: translateY(-1px);
}

h2 {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

section {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
section:first-of-type { border-top: 0; padding-top: 0; }

.row { display: flex; gap: 6px; margin-bottom: 6px; }
.row > button { flex: 1; }

button, select, input[type=text], #rule {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
}
button { cursor: pointer; }
button:hover { border-color: #3a4660; }
button.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 600;
}
button.primary.running { background: #f59e0b; border-color: #f59e0b; color: #2a1800; }

select, #rule { width: 100%; margin-bottom: 6px; }
#rule { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
#rule.invalid { border-color: var(--bad); }

label { display: block; margin: 8px 0 4px; color: var(--muted); }
label select { margin-top: 4px; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--text); margin: 6px 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.val { float: right; color: var(--text); font-variant-numeric: tabular-nums; }

.seg { display: flex; margin-bottom: 6px; }
.seg button { flex: 1; border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button.on { background: #22304a; border-color: var(--accent); color: var(--accent); position: relative; }

.hint { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.keys { border-top: 1px solid var(--line); padding-top: 12px; }
.keys b { color: var(--text); font-weight: 600; }

.stats {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 8px;
  margin: 0 0 8px;
}
.stats dt { color: var(--muted); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

#spark {
  width: 100%;
  height: 56px;
  display: block;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
}

#stage {
  flex: 1;
  position: relative;
  min-width: 0;
}
#world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}
#world.panning { cursor: grabbing; }

@media (max-width: 720px) {
  #app { flex-direction: column-reverse; height: auto; min-height: 100vh; overflow: visible; }
  #panel { width: 100%; border-right: 0; border-top: 1px solid var(--line); }
  #stage { height: 60vh; flex: none; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Cellular Life</h1>

    <section>
      <div class="row">
        <button id="play" class="primary" title="Play / pause (Space)">▶ Play</button>
        <button id="step" title="Step one generation (N)">Step</button>
      </div>
      <div class="row">
        <button id="random" title="Randomize (R)">Random</button>
        <button id="clear" title="Clear (C)">Clear</button>
        <button id="fit" title="Fit view (F)">Fit</button>
      </div>
      <label>Speed <span id="speedVal" class="val"></span>
        <input id="speed" type="range" min="1" max="120" value="20">
      </label>
    </section>

    <section>
      <h2>Rule</h2>
      <select id="preset"></select>
      <input id="rule" spellcheck="false" autocomplete="off" aria-label="Rule in B/S notation">
      <p class="hint" id="ruleDesc"></p>
    </section>

    <section>
      <h2>Tool</h2>
      <div class="seg" id="tools">
        <button data-tool="draw" class="on" title="Draw (D)">Draw</button>
        <button data-tool="erase" title="Erase (E)">Erase</button>
        <button data-tool="stamp" title="Stamp (S)">Stamp</button>
      </div>
      <select id="pattern" aria-label="Pattern to stamp"></select>
      <p class="hint">Stamp: click to place · Q / W rotate</p>
    </section>

    <section>
      <h2>World</h2>
      <label>Size
        <select id="size">
          <option value="fit">Fit window</option>
          <option value="128x80">128 × 80</option>
          <option value="256x160">256 × 160</option>
          <option value="400x250">400 × 250</option>
          <option value="640x400">640 × 400</option>
          <option value="1000x625">1000 × 625</option>
        </select>
      </label>
      <label>Random density <span id="densityVal" class="val"></span>
        <input id="density" type="range" min="5" max="80" value="30">
      </label>
      <label class="check"><input type="checkbox" id="trails" checked> Trails</label>
      <label class="check"><input type="checkbox" id="ageColor" checked> Colour by age</label>
      <label class="check"><input type="checkbox" id="wrap" checked> Wrap edges</label>
      <label class="check"><input type="checkbox" id="grid" checked> Grid lines when zoomed</label>
    </section>

    <section>
      <h2>Stats</h2>
      <dl class="stats">
        <dt>Generation</dt><dd id="sGen">0</dd>
        <dt>Population</dt><dd id="sPop">0</dd>
        <dt>Births</dt><dd id="sBirths">0</dd>
        <dt>Deaths</dt><dd id="sDeaths">0</dd>
      </dl>
      <canvas id="spark" aria-label="Population history"></canvas>
    </section>

    <p class="hint keys">
      <b>Space</b> play · <b>N</b> step · <b>R</b> random · <b>C</b> clear · <b>F</b> fit<br>
      Wheel zoom · right-drag or Shift-drag to pan
    </p>
  </aside>

  <main id="stage">
    <canvas id="world"></canvas>
  </main>
</div>
<script>
/* Cellular Life — a life-like / Generations cellular automaton playground.
 * No dependencies. Grid uses padded typed arrays (1-cell border) so the
 * neighbour count needs no bounds checks; wrapping copies edges into the border.
 */
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------- rules
  const PRESETS = [
    ["Conway's Life", 'B3/S23', 'The classic: gliders, oscillators, guns.'],
    ['HighLife', 'B36/S23', 'Like Life, plus a self-replicating pattern.'],
    ['Day & Night', 'B3678/S34678', 'Dead and alive behave symmetrically.'],
    ['Seeds', 'B2/S', 'Nothing survives; everything explodes.'],
    ['Life without Death', 'B3/S012345678', 'Cells never die; grows ladders and blobs.'],
    ['Maze', 'B3/S12345', 'Grows into maze-like corridors.'],
    ['Mazectric', 'B3/S1234', 'Longer, straighter maze corridors.'],
    ['Coral', 'B3/S45678', 'Slow, coral-like growth.'],
    ['2x2', 'B36/S125', 'Block-based patterns that split and merge.'],
    ['Replicator', 'B1357/S1357', 'Every pattern copies itself.'],
    ['Morley', 'B368/S245', 'Rich in spaceships ("Move").'],
    ['Anneal', 'B4678/S35678', 'Random soup melts into smooth blobs.'],
    ["Brian's Brain", 'B2/S/3', 'Generations rule: cells fire, then rest.'],
    ['Star Wars', 'B2/S345/4', 'Generations rule with long-lived ships.'],
    ['Fireworks', 'B13/S2/21', 'Generations rule with long glowing tails.'],
  ];

  function parseRule(str) {
    const m = str.toUpperCase().replace(/\s+/g, '')
      .match(/^B([0-8]*)\/S([0-8]*)(?:\/[CG]?(\d+))?$/);
    if (!m) return null;
    const bits = (s) => [...s].reduce((a, d) => a | (1 << +d), 0);
    const c = m[3] ? Math.max(2, Math.min(255, +m[3])) : 2;
    return { b: bits(m[1]), s: bits(m[2]), c, text: `B${m[1]}/S${m[2]}${c > 2 ? '/' + c : ''}` };
  }

  // ------------------------------------------------------------- patterns
  const PATTERNS = {
    'Glider': ['.O.', '..O', 'OOO'],
    'Lightweight spaceship': ['.O..O', 'O....', 'O...O', 'OOOO.'],
    'R-pentomino': ['.OO', 'OO.', '.O.'],
    'Acorn': ['.O.....', '...O...', 'OO..OOO'],
    'Diehard': ['......O.', 'OO......', '.O...OOO'],
    'Pulsar': [
      '..OOO...OOO..', '.............', 'O....O.O....O', 'O....O.O....O',
      'O....O.O....O', '..OOO...OOO..', '.............', '..OOO...OOO..',
      'O....O.O....O', 'O....O.O....O', 'O....O.O....O', '.............',
      '..OOO...OOO..',
    ],
    'Pentadecathlon': ['..O....O..', 'OO.OOOO.OO', '..O....O..'],
    'Gosper glider gun': [
      '........................O...........',
      '......................O.O...........',
      '............OO......OO............OO',
      '...........O...O....OO............OO',
      'OO........O.....O...OO..............',
      'OO........O...O.OO....O.O...........',
      '..........O.....O.......O...........',
      '...........O...O....................',
      '............OO......................',
    ],
    'HighLife replicator': ['..OOO', '.O..O', 'O...O', 'O..O.', 'OOO..'],
    'Single cell': ['O'],
  };

  function makePattern(rows) {
    const cells = [];
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'O') cells.push([x, y]); }));
    return { cells, w: Math.max(...rows.map((r) => r.length)), h: rows.length };
  }
  function rotate(p, times) {
    let { cells, w, h } = p;
    for (let t = 0; t < ((times % 4) + 4) % 4; t++) {
      cells = cells.map(([x, y]) => [h - 1 - y, x]);
      [w, h] = [h, w];
    }
    return { cells, w, h };
  }

  // --------------------------------------------------------------- colours
  const rgba = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  const BG = [11, 15, 23];
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);
  function ramp(stops, n) {
    const out = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      let k = 0;
      while (k < stops.length - 2 && i > stops[k + 1][0]) k++;
      const [p0, c0] = stops[k], [p1, c1] = stops[k + 1];
      const t = Math.min(1, Math.max(0, (i - p0) / (p1 - p0)));
      out[i] = rgba(lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t));
    }
    return out;
  }
  const AGE_LUT = ramp([
    [0, [236, 255, 250]], [4, [60, 224, 192]], [24, [59, 130, 246]],
    [90, [139, 92, 246]], [255, [217, 70, 239]],
  ], 256);
  const TRAIL_LUT = ramp([[0, BG], [255, [22, 78, 99]]], 256);
  const DYING_LUT = ramp([[0, BG], [255, [245, 158, 11]]], 256);
  const LIVE_FLAT = rgba(60, 224, 192);
  const BG32 = rgba(...BG);

  // ----------------------------------------------------------------- state
  let W, H, PW, N;
  let live, nlive, state, nstate, age, nage, trail;
  let off, offCtx, img, u32;
  let rule = parseRule('B3/S23');
  let gen = 0, pop = 0, births = 0, deaths = 0;
  const history = [];
  const HISTORY_MAX = 300;

  const opts = { wrap: true, trails: true, ageColor: true, grid: true };

  off = document.createElement('canvas');
  offCtx = off.getContext('2d');

  function alloc(w, h) {
    W = w; H = h; PW = W + 2; N = PW * (H + 2);
    live = new Uint8Array(N); nlive = new Uint8Array(N);
    state = new Uint8Array(N); nstate = new Uint8Array(N);
    age = new Uint8Array(N); nage = new Uint8Array(N);
    trail = new Uint8Array(N);
    off.width = W; off.height = H;
    img = offCtx.createImageData(W, H);
    u32 = new Uint32Array(img.data.buffer);
    resetStats();
  }

  function resetStats() {
    gen = 0; births = 0; deaths = 0; history.length = 0;
  }

  const idx = (x, y) => (y + 1) * PW + x + 1;
  const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;

  function setCell(x, y, on) {
    if (!inside(x, y)) return;
    const i = idx(x, y);
    state[i] = live[i] = on ? 1 : 0;
    age[i] = 0;
    if (!on) trail[i] = 0;
  }

  function clearWorld() {
    live.fill(0); state.fill(0); age.fill(0); trail.fill(0);
    nlive.fill(0); nstate.fill(0); nage.fill(0);
    resetStats();
  }

  function randomize(density) {
    clearWorld();
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (Math.random() < density) { const i = idx(x, y); live[i] = state[i] = 1; }
      }
    }
  }

  function wrapBorders(a) {
    const last = (H + 1) * PW;
    a.copyWithin(0, H * PW, H * PW + PW);   // bottom row -> top border
    a.copyWithin(last, PW, PW + PW);        // top row -> bottom border
    for (let r = 0; r < H + 2; r++) {
      const o = r * PW;
      a[o] = a[o + W];
      a[o + W + 1] = a[o + 1];
    }
  }
  function zeroBorders(a) {
    a.fill(0, 0, PW);
    a.fill(0, (H + 1) * PW, N);
    for (let r = 0; r < H + 2; r++) { a[r * PW] = 0; a[r * PW + W + 1] = 0; }
  }

  function step() {
    if (opts.wrap) wrapBorders(live); else zeroBorders(live);
    const B = rule.b, S = rule.s, C = rule.c;
    let b = 0, d = 0;
    for (let y = 1; y <= H; y++) {
      let i = y * PW + 1;
      for (let x = 0; x < W; x++, i++) {
        const n = live[i - PW - 1] + live[i - PW] + live[i - PW + 1]
                + live[i - 1] + live[i + 1]
                + live[i + PW - 1] + live[i + PW] + live[i + PW + 1];
        const s = state[i];
        let ns;
        if (s === 0) ns = (B >> n) & 1;
        else if (s === 1) ns = (S >> n) & 1 ? 1 : (C > 2 ? 2 : 0);
        else ns = s + 1 < C ? s + 1 : 0;

        nstate[i] = ns;
        if (ns === 1) {
          nlive[i] = 1;
          if (s === 1) { const a = age[i]; nage[i] = a < 255 ? a + 1 : 255; }
          else { nage[i] = 0; b++; }
        } else {
          nlive[i] = 0;
          nage[i] = 0;
          if (s === 1) { d++; trail[i] = 255; }
          else if (trail[i]) trail[i] = trail[i] > 8 ? trail[i] - 8 : 0;
        }
      }
    }
    [live, nlive] = [nlive, live];
    [state, nstate] = [nstate, state];
    [age, nage] = [nage, age];
    births = b; deaths = d; gen++;
    history.push(countPop());
    if (history.length > HISTORY_MAX) history.shift();
  }

  function countPop() {
    let p = 0;
    for (let y = 1; y <= H; y++) {
      let i = y * PW + 1;
      for (let x = 0; x < W; x++, i++) p += live[i];
    }
    return p;
  }

  // ----------------------------------------------------------- rendering
  const canvas = $('world');
  const ctx = canvas.getContext('2d');
  const stage = $('stage');
  let cw = 0, ch = 0, dpr = 1;
  const view = { z: 4, ox: 0, oy: 0 };
  let hover = null;

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    cw = stage.clientWidth; ch = stage.clientHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }

  function fitView() {
    const z = Math.min(cw / W, ch / H);
    view.z = z;
    view.ox = (cw - W * z) / 2;
    view.oy = (ch - H * z) / 2;
  }

  function paintImage() {
    let p = 0, k = 0;
    const flat = !opts.ageColor, showTrails = opts.trails, C = rule.c;
    for (let y = 1; y <= H; y++) {
      let i = y * PW + 1;
      for (let x = 0; x < W; x++, i++, k++) {
        const s = state[i];
        if (s === 1) { u32[k] = flat ? LIVE_FLAT : AGE_LUT[age[i]]; p++; }
        else if (s > 1) u32[k] = DYING_LUT[Math.round(255 * (1 - (s - 1) / (C - 1)))];
        else u32[k] = showTrails && trail[i] ? TRAIL_LUT[trail[i]] : BG32;
      }
    }
    pop = p;
    offCtx.putImageData(img, 0, 0);
  }

  function render() {
    paintImage();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#070a10';
    ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = false;
    const { z, ox, oy } = view;
    ctx.drawImage(off, ox, oy, W * z, H * z);

    // world border
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.strokeRect(ox - 0.5, oy - 0.5, W * z + 1, H * z + 1);

    if (opts.grid && z >= 8) {
      const x0 = Math.max(0, Math.floor(-ox / z)), x1 = Math.min(W, Math.ceil((cw - ox) / z));
      const y0 = Math.max(0, Math.floor(-oy / z)), y1 = Math.min(H, Math.ceil((ch - oy) / z));
      ctx.beginPath();
      for (let x = x0; x <= x1; x++) { const px = Math.round(ox + x * z) + 0.5; ctx.moveTo(px, oy + y0 * z); ctx.lineTo(px, oy + y1 * z); }
      for (let y = y0; y <= y1; y++) { const py = Math.round(oy + y * z) + 0.5; ctx.moveTo(ox + x0 * z, py); ctx.lineTo(ox + x1 * z, py); }
      ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.08, (z - 7) * 0.01)})`;
      ctx.stroke();
    }

    if (hover) {
      if (tool === 'stamp') {
        const p = currentPattern();
        const bx = hover[0] - Math.floor(p.w / 2), by = hover[1] - Math.floor(p.h / 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        for (const [x, y] of p.cells) ctx.fillRect(ox + (bx + x) * z, oy + (by + y) * z, Math.max(1, z), Math.max(1, z));
        ctx.strokeStyle = 'rgba(60,224,192,0.6)';
        ctx.strokeRect(ox + bx * z - 0.5, oy + by * z - 0.5, p.w * z + 1, p.h * z + 1);
      } else if (inside(hover[0], hover[1])) {
        ctx.strokeStyle = tool === 'erase' ? 'rgba(248,113,113,0.9)' : 'rgba(255,255,255,0.8)';
        ctx.strokeRect(ox + hover[0] * z - 0.5, oy + hover[1] * z - 0.5, Math.max(2, z) + 1, Math.max(2, z) + 1);
      }
    }
  }

  // ------------------------------------------------------------- stats UI
  const spark = $('spark');
  const sctx = spark.getContext('2d');
  let lastStatsUpdate = 0;
  const fmt = (n) => n.toLocaleString();

  function updateStats(now) {
    if (now - lastStatsUpdate < 100) return;
    lastStatsUpdate = now;
    $('sGen').textContent = fmt(gen);
    $('sPop').textContent = fmt(pop);
    $('sBirths').textContent = fmt(births);
    $('sDeaths').textContent = fmt(deaths);

    const w = spark.clientWidth, h = spark.clientHeight;
    if (spark.width !== Math.round(w * dpr)) { spark.width = Math.round(w * dpr); spark.height = Math.round(h * dpr); }
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;
    let max = 1;
    for (const v of history) if (v > max) max = v;
    const stepX = w / (HISTORY_MAX - 1);
    const startX = w - (history.length - 1) * stepX;
    sctx.beginPath();
    history.forEach((v, i) => {
      const x = startX + i * stepX, y = h - 4 - (v / max) * (h - 8);
      i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
    });
    sctx.strokeStyle = '#3ce0c0';
    sctx.lineWidth = 1.5;
    sctx.stroke();
    sctx.lineTo(w, h); sctx.lineTo(startX, h); sctx.closePath();
    sctx.fillStyle = 'rgba(60,224,192,0.12)';
    sctx.fill();
  }

  // ------------------------------------------------------------ main loop
  let running = false, speed = 20, acc = 0, lastT = performance.now();
  function frame(t) {
    const dt = Math.min(0.1, (t - lastT) / 1000);
    lastT = t;
    if (running) {
      acc += dt * speed;
      let n = 0;
      while (acc >= 1 && n < 8) { step(); acc -= 1; n++; }
      if (n === 8) acc = 0;
    }
    render();
    updateStats(t);
    requestAnimationFrame(frame);
  }

  function setRunning(on) {
    running = on; acc = on ? 1 : 0;
    const b = $('play');
    b.textContent = on ? '❚❚ Pause' : '▶ Play';
    b.classList.toggle('running', on);
  }

  // ------------------------------------------------------------ input
  let tool = 'draw';
  let rotation = 0;
  let painting = null;   // {on, last:[x,y]}
  let panning = null;

  const patternSel = $('pattern');
  for (const name of Object.keys(PATTERNS)) patternSel.add(new Option(name, name));
  let patternCache = null;
  function currentPattern() {
    const key = patternSel.value + '|' + rotation;
    if (!patternCache || patternCache.key !== key) {
      patternCache = { key, p: rotate(makePattern(PATTERNS[patternSel.value]), rotation) };
    }
    return patternCache.p;
  }

  function stamp(cx, cy) {
    const p = currentPattern();
    const bx = cx - Math.floor(p.w / 2), by = cy - Math.floor(p.h / 2);
    for (const [x, y] of p.cells) {
      let px = bx + x, py = by + y;
      if (opts.wrap) { px = ((px % W) + W) % W; py = ((py % H) + H) % H; }
      setCell(px, py, true);
    }
  }

  function toCell(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left - view.ox) / view.z), Math.floor((e.clientY - r.top - view.oy) / view.z)];
  }

  function paintLine([x0, y0], [x1, y1], on) {
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      setCell(x0, y0, on);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    if (e.button === 1 || e.button === 2 || e.shiftKey) {
      panning = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
      canvas.classList.add('panning');
      return;
    }
    if (e.button !== 0) return;
    const c = toCell(e);
    if (tool === 'stamp') { stamp(c[0], c[1]); return; }
    painting = { on: tool === 'draw', last: c };
    setCell(c[0], c[1], painting.on);
  });
  canvas.addEventListener('pointermove', (e) => {
    hover = toCell(e);
    if (panning) {
      view.ox = panning.ox + e.clientX - panning.x;
      view.oy = panning.oy + e.clientY - panning.y;
    } else if (painting) {
      paintLine(painting.last, hover, painting.on);
      painting.last = hover;
    }
  });
  const endPointer = () => { painting = null; panning = null; canvas.classList.remove('panning'); };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { if (!painting && !panning) hover = null; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const nz = Math.min(64, Math.max(0.5, view.z * Math.exp(-e.deltaY * 0.0015)));
    view.ox = mx - (mx - view.ox) * (nz / view.z);
    view.oy = my - (my - view.oy) * (nz / view.z);
    view.z = nz;
  }, { passive: false });

  // ------------------------------------------------------------ controls
  const presetSel = $('preset');
  const ruleInput = $('rule');
  PRESETS.forEach(([name, r]) => presetSel.add(new Option(`${name}  (${r})`, r)));
  presetSel.add(new Option('Custom…', 'custom'));

  function applyRule(text, fromPreset) {
    const r = parseRule(text);
    ruleInput.classList.toggle('invalid', !r);
    if (!r) { $('ruleDesc').textContent = 'Use B/S notation, e.g. B3/S23 or B2/S/3 for Generations.'; return; }
    rule = r;
    // clear stale "dying" states that the new rule can't represent
    if (state && rule.c === 2) for (let i = 0; i < N; i++) if (state[i] > 1) state[i] = 0;
    const preset = PRESETS.find((p) => p[1] === r.text);
    presetSel.value = preset ? preset[1] : 'custom';
    let desc = preset ? preset[2] : 'Custom rule.';
    if (r.c > 2 && !preset) desc += ` Generations rule with ${r.c} states.`;
    $('ruleDesc').textContent = desc;
    if (fromPreset) ruleInput.value = r.text;
  }

  presetSel.addEventListener('change', () => {
    if (presetSel.value === 'custom') { ruleInput.focus(); ruleInput.select(); return; }
    applyRule(presetSel.value, true);
    presetSel.blur();
  });
  ruleInput.addEventListener('input', () => applyRule(ruleInput.value, false));
  ruleInput.addEventListener('blur', () => { if (parseRule(ruleInput.value)) ruleInput.value = rule.text; });

  $('play').addEventListener('click', () => setRunning(!running));
  $('step').addEventListener('click', () => { setRunning(false); step(); });
  $('random').addEventListener('click', () => randomize(density()));
  $('clear').addEventListener('click', () => { setRunning(false); clearWorld(); });
  $('fit').addEventListener('click', fitView);

  const speedEl = $('speed');
  const showSpeed = () => { speed = +speedEl.value; $('speedVal').textContent = `${speed} gen/s`; };
  speedEl.addEventListener('input', showSpeed);

  const densityEl = $('density');
  const density = () => +densityEl.value / 100;
  const showDensity = () => { $('densityVal').textContent = `${densityEl.value}%`; };
  densityEl.addEventListener('input', showDensity);

  for (const id of ['trails', 'ageColor', 'wrap', 'grid']) {
    const el = $(id);
    el.addEventListener('change', () => {
      opts[id] = el.checked;
      if (id === 'trails' && !el.checked) trail.fill(0);
    });
  }

  function setTool(t) {
    tool = t;
    for (const b of $('tools').children) b.classList.toggle('on', b.dataset.tool === t);
  }
  $('tools').addEventListener('click', (e) => { if (e.target.dataset.tool) setTool(e.target.dataset.tool); });
  patternSel.addEventListener('change', () => { rotation = 0; setTool('stamp'); patternSel.blur(); });

  function sizeFromSelect() {
    const v = $('size').value;
    if (v === 'fit') return [Math.max(32, Math.floor(cw / 5)), Math.max(24, Math.floor(ch / 5))];
    return v.split('x').map(Number);
  }
  $('size').addEventListener('change', () => {
    const [w, h] = sizeFromSelect();
    alloc(w, h);
    randomize(density());
    fitView();
    $('size').blur();
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input:not([type=range]):not([type=checkbox]), select, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key.toLowerCase()) {
      case ' ': e.preventDefault(); setRunning(!running); break;
      case 'n': setRunning(false); step(); break;
      case 'r': randomize(density()); break;
      case 'c': setRunning(false); clearWorld(); break;
      case 'f': fitView(); break;
      case 'd': setTool('draw'); break;
      case 'e': setTool('erase'); break;
      case 's': setTool('stamp'); break;
      case 'q': rotation--; break;
      case 'w': rotation++; break;
      default: return;
    }
  });

  // The stage can have zero size at load (hidden tab, still laying out);
  // build the world on the first real size instead.
  let booted = false;
  function boot() {
    if (booted || cw < 2 || ch < 2) return;
    booted = true;
    alloc(...sizeFromSelect());
    randomize(density());
    fitView();
    setRunning(true);
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => { resizeCanvas(); boot(); }).observe(stage);

  showSpeed();
  showDensity();
  applyRule('B3/S23', true);
  resizeCanvas();
  boot();
})();
</script>
</body>
</html>
