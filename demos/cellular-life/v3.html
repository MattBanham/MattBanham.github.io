<script>
(() => {
'use strict';
// Emergence (Cellular Life v3): geometry, cell types, genes, body plans and species.
// No DOM here, so the simulation also runs headless in Node for tuning.

// ---- geometry ----------------------------------------------------------------
// The world is W x H sites. W is a power of two, so a site index s splits into
// x = s & XM and y = s >> 8. A one-site wall runs round the edge.
const W = 256, H = 160, N = W * H, XM = W - 1;
const TPS = 30;                                          // ticks per simulated second
const BIN = 4, BW = W / BIN, BH = H / BIN, NB = BW * BH; // light is shared per 4x4 block
const WALL = -1;                                         // occupancy value of the wall

const DX = [1, 1, 0, -1, -1, -1, 0, 1], DY = [0, 1, 1, 1, 0, -1, -1, -1]; // 8 headings
const N4X = [1, 0, -1, 0], N4Y = [0, 1, 0, -1];

const site = (x, y) => (y << 8) | x;
const binOf = (s) => ((s >> 10) << 6) | ((s & XM) >> 2); // assumes BIN = 4, BW = 64
function wrapSite(x, y) {
  if (y < 0) y += H; else if (y >= H) y -= H;
  return (y << 8) | (x & XM);
}

const NB4 = new Int32Array(N * 4); // the four neighbours of every site
for (let s = 0; s < N; s++) {
  for (let k = 0; k < 4; k++) NB4[s * 4 + k] = wrapSite((s & XM) + N4X[k], (s >> 8) + N4Y[k]);
}

// ---- helpers -------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (n) => (Math.random() * n) | 0;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
function gauss() {
  let u = 0;
  while (!u) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
}
function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}
const dirOf = (dx, dy) => Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) & 7;

// ---- cell types ------------------------------------------------------------------
const PHOTO = 0, INTAKE = 1, MOTOR = 2, BLADE = 3, SHELL = 4, SENSOR = 5, NT = 6;
const TYPES = [
  { name: 'Photo', role: 'harvests light', cost: 4, upkeep: 0.011, rgb: [92, 242, 182] },
  { name: 'Intake', role: 'absorbs loose matter', cost: 4, upkeep: 0.013, rgb: [255, 196, 92] },
  { name: 'Motor', role: 'moves the body', cost: 5, upkeep: 0.017, rgb: [80, 190, 255] },
  { name: 'Blade', role: 'cuts and eats foreign cells', cost: 6, upkeep: 0.02, rgb: [255, 82, 110] },
  { name: 'Shell', role: 'turns blades, but is heavy', cost: 6, upkeep: 0.012, rgb: [168, 152, 255] },
  { name: 'Sensor', role: 'sees food, prey and threats', cost: 6, upkeep: 0.017, rgb: [236, 242, 255] },
];
const COST = TYPES.map((t) => t.cost);
const UPKEEP = TYPES.map((t) => t.upkeep);

// ---- genes ---------------------------------------------------------------------------
// Behaviour genes ride alongside the body plan. tag is a neutral marker that drifts
// over the generations: organisms with close tags treat each other as kin.
const GENES = [
  ['light', 'Light seeking'], ['food', 'Foraging'], ['prey', 'Hunting'], ['flee', 'Caution'],
  ['tumble', 'Wandering'], ['invest', 'Offspring size'], ['disperse', 'Spore range'],
];
function randomGenes() {
  return {
    tag: Math.random(), light: Math.random(), food: Math.random(), prey: Math.random(),
    flee: Math.random(), tumble: Math.random(), invest: rand(0.4, 0.6), disperse: rand(1, 4),
  };
}
function mutateGenes(g, rate) {
  const c = { ...g };
  c.tag = (g.tag + gauss() * 0.01 * rate + 1) % 1;
  for (const k of ['light', 'food', 'prey', 'flee', 'tumble']) {
    if (Math.random() < 0.25 * rate) c[k] = clamp(g[k] + gauss() * 0.12, 0, 1);
  }
  if (Math.random() < 0.25 * rate) c.invest = clamp(g.invest + gauss() * 0.05, 0.15, 1);
  if (Math.random() < 0.25 * rate) c.disperse = clamp(g.disperse + gauss() * 0.7, 1, 10);
  return c;
}

// ---- body plans --------------------------------------------------------------------
// A plan is a list of base cells [x, y, type] relative to the zygote at (0, 0).
// The symmetry copies each base cell. An organism starts as the single zygote cell
// and grows the rest of its body one cell at a time, in plan order.
const MAX_BODY = 64, REACH = 7;
const SYM_NAMES = ['asymmetric', 'bilateral', 'biradial', 'radial'];

function images(x, y, sym) {
  if (sym === 1) return [x, y, -x, y];
  if (sym === 2) return [x, y, -x, y, x, -y, -x, -y];
  if (sym === 3) return [x, y, -y, x, -x, -y, y, -x];
  return [x, y];
}
const pkey = (x, y) => (x + 32) * 64 + y + 32;

function connected(plan) {
  const cells = new Set(plan.map((e) => pkey(e[0], e[1])));
  const seen = new Set([pkey(0, 0)]), stack = [0, 0];
  while (stack.length) {
    const y = stack.pop(), x = stack.pop();
    for (let k = 0; k < 4; k++) {
      const nx = x + N4X[k], ny = y + N4Y[k], key = pkey(nx, ny);
      if (cells.has(key) && !seen.has(key)) { seen.add(key); stack.push(nx, ny); }
    }
  }
  return seen.size === cells.size;
}

function randomType(not) {
  let t;
  do t = randi(NT); while (t === not);
  return t;
}

// One random change to a body plan. Returns a form, or null if the change was invalid.
function mutatePlan(m) {
  const plan = m.plan.map((e) => e.slice());
  let sym = m.sym;
  const r = Math.random();
  if (r < 0.6) {                       // the body gains a cell
    const b = plan[randi(plan.length)], k = randi(4), x = b[0] + N4X[k], y = b[1] + N4Y[k];
    if (Math.abs(x) > REACH || Math.abs(y) > REACH) return null;
    if (plan.some((e) => e[0] === x && e[1] === y)) return null;
    plan.push([x, y, Math.random() < 0.5 ? b[2] : randi(NT)]);
  } else if (r < 0.74) {               // the body loses a cell (never the zygote)
    if (plan.length < 2) return null;
    plan.splice(1 + randi(plan.length - 1), 1);
    if (!connected(plan)) return null;
  } else if (r < 0.92) {               // a cell changes type
    const e = plan[randi(plan.length)];
    e[2] = randomType(e[2]);
  } else {                             // the symmetry changes
    do sym = randi(4); while (sym === m.sym);
  }
  return getMorph(plan, sym, m);
}

// ---- species -------------------------------------------------------------------------
// Every distinct body is a species ("form"), shared by all organisms that have it.
const morphs = new Map(); // body signature -> form with living members
let morphSeq = 0;
const SYL1 = ['Ka', 'Ve', 'Ny', 'Zo', 'Qi', 'Lu', 'Tor', 'Mi', 'Xa', 'Re', 'Sol', 'Ix',
  'Ae', 'Dra', 'Un', 'Pho', 'Vel', 'Ori', 'Cy', 'Thal', 'Eon', 'Sy'];
const SYL2 = ['rax', 'lin', 'th', 'mon', 'vex', 'sis', 'ra', 'tum', 'lor', 'dyn', 'qua',
  'zen', 'ri', 'kos', 'phi', 'ne', 'dex', 'vor', 'lis', 'tra', 'on', 'mir'];

function morphName(id, n, t) {
  if (n === 1) return TYPES[t].name + ' protocell';
  const h = hash32(id + 7919);
  return SYL1[h % SYL1.length] + SYL2[(h >>> 12) % SYL2.length] + '-' + id;
}

function getMorph(plan, sym, parent) {
  const xs = [], ys = [], ts = [], seen = new Set();
  for (const [x, y, t] of plan) {
    const im = images(x, y, sym);
    for (let k = 0; k < im.length; k += 2) {
      const key = pkey(im[k], im[k + 1]);
      if (seen.has(key)) continue;
      seen.add(key); xs.push(im[k]); ys.push(im[k + 1]); ts.push(t);
    }
  }
  const n = xs.length;
  if (n > MAX_BODY) return null;
  const sig = xs.map((x, i) => x + ',' + ys[i] + ',' + ts[i]).sort().join(' ');
  const known = morphs.get(sig);
  if (known) return known;
  const count = new Int16Array(NT);
  let cost = 0, sx = 0, sy = 0, reach = 0;
  for (let i = 0; i < n; i++) {
    count[ts[i]]++; cost += COST[ts[i]]; sx += xs[i]; sy += ys[i];
    reach = Math.max(reach, Math.abs(xs[i]), Math.abs(ys[i]));
  }
  const id = ++morphSeq;
  const m = {
    id, sig, plan, sym, n, cost, count, reach,
    kinds: count.reduce((a, c) => a + (c > 0 ? 1 : 0), 0),
    xs: Int8Array.from(xs), ys: Int8Array.from(ys), ts: Uint8Array.from(ts),
    cx: Math.round(sx / n), cy: Math.round(sy / n),
    name: morphName(id, n, ts[0]),
    parent: parent ? parent.name : '',
    born: world.t, alive: 0, peak: 0, total: 0, glyph: null,
  };
  morphs.set(sig, m);
  return m;
}

// Emergence: the living world. Every organism is a clonal body of pixel cells that
// grows from one zygote cell along its body plan, feeds, moves, reproduces through a
// single-cell bottleneck and dies. No DOM, so it also runs headless in Node.

const P = { light: 0.5, mutation: 0.5, matter: 0.5 }; // slider settings, 0..1

// ---- tuning ----------------------------------------------------------------------
const AMBIENT = 0.13;            // light away from the suns
const PHOTO_GAIN = 0.05;         // energy per tick from one photo cell in full light
const BIN_CAP = 5;               // photo cells a 4x4 block of light feeds at the full rate
const SHADE = 1.5 * BIN_CAP;     // light demand above which a photo zygote cannot take root
const INTAKE_RATE = 0.12;        // matter one intake cell absorbs per tick at most
const INTAKE_EFF = 0.85;
const BLADE_RATE = 0.15;         // chance per tick that a blade strikes
const SHELL_BLOCK = 0.9;         // chance that a shell turns a blade
const PREY_SHARE = 0.8;          // share of a cut cell's energy the attacker keeps
const VMAX = 0.5;                // top speed in sites per tick
const THRUST = 3;                // speed = VMAX * min(1, THRUST * motors / mass)
const MOVE_COST = 0.003;         // energy per site moved, per unit of mass
const DRIFT = 0.04;              // chance per tick that a lone cell jiggles
const GROW_EVERY = 4;            // ticks between growth steps
const LIFE_BASE = 35, LIFE_PER_CELL = 2.5; // lifespan in seconds: big bodies live longer
const SNOW = 6, MATTER_CAP = 8, DEATH_MATTER = 0.6;
const KIN = 0.05;                // tag distance below which organisms are kin
const STRUCT_RATE = 0.1;         // body-plan mutations per birth at default mutation

// ---- state -------------------------------------------------------------------------
const occ = new Int32Array(N);   // organism slot + 1 on each site; 0 empty; WALL at the edge
const ctype = new Uint8Array(N); // cell type on each occupied site
const cidx = new Uint8Array(N);  // body index of the cell on each occupied site
const matter = new Float32Array(N);
const fx = new Uint8Array(N), fxKind = new Uint8Array(N); // flashes for the renderer
const light = new Float32Array(NB);
const photoNow = new Float32Array(NB), photoPrev = new Float32Array(NB); // light demand per block
// Bigger bodies pay less upkeep per cell, and overshadow small ones where light is crowded.
const SCALE = Float32Array.from({ length: MAX_BODY + 1 }, (_, n) => (n ? Math.max(0.45, n ** -0.25) : 1));
const REACH_UP = Float32Array.from({ length: MAX_BODY + 1 }, (_, n) => 1 + 0.7 * Math.log2(Math.max(1, n)));

const slots = [], freeSlots = [];
const world = { t: 0, orgs: [], born: [], live: new Set(), events: [], flags: {}, era: 0, eraT: [0] };

class Org {
  constructor(slot, morph, genes, ox, oy, E, gen) {
    this.slot = slot; this.id = ++world.orgSeq;
    this.morph = morph; this.genes = genes;
    this.ox = ox; this.oy = oy;                 // where the zygote landed
    this.sites = new Int32Array(morph.n).fill(-1);
    this.count = new Int16Array(NT);
    this.n = 0; this.E = E; this.age = 0; this.gen = gen;
    this.life = Math.round(TPS * (LIFE_BASE + LIFE_PER_CELL * morph.n) * rand(0.8, 1.2));
    this.heading = randi(8); this.acc = 0;
    this.income = 0; this.win = 0; this.prevWin = 0;
    this.grown = morph.n === 1; this.alive = true; this.dirty = false;
    this.kills = 0; this.kids = 0; this.cause = '';
    this.mode = 0; this.tx = 0; this.ty = 0;    // what its sensors locked onto
    this.lv = 7;                                // brightness the renderer last used
  }
}

// ---- setup -------------------------------------------------------------------------
function resetWorld(seeds = 90) {
  occ.fill(0); matter.fill(0); fx.fill(0); photoNow.fill(0); photoPrev.fill(0);
  for (let x = 0; x < W; x++) occ[site(x, 0)] = occ[site(x, H - 1)] = WALL;
  for (let y = 0; y < H; y++) occ[site(0, y)] = occ[site(W - 1, y)] = WALL;
  slots.length = 0; freeSlots.length = 0;
  morphs.clear(); morphSeq = 0;
  Object.assign(world, {
    t: 0, orgs: [], born: [], live: new Set(), events: [], flags: {}, era: 0, eraT: [0],
    orgSeq: 0, births: 0, deaths: 0, kills: 0, top: [], lead: null, leadT: -1e9,
    stats: { orgs: 0, cells: 0, multi: 0, diff: 0, motile: 0, preds: 0, complex: 0, maxN: 0,
      avg: 0, wavg: 0, species: 0, types: new Int32Array(NT) },
    hist: { every: TPS, next: 0, t: [], wavg: [], max: [] },
    suns: makeSuns(),
  });
  updateLight();
  for (let i = 0; i < 1800; i++) addMatter(randomFree(), rand(0.5, 3));
  const photo = getMorph([[0, 0, PHOTO]], 0, null), intake = getMorph([[0, 0, INTAKE]], 0, null);
  for (let i = 0; i < seeds; i++) {
    const s = randomFree();
    spawn(Math.random() < 0.7 ? photo : intake, randomGenes(), s & XM, s >> 8, 4, 0, null);
  }
  flushBorn();
  logEvent('era', `Era I · Primordial: ${seeds} protocells adrift in the soup`);
  census();
}

function makeSuns() {
  return Array.from({ length: 3 }, () => ({
    px: rand(240, 420), py: rand(200, 360), phx: rand(0, 7), phy: rand(0, 7),
    amp: rand(0.75, 0.95), r: rand(19, 28), x: 0, y: 0,
  }));
}

// The suns drift slowly, so sessile life has good and bad years and movers can follow.
function updateLight() {
  const secs = world.t / TPS, k = 0.4 + 1.2 * P.light;
  for (const s of world.suns) {
    s.x = W / 2 + (W / 2 - 34) * Math.sin((2 * Math.PI * secs) / s.px + s.phx);
    s.y = H / 2 + (H / 2 - 26) * Math.sin((2 * Math.PI * secs) / s.py + s.phy);
  }
  for (let by = 0; by < BH; by++) {
    for (let bx = 0; bx < BW; bx++) {
      const x = bx * BIN + 2, y = by * BIN + 2;
      let L = AMBIENT;
      for (const s of world.suns) {
        const dx = x - s.x, dy = y - s.y;
        L += s.amp * Math.exp(-(dx * dx + dy * dy) / (2 * s.r * s.r));
      }
      light[by * BW + bx] = Math.min(1, L) * k;
    }
  }
}

function addMatter(s, a) {
  if (s < 0) return;
  const v = matter[s] + a;
  matter[s] = v > MATTER_CAP ? MATTER_CAP : v;
}

function randomFree() {
  for (let k = 0; k < 2000; k++) {
    const s = site(1 + randi(W - 2), 1 + randi(H - 2));
    if (occ[s] === 0) return s;
  }
  return -1;
}

// ---- birth, cells and death ----------------------------------------------------------
function spawn(m, g, x, y, E, gen, parent) {
  const s = site(x, y);
  if (occ[s] !== 0) return null;
  const slot = freeSlots.length ? freeSlots.pop() : slots.length;
  const o = new Org(slot, m, g, x, y, E, gen);
  slots[slot] = o;
  placeCell(o, 0, s);
  fx[s] = 255; fxKind[s] = 0;
  world.born.push(o);
  if (m.alive++ === 0) world.live.add(m);
  m.total++;
  if (m.alive > m.peak) m.peak = m.alive;
  if (parent) parent.kids++;
  world.births++;
  return o;
}

function flushBorn() {
  for (const o of world.born) if (o.alive) world.orgs.push(o);
  world.born.length = 0;
}

function placeCell(o, i, s) {
  const t = o.morph.ts[i];
  occ[s] = o.slot + 1; ctype[s] = t; cidx[s] = i;
  o.sites[i] = s; o.n++; o.count[t]++;
}

function removeCell(o, i, frac) {
  const s = o.sites[i];
  if (s < 0) return;
  const t = o.morph.ts[i];
  occ[s] = 0; o.sites[i] = -1; o.n--; o.count[t]--;
  if (frac > 0) addMatter(s, COST[t] * frac);
  o.grown = false;
  if (o.n === 0) die(o, o.cause || 'eaten');
  else o.dirty = true;
}

function die(o, cause) {
  if (!o.alive) return;
  o.alive = false; o.cause = cause;
  const m = o.morph, spare = Math.max(0, o.E) / Math.max(1, o.n);
  for (let i = 0; i < m.n; i++) {
    const s = o.sites[i];
    if (s < 0) continue;
    occ[s] = 0; o.sites[i] = -1;
    addMatter(s, COST[m.ts[i]] * DEATH_MATTER + spare * 0.5);
    fx[s] = 150; fxKind[s] = 2;
  }
  o.n = 0;
  slots[o.slot] = null; freeSlots.push(o.slot);
  if (--m.alive === 0) extinct(m);
  world.deaths++;
}

function extinct(m) {
  world.live.delete(m);
  morphs.delete(m.sig);
  if (m.n > 1 && m.peak >= 150) logEvent('extinct', `${m.name} died out after peaking at ${m.peak}`, m);
}

function kin(a, b) {
  let d = Math.abs(a.genes.tag - b.genes.tag);
  if (d > 0.5) d = 1 - d;
  return d < KIN;
}

// After losing cells, keep the largest connected piece. Severed pieces wither.
const bfsStack = new Int32Array(MAX_BODY), label = new Int8Array(MAX_BODY);
function settle(o) {
  o.dirty = false;
  if (o.n < 2) return;
  const m = o.morph, me = o.slot + 1;
  label.fill(-1, 0, m.n);
  let comps = 0, best = 0, bestSize = 0;
  for (let i = 0; i < m.n; i++) {
    if (o.sites[i] < 0 || label[i] >= 0) continue;
    let size = 0, sp = 0;
    bfsStack[sp++] = i; label[i] = comps;
    while (sp) {
      const s = o.sites[bfsStack[--sp]];
      size++;
      for (let k = 0; k < 4; k++) {
        const q = NB4[s * 4 + k];
        if (occ[q] !== me || label[cidx[q]] >= 0) continue;
        label[cidx[q]] = comps; bfsStack[sp++] = cidx[q];
      }
    }
    if (size > bestSize) { bestSize = size; best = comps; }
    comps++;
  }
  if (comps < 2) return;
  for (let i = 0; i < m.n; i++) {
    const s = o.sites[i];
    if (s < 0 || label[i] === best) continue;
    fx[s] = 150; fxKind[s] = 2;
    removeCell(o, i, DEATH_MATTER);
  }
  o.dirty = false;
}

// ---- a tick of one organism's life --------------------------------------------------------
function live(o) {
  if (o.dirty) settle(o);
  const m = o.morph, g = o.genes, sites = o.sites;
  o.age++;
  let gain = 0;
  const w = REACH_UP[o.n];
  for (let i = 0; i < m.n; i++) {
    const s = sites[i];
    if (s < 0) continue;
    const t = m.ts[i];
    if (t === PHOTO) {
      const b = binOf(s), share = (w * BIN_CAP) / photoPrev[b];
      photoNow[b] += w;
      gain += PHOTO_GAIN * light[b] * (share < 1 ? share : 1);
    } else if (t === INTAKE) gain += absorb(s);
    else if (t === BLADE && Math.random() < BLADE_RATE) gain += strike(o, s);
  }
  let up = 0;
  for (let t = 0; t < NT; t++) up += o.count[t] * UPKEEP[t];
  o.income = gain;
  o.E += gain - up * SCALE[o.n];
  const cap = 10 + 1.5 * m.cost;
  if (o.E > cap) o.E = cap;
  if (o.E <= 0) return die(o, 'starved');
  if (o.age > o.life) return die(o, 'died of old age');
  if (!o.grown) {
    if ((world.t + o.slot) % GROW_EVERY === 0) grow(o);
  } else {
    const e0 = 1 + g.invest * m.cost;
    if (o.E >= e0 + 1 + 0.2 * cap) reproduce(o, e0);
  }
  move(o);
}

function absorb(s) {
  let got = 0, want = INTAKE_RATE;
  for (let k = -1; k < 4 && want > 0.001; k++) {
    const q = k < 0 ? s : NB4[s * 4 + k], a = matter[q];
    if (a <= 0) continue;
    const take = a < want ? a : want;
    matter[q] = a - take; got += take; want -= take;
  }
  return got * INTAKE_EFF;
}

function strike(o, s) {
  const me = o.slot + 1, k0 = randi(4);
  for (let j = 0; j < 4; j++) {
    const q = NB4[s * 4 + ((k0 + j) & 3)], sl = occ[q];
    if (sl <= 0 || sl === me) continue;
    const v = slots[sl - 1];
    if (kin(o, v)) continue;
    const t = ctype[q];
    if (t === SHELL && Math.random() < SHELL_BLOCK) return 0;
    if (v.n > o.n + 2 && Math.random() * v.n > o.n + 2) return 0; // big bodies are hard to cut into
    const share = v.E > 0 ? v.E / v.n : 0;
    v.E -= share;
    v.cause = 'eaten by ' + o.morph.name;
    if (!world.flags.kill) first('kill', `First kill: ${o.morph.name} cuts a ${TYPES[t].name.toLowerCase()} cell`, o.morph);
    fx[q] = 255; fxKind[q] = 1;
    removeCell(v, cidx[q], 0.25);
    o.kills++; world.kills++;
    // Intake cells digest what the blades cut. Without them the meal spills as matter,
    // so a lone blade cell cannot live by killing: predation needs a body.
    const meal = COST[t] * 0.5 + share * PREY_SHARE, I = o.count[INTAKE];
    const dig = I ? Math.min(1, (2 * I) / (I + o.count[BLADE])) : 0;
    if (dig < 1) addMatter(q, meal * (1 - dig));
    return meal * dig;
  }
  return 0;
}

function grow(o) {
  const m = o.morph, me = o.slot + 1;
  for (let i = 0; i < m.n; i++) {
    if (o.sites[i] >= 0) continue;
    const c = COST[m.ts[i]];
    if (o.E < c + 1) return;                      // wait for energy, keep the order
    const s = wrapSite(o.ox + m.xs[i], o.oy + m.ys[i]);
    if (occ[s] !== 0 && !shove(o, s)) continue;  // blocked: try a later cell
    let touch = false;
    for (let k = 0; k < 4; k++) if (occ[NB4[s * 4 + k]] === me) { touch = true; break; }
    if (!touch) continue;
    o.E -= c;
    placeCell(o, i, s);
    fx[s] = 200; fxKind[s] = 0;
    return;
  }
  o.grown = true;                                 // whole, or as whole as space allows
}

// A growing body can push a lone foreign cell out of its way, if there is room.
function shove(o, s) {
  const sl = occ[s];
  if (sl <= 0 || o.n < 2) return false;
  const v = slots[sl - 1];
  if (v.n !== 1 || kin(o, v)) return false;
  const k0 = randi(4);
  for (let j = 0; j < 4; j++) {
    const k = (k0 + j) & 3;
    if (occ[NB4[s * 4 + k]] === 0) return tryMove(v, N4X[k], N4Y[k]) === 0;
  }
  return false;
}

function reproduce(o, e0) {
  const s = spawnSite(o);
  if (s < 0) return;
  const rate = 2 * P.mutation;
  let m = o.morph;
  if (Math.random() < STRUCT_RATE * rate) m = mutatePlan(m) || m;
  o.E -= e0 + 1;
  if (o.n < o.morph.n) o.grown = false;           // look again for room to finish growing
  spawn(m, mutateGenes(o.genes, rate), s & XM, s >> 8, e0, o.gen + 1, o);
}

function spawnSite(o) {
  const d = Math.ceil(o.genes.disperse);
  for (let k = 0; k < 6; k++) {
    const s0 = o.sites[randi(o.morph.n)];
    if (s0 < 0) continue;
    const dir = randi(8), r = 1 + randi(d);
    const x = (s0 & XM) + DX[dir] * r, y = (s0 >> 8) + DY[dir] * r;
    if (x < 1 || x > W - 2 || y < 1 || y > H - 2) continue;
    const s = site(x, y);
    if (occ[s] !== 0) continue;
    if (o.morph.ts[0] === PHOTO && photoPrev[binOf(s)] > SHADE) continue; // seeds fail in deep shade
    return s;
  }
  return -1;
}

// ---- movement ---------------------------------------------------------------------------
function move(o) {
  const motors = o.count[MOTOR];
  if (!motors) {                                  // lone cells jiggle; bodies stay put
    if (o.n <= 2 && Math.random() < DRIFT / (o.n * o.n)) {
      const k = randi(4);
      tryMove(o, N4X[k], N4Y[k]);
    }
    return;
  }
  steer(o);
  const mass = o.n + o.count[SHELL];
  o.acc += VMAX * Math.min(1, (THRUST * motors) / mass);
  while (o.acc >= 1) {
    o.acc -= 1;
    const hit = tryMove(o, DX[o.heading], DY[o.heading]);
    if (hit === 0) { o.E -= MOVE_COST * mass; continue; }
    o.acc = 0;
    // pressed against prey: hold on and keep cutting; otherwise turn away
    if (!(hit > 0 && o.count[BLADE] && !kin(o, slots[hit - 1]))) o.heading = randi(8);
    break;
  }
}

// Run and tumble: keep going while income improves, turn when it falls.
function steer(o) {
  const me = o.slot + 1;
  o.win += o.income;
  if ((world.t + me) % 10 === 0) {
    const worse = o.win < o.prevWin;
    if (o.mode === 0 && Math.random() < (worse ? 0.5 : 0.05 + 0.25 * o.genes.tumble)) o.heading = randi(8);
    o.prevWin = o.win; o.win = 0;
  }
  if (o.count[SENSOR] && (world.t + me) % 6 === 0) sense(o);
}

// Sensors scan around the body for prey, matter, light and threats.
function sense(o) {
  const m = o.morph, g = o.genes, me = o.slot + 1;
  const R = Math.min(24, 6 + 4 * o.count[SENSOR]), R2 = R * R, stride = R > 12 ? 2 : 1;
  const cx = o.ox + m.cx, cy = o.oy + m.cy;
  const hunts = o.count[BLADE] > 0, eats = o.count[INTAKE] > 0;
  let best = 0, bx = 0, by = 0, mode = 0, ax = 0, ay = 0, fear = 0;
  for (let dy = -R; dy <= R; dy += stride) {
    const y = cy + dy;
    if (y < 1 || y > H - 2) continue;
    for (let dx = -R; dx <= R; dx += stride) {
      const d2 = dx * dx + dy * dy, x = cx + dx;
      if (d2 > R2 || x < 1 || x > W - 2) continue;
      const s = (y << 8) | x, sl = occ[s];
      if (sl > 0) {
        if (sl === me) continue;
        const v = slots[sl - 1];
        if (kin(o, v)) continue;
        if (v.count[BLADE] && v.n >= o.n) {
          const w = g.flee / (d2 + 1);
          ax -= dx * w; ay -= dy * w; fear += w;
        }
        if (hunts && ctype[s] !== SHELL) {
          const sc = (g.prey * 3) / (d2 + 4);
          if (sc > best) { best = sc; bx = dx; by = dy; mode = 2; }
        }
      } else if (eats && sl === 0 && matter[s] > 0.5) {
        const sc = (g.food * matter[s] * 0.5) / (d2 + 4);
        if (sc > best) { best = sc; bx = dx; by = dy; mode = 1; }
      }
    }
  }
  if (o.count[PHOTO] && g.light > 0.1) {
    const r = R >> 1, here = light[binOf(site(clamp(cx, 1, W - 2), clamp(cy, 1, H - 2)))];
    for (let d = 0; d < 8; d++) {
      const x = clamp(cx + DX[d] * r, 1, W - 2), y = clamp(cy + DY[d] * r, 1, H - 2);
      const sc = g.light * (light[binOf(site(x, y))] - here) * 0.4;
      if (sc > best) { best = sc; bx = DX[d] * r; by = DY[d] * r; mode = 4; }
    }
  }
  if (fear > 0.003 && fear * 3 > best) {
    o.heading = dirOf(ax, ay); o.mode = 3;
    o.tx = cx - ax / fear; o.ty = cy - ay / fear;
  } else if (best > 0) {
    o.heading = dirOf(bx, by); o.mode = mode;
    o.tx = cx + bx; o.ty = cy + by;
  } else o.mode = 0;
}

// Move the whole body one site. Returns 0, or what blocked it (WALL or slot + 1).
function tryMove(o, dx, dy) {
  const m = o.morph, sites = o.sites, me = o.slot + 1;
  for (let i = 0; i < m.n; i++) {
    const s = sites[i];
    if (s < 0) continue;
    const v = occ[wrapSite((s & XM) + dx, (s >> 8) + dy)];
    if (v !== 0 && v !== me) return v;
  }
  for (let i = 0; i < m.n; i++) if (sites[i] >= 0) occ[sites[i]] = 0;
  for (let i = 0; i < m.n; i++) {
    const s = sites[i];
    if (s < 0) continue;
    const q = wrapSite((s & XM) + dx, (s >> 8) + dy);
    occ[q] = me; ctype[q] = m.ts[i]; cidx[q] = i; sites[i] = q;
  }
  o.ox += dx; o.oy += dy;
  return 0;
}

// ---- the world tick ------------------------------------------------------------------------
function step() {
  const t = ++world.t;
  if (t % 30 === 1) updateLight();
  photoPrev.set(photoNow); photoNow.fill(0);
  const orgs = world.orgs;
  for (let i = orgs.length - 1; i > 0; i--) {     // fair turn order
    const j = randi(i + 1), tmp = orgs[i];
    orgs[i] = orgs[j]; orgs[j] = tmp;
  }
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) live(orgs[i]);
  let k = 0;
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) orgs[k++] = orgs[i];
  orgs.length = k;
  flushBorn();
  rain();
  if (t % 15 === 0) census();
}

// Loose matter: a steady fall of abiotic grains, plus whatever the dead leave. It decays.
function rain() {
  for (let n = SNOW * 2 * P.matter; n > 0; n--) {
    if (n < 1 && Math.random() > n) break;
    const s = site(1 + randi(W - 2), 1 + randi(H - 2));
    if (occ[s] === 0) addMatter(s, 0.4);
  }
  if (world.t % 30 === 0) {
    for (let s = 0; s < N; s++) {
      const v = matter[s];
      if (v) matter[s] = v < 0.02 ? 0 : v * 0.985;
    }
  }
}

// ---- census, eras and the record ---------------------------------------------------------
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
const ERAS = [
  ['Primordial', 'lone protocells'],
  ['Colonial', 'cells stay together after dividing'],
  ['Differentiated', 'bodies built from specialised cells'],
  ['Motile', 'multicellular bodies that move'],
  ['Predatory', 'multicellular hunters'],
  ['Complex', 'large bodies of three or more cell types'],
];

function census() {
  const st = world.stats, F = world.flags, types = st.types;
  types.fill(0);
  let orgs = 0, cells = 0, sq = 0, multi = 0, diff = 0, motile = 0, preds = 0, complex = 0;
  let maxN = 0, big = null;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const n = o.n, m = o.morph;
    orgs++; cells += n; sq += n * n;
    for (let t = 0; t < NT; t++) types[t] += o.count[t];
    if (n > maxN) { maxN = n; big = o; }
    if (n < 2) continue;
    multi++;
    let kinds = 0;
    for (let t = 0; t < NT; t++) if (o.count[t]) kinds++;
    const est = m.alive >= 5; // milestones wait until a form is established
    if (est && !F.multi) first('multi', `First multicellular organism: ${m.name}`, m);
    if (kinds >= 2 && n >= 3) {
      diff++;
      if (est && !F.diff) first('diff', `First differentiated body: ${m.name}, ${typeList(o)}`, m);
    }
    if (o.count[MOTOR]) { motile++; if (est && !F.motile) first('motile', `A multicellular body moves: ${m.name}`, m); }
    if (o.count[BLADE]) { preds++; if (est && !F.pred) first('pred', `First multicellular predator: ${m.name}`, m); }
    if (est && o.count[SHELL] && !F.shell) first('shell', `Armour evolves: ${m.name}`, m);
    if (est && o.count[SENSOR] && !F.sensor) first('sensor', `Sight evolves: ${m.name}`, m);
    if (est && m.sym && n >= 6 && !F['sym' + m.sym]) first('sym' + m.sym, `First ${SYM_NAMES[m.sym]} body plan: ${m.name}`, m);
    if (kinds >= 3 && n >= 12) {
      complex++;
      if (est && !F.complex) first('complex', `Complex life: ${m.name}, ${n} cells of ${kinds} types`, m);
    }
  }
  for (const k of [5, 10, 20, 40]) {
    if (maxN >= k && !F['size' + k]) first('size' + k, `First ${k}-cell organism: ${big.morph.name}`, big.morph);
  }
  Object.assign(st, {
    orgs, cells, multi, diff, motile, preds, complex, maxN,
    avg: orgs ? cells / orgs : 0, wavg: cells ? sq / cells : 0, species: world.live.size,
  });
  const ok = [true, multi >= 12, diff >= 12, motile >= 8, preds >= 5, complex >= 3];
  // eras advance in order, at least 30 seconds apart
  if (world.era < 5 && ok[world.era + 1] && world.t - world.eraT[world.era] > 30 * TPS) {
    const e = ++world.era;
    world.eraT.push(world.t);
    logEvent('era', `Era ${ROMAN[e]} · ${ERAS[e][0]}: ${ERAS[e][1]}`);
  }
  rankSpecies();
  sampleHistory();
  if (!orgs && !F.dead) {
    F.dead = world.t;
    logEvent('extinct', 'All life is extinct. Seed the dish or start a new world.');
  } else if (orgs && F.dead) F.dead = 0;
}

function rankSpecies() {
  const list = [...world.live];
  for (const m of list) m.mass = m.alive * m.n;
  list.sort((a, b) => b.mass - a.mass);
  world.top = list.slice(0, 8);
  const lead = list[0];
  if (lead && lead.n > 1 && lead !== world.lead && world.t - world.leadT > 60 * TPS) {
    world.lead = lead; world.leadT = world.t;
    logEvent('lead', `New dominant form: ${lead.name}, ${lead.alive} organisms`, lead);
  }
}

function sampleHistory() {
  const h = world.hist;
  if (world.t < h.next) return;
  h.next = world.t + h.every;
  h.t.push(world.t); h.wavg.push(world.stats.wavg); h.max.push(world.stats.maxN);
  if (h.t.length >= 480) {                        // halve the resolution, keep everything
    for (const k of ['t', 'wavg', 'max']) h[k] = h[k].filter((_, i) => i % 2 === 0);
    h.every *= 2;
  }
}

function logEvent(kind, text, morph) {
  world.events.unshift({ t: world.t, kind, text, morph: morph || null });
  if (world.events.length > 80) world.events.length = 80;
}
function first(key, text, morph) {
  world.flags[key] = world.t;
  logEvent('first', text, morph);
}
function typeList(o) {
  return TYPES.filter((_, t) => o.count[t]).map((T) => T.name.toLowerCase()).join(' + ');
}

// ---- tools --------------------------------------------------------------------------------
function inDisk(x, y, r, fn) {
  const cx = Math.floor(x), cy = Math.floor(y), r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const sx = cx + dx, sy = cy + dy, d2 = dx * dx + dy * dy;
      if (d2 > r2 || sx < 1 || sx > W - 2 || sy < 1 || sy > H - 2) continue;
      fn(site(sx, sy), d2 / (r2 + 1));
    }
  }
}

function feedAt(x, y, r, amount) {
  inDisk(x, y, r, (s, f) => { if (Math.random() < 0.35) addMatter(s, amount * (1 - f)); });
}

function zapAt(x, y, r) {
  inDisk(x, y, r, (s) => {
    const sl = occ[s];
    if (sl <= 0) return;
    const v = slots[sl - 1];
    v.cause = 'vaporised';
    fx[s] = 255; fxKind[s] = 3;
    removeCell(v, cidx[s], 0.3);
  });
}

function seedAt(x, y, n) {
  const photo = getMorph([[0, 0, PHOTO]], 0, null), intake = getMorph([[0, 0, INTAKE]], 0, null);
  for (let k = 0; k < n * 4 && n > 0; k++) {
    const sx = Math.floor(x + rand(-5, 5)), sy = Math.floor(y + rand(-5, 5));
    if (sx < 1 || sx > W - 2 || sy < 1 || sy > H - 2) continue;
    if (spawn(Math.random() < 0.65 ? photo : intake, randomGenes(), sx, sy, 4, 0, null)) n--;
  }
  for (const m of [photo, intake]) if (!m.alive) morphs.delete(m.sig);
}

function pickOrg(x, y) {
  const cx = Math.floor(x), cy = Math.floor(y);
  let best = null, bd = 9;
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const sx = cx + dx, sy = cy + dy, d2 = dx * dx + dy * dy;
      if (sx < 0 || sx >= W || sy < 0 || sy >= H || d2 >= bd) continue;
      const sl = occ[site(sx, sy)];
      if (sl > 0) { bd = d2; best = slots[sl - 1]; }
    }
  }
  return best;
}

// Emergence: canvas renderer.
// Cells go into a texture at SUB texels per site: a 3x3 body plus a one-texel seam that is
// filled only between cells of the same organism, so each organism reads as one connected
// glyph and neighbours stay distinct. A two-level bloom adds the glow.

const SUB = 4, TW = W * SUB, TH = H * SUB;
const BG = '#05070b', FLOOR = '#070a11', ACCENT = '#5cf2b6';
const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace';
const view = {
  zoom: 1, cx: W / 2, cy: H / 2, cw: 1, ch: 1, dpr: 1,
  glow: true, haze: true, selected: null, follow: false, highlight: null,
  hover: null, pointer: null, tool: 'inspect', brush: 6,
};
let cv, ctx, tex, tctx, timg, t32, bloomA, bctxA, bloomB, bctxB, hazeCv, hctx, himg;

const pack = (r, g, b, a) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
const c8 = (v) => Math.max(0, Math.min(255, Math.round(v)));
const PAL = new Uint32Array(NT * 8 * 4); // [type][brightness][flash]
const SEAM = new Uint32Array(NT * 8);
const FLASH = new Uint32Array(4 * 16);   // [birth, cut, death, zap][level]
const DUST = new Uint32Array(8);

function buildPalette() {
  for (let t = 0; t < NT; t++) {
    const [r, g, b] = TYPES[t].rgb;
    for (let L = 0; L < 8; L++) {
      const f = 0.62 + 0.38 * (L / 7);
      for (let F = 0; F < 4; F++) {
        const m = (F / 3) * 0.8, k = f * (1 - m), w = 255 * m;
        PAL[(t * 8 + L) * 4 + F] = pack(c8(r * k + w), c8(g * k + w), c8(b * k + w), 255);
      }
      SEAM[t * 8 + L] = pack(c8(r * f * 0.5), c8(g * f * 0.5), c8(b * f * 0.5), 255);
    }
  }
  const kinds = [[255, 255, 255], [255, 90, 120], [150, 165, 190], [205, 195, 255]];
  for (let k = 0; k < 4; k++) {
    for (let l = 0; l < 16; l++) FLASH[k * 16 + l] = pack(...kinds[k], c8((l / 15) * 230));
  }
  for (let l = 0; l < 8; l++) DUST[l] = pack(255, 186, 140, c8(16 + l * 11));
}

function initRender(canvas) {
  cv = canvas;
  ctx = cv.getContext('2d');
  const make = (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return [c, c.getContext('2d')];
  };
  [tex, tctx] = make(TW, TH);
  timg = tctx.createImageData(TW, TH);
  t32 = new Uint32Array(timg.data.buffer);
  [bloomA, bctxA] = make(W * 2, H * 2); // halo about half a site wide
  [bloomB, bctxB] = make(W, H);         // and about a site wide
  [hazeCv, hctx] = make(BW, BH);
  himg = hctx.createImageData(BW, BH);
  buildPalette();
}

// ---- view geometry -------------------------------------------------------------------
const viewScale = () => Math.min(view.cw / W, view.ch / H) * 0.94 * view.zoom; // css px per site
function screenToWorld(px, py) {
  const sc = viewScale();
  return { x: view.cx + (px - view.cw / 2) / sc, y: view.cy + (py - view.ch / 2) / sc };
}
function clampView() {
  const sc = viewScale(), hw = view.cw / 2 / sc, hh = view.ch / 2 / sc;
  view.cx = hw * 2 >= W ? W / 2 : clamp(view.cx, hw, W - hw);
  view.cy = hh * 2 >= H ? H / 2 : clamp(view.cy, hh, H - hh);
}
function resizeView(w, h) {
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.cw = Math.max(1, w); view.ch = Math.max(1, h);
  cv.width = Math.round(view.cw * view.dpr);
  cv.height = Math.round(view.ch * view.dpr);
  clampView();
}
function bounds(o) {
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (const s of o.sites) {
    if (s < 0) continue;
    const x = s & XM, y = s >> 8;
    if (x < x0) x0 = x;
    if (x > x1) x1 = x;
    if (y < y0) y0 = y;
    if (y > y1) y1 = y;
  }
  return { x0, y0, x1, y1, cx: (x0 + x1 + 1) / 2, cy: (y0 + y1 + 1) / 2 };
}

// ---- textures ----------------------------------------------------------------------------
function paintTexture() {
  for (const o of world.orgs) {
    const half = 5 + 0.75 * o.morph.cost; // half the energy cap
    o.lv = Math.max(0, Math.min(7, Math.round((o.E / half) * 7)));
  }
  t32.fill(0);
  const T2 = TW * 2, T3 = TW * 3;
  for (let y = 1; y < H - 1; y++) {
    const row = y << 8;
    for (let x = 1; x < W - 1; x++) {
      const s = row | x, sl = occ[s], b = y * SUB * TW + x * SUB;
      let f = fx[s];
      if (f) fx[s] = f = f > 12 ? f - 12 : 0;
      if (sl > 0) {
        const t = ctype[s], lv = slots[sl - 1].lv, c = PAL[(t * 8 + lv) * 4 + (f >> 6)];
        t32[b] = t32[b + 1] = t32[b + 2] = c;
        t32[b + TW] = t32[b + TW + 1] = t32[b + TW + 2] = c;
        t32[b + T2] = t32[b + T2 + 1] = t32[b + T2 + 2] = c;
        const r = occ[s + 1] === sl, d = occ[s + W] === sl;
        if (r || d) {
          const sc = SEAM[t * 8 + lv];
          if (r) t32[b + 3] = t32[b + TW + 3] = t32[b + T2 + 3] = sc;
          if (d) t32[b + T3] = t32[b + T3 + 1] = t32[b + T3 + 2] = sc;
          if (r && d && occ[s + W + 1] === sl) t32[b + T3 + 3] = sc;
        }
      } else if (f) {
        const c = FLASH[fxKind[s] * 16 + (f >> 4)];
        t32[b + TW + 1] = t32[b + TW + 2] = t32[b + T2 + 1] = t32[b + T2 + 2] = c;
      } else {
        const a = matter[s];
        if (a > 0.15) {
          const c = DUST[a >= 7 ? 7 : a | 0];
          t32[b + TW + 1] = c;
          if (a > 1.5) t32[b + T2 + 2] = c;
        }
      }
    }
  }
  tctx.putImageData(timg, 0, 0);
}

function paintBloom() {
  bctxA.clearRect(0, 0, W * 2, H * 2);
  bctxA.drawImage(tex, 0, 0, W * 2, H * 2);
  bctxB.clearRect(0, 0, W, H);
  bctxB.drawImage(bloomA, 0, 0, W, H);
}

function paintHaze() {
  const d = himg.data;
  for (let b = 0; b < NB; b++) {
    const v = Math.min(1, light[b] / 1.1);
    d[b * 4] = 50; d[b * 4 + 1] = 160; d[b * 4 + 2] = 190;
    d[b * 4 + 3] = Math.round(v * v * 64);
  }
  hctx.putImageData(himg, 0, 0);
}

// ---- frame -------------------------------------------------------------------------------------
function render() {
  const d = view.dpr, sc = viewScale() * d;
  const ox = cv.width / 2 - view.cx * sc, oy = cv.height / 2 - view.cy * sc, ww = W * sc, wh = H * sc;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(ox, oy, ww, wh);
  if (view.haze) {
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(hazeCv, ox, oy, ww, wh);
  }
  drawGrid(ox, oy, sc);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tex, ox, oy, ww, wh);
  if (view.glow) {
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'lighter';
    const k = 1 / Math.sqrt(view.zoom);    // the halo stays subtle when zoomed in
    ctx.globalAlpha = 0.34 * k;
    ctx.drawImage(bloomA, ox, oy, ww, wh);
    ctx.globalAlpha = 0.42 * k;
    ctx.drawImage(bloomB, ox, oy, ww, wh);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  drawFrame(ox, oy, ww, wh);
  drawOverlay(ox, oy, sc);
}

function drawGrid(ox, oy, sc) {
  const d = view.dpr;
  ctx.strokeStyle = 'rgba(140, 170, 215, 0.055)';
  ctx.lineWidth = d;
  ctx.beginPath();
  for (let x = 16; x < W; x += 16) {
    const px = Math.round(ox + x * sc) + 0.5;
    ctx.moveTo(px, oy); ctx.lineTo(px, oy + H * sc);
  }
  for (let y = 16; y < H; y += 16) {
    const py = Math.round(oy + y * sc) + 0.5;
    ctx.moveTo(ox, py); ctx.lineTo(ox + W * sc, py);
  }
  ctx.stroke();
}

function bracket(x0, y0, x1, y1, L) {
  ctx.beginPath();
  ctx.moveTo(x0, y0 + L); ctx.lineTo(x0, y0); ctx.lineTo(x0 + L, y0);
  ctx.moveTo(x1 - L, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + L);
  ctx.moveTo(x1, y1 - L); ctx.lineTo(x1, y1); ctx.lineTo(x1 - L, y1);
  ctx.moveTo(x0 + L, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - L);
  ctx.stroke();
}

function drawFrame(ox, oy, ww, wh) {
  const d = view.dpr;
  ctx.lineWidth = d;
  ctx.strokeStyle = 'rgba(150, 180, 220, 0.16)';
  ctx.strokeRect(ox + 0.5, oy + 0.5, ww - 1, wh - 1);
  ctx.strokeStyle = 'rgba(215, 228, 255, 0.6)';
  bracket(ox - 4 * d, oy - 4 * d, ox + ww + 4 * d, oy + wh + 4 * d, 14 * d);
  ctx.font = `${9 * d}px ${MONO}`;
  ctx.fillStyle = 'rgba(150, 170, 200, 0.55)';
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'right';
  ctx.fillText(`${W} × ${H}`, ox + ww, oy - 8 * d);
  ctx.textAlign = 'left';
}

const MODE_COLOR = ['', '#ffc45c', '#ff526e', '#eef3ff', '#5cf2b6'];
function drawOverlay(ox, oy, sc) {
  const d = view.dpr, X = (x) => ox + x * sc, Y = (y) => oy + y * sc;
  const hl = view.highlight;
  if (hl && hl.alive > 0) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = d;
    let k = 0;
    for (const o of world.orgs) {
      if (o.morph !== hl || !o.alive) continue;
      const b = bounds(o);
      bracket(X(b.x0) - 2 * d, Y(b.y0) - 2 * d, X(b.x1 + 1) + 2 * d, Y(b.y1 + 1) + 2 * d, 3 * d);
      if (++k >= 400) break;
    }
  }
  const o = view.selected;
  if (o && o.alive) {
    const b = bounds(o), pad = 3 * d;
    const x0 = X(b.x0) - pad, y0 = Y(b.y0) - pad, x1 = X(b.x1 + 1) + pad, y1 = Y(b.y1 + 1) + pad;
    const cx = X(b.cx), cy = Y(b.cy);
    if (o.count[SENSOR]) {
      ctx.setLineDash([3 * d, 5 * d]);
      ctx.strokeStyle = 'rgba(236, 242, 255, 0.28)';
      ctx.lineWidth = d;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(24, 6 + 4 * o.count[SENSOR]) * sc, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (o.mode) {
      ctx.strokeStyle = MODE_COLOR[o.mode];
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = d;
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(X(o.tx + 0.5), Y(o.ty + 0.5));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 1.5 * d;
    bracket(x0, y0, x1, y1, Math.max(3 * d, Math.min(10 * d, (x1 - x0) / 3)));
    drawTag(o.morph.name.toUpperCase(), x0, y0 - 6 * d, ACCENT);
  }
  const h = view.hover;
  if (h && h.alive && h !== o && view.tool === 'inspect') {
    const b = bounds(h);
    ctx.strokeStyle = 'rgba(230, 237, 247, 0.6)';
    ctx.lineWidth = d;
    bracket(X(b.x0) - 2 * d, Y(b.y0) - 2 * d, X(b.x1 + 1) + 2 * d, Y(b.y1 + 1) + 2 * d, 4 * d);
    drawTag(`${h.morph.name} · ${h.n}`, X(b.x0) - 2 * d, Y(b.y0) - 6 * d, 'rgba(230, 237, 247, 0.8)');
  }
  const p = view.pointer;
  if (p && view.tool !== 'inspect') {
    const r = (view.tool === 'zap' ? 3 : view.tool === 'seed' ? 5 : view.brush) * sc;
    ctx.strokeStyle = view.tool === 'zap' ? 'rgba(205, 195, 255, 0.8)' : 'rgba(230, 237, 247, 0.45)';
    ctx.lineWidth = d;
    ctx.beginPath();
    ctx.arc(X(p.x), Y(p.y), r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawTag(text, x, y, color) {
  const d = view.dpr;
  ctx.font = `${10 * d}px ${MONO}`;
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(5, 7, 11, 0.7)';
  ctx.fillRect(x - 2 * d, y - 12 * d, ctx.measureText(text).width + 4 * d, 13 * d);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// A small picture of a form's full body, for the HUD. Cached on the form.
function glyph(m, size) {
  const key = 'g' + size;
  if (m[key]) return m[key];
  const d = Math.max(1, view.dpr), c = document.createElement('canvas');
  c.width = c.height = Math.round(size * d);
  const g = c.getContext('2d'), span = 2 * m.reach + 1;
  const cell = Math.max(1, Math.floor((c.width * 0.86) / Math.max(span, 4)));
  const off = Math.floor((c.width - cell * span) / 2), gap = cell >= 5 ? Math.max(1, Math.round(cell / 6)) : 0;
  g.shadowBlur = cell * 0.9;
  for (let i = 0; i < m.n; i++) {
    const [r, gg, b] = TYPES[m.ts[i]].rgb;
    g.fillStyle = g.shadowColor = `rgb(${r},${gg},${b})`;
    g.fillRect(off + (m.xs[i] + m.reach) * cell, off + (m.ys[i] + m.reach) * cell, cell - gap, cell - gap);
  }
  m[key] = c;
  return c;
}

// Emergence: controls, HUD and the main loop.

const SPEEDS = [0.5, 1, 2, 4, 8, 16];
const TOOL_KEYS = ['inspect', 'feed', 'zap', 'seed'];
const TOOL_HINTS = {
  inspect: 'Click an organism to inspect it · drag to pan · scroll to zoom · H hides the HUD',
  feed: 'Drag to scatter loose matter for intake cells',
  zap: 'Drag to vaporise cells · a body cut in two keeps its larger piece',
  seed: 'Click to release a cluster of fresh protocells',
};
const $ = (id) => document.getElementById(id);
const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let running = true, speed = 1, acc = 0, last = 0, hudWait = 0, hintWait = 0;
let dirty = true, hazeTick = -1, pointer = null, logKey = '';

function clockText(secs) {
  const s = Math.floor(secs), h = Math.floor(s / 3600);
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function roleOf(m) {
  const c = m.count, p = c[PHOTO] > 0, i = c[INTAKE] > 0, b = c[BLADE] > 0;
  let r = b && i ? 'Predator' : p && i ? 'Mixotroph' : p ? 'Phototroph' : i ? 'Scavenger' : 'Drifter';
  const mods = [];
  if (c[MOTOR]) mods.push('motile');
  if (c[SENSOR]) mods.push('sighted');
  if (c[SHELL]) mods.push('armoured');
  if (b && !i) mods.push('spined');
  return mods.length ? `${r} · ${mods.join(', ')}` : r;
}

function statusOf(o) {
  if (!o.alive) return 'Dead · ' + o.cause;
  if (!o.grown && o.n < o.morph.n) return 'Growing';
  return ['', 'Foraging', 'Hunting', 'Fleeing', 'Seeking light'][o.mode] ||
    (o.count[MOTOR] ? 'Roaming' : o.n === 1 ? 'Drifting' : 'Rooted');
}

// ---- controls ---------------------------------------------------------------------------
function setRunning(on) {
  running = on;
  const b = $('play');
  b.textContent = on ? 'Pause' : 'Play';
  b.title = `${on ? 'Pause' : 'Play'} (Space)`;
  b.classList.toggle('on', !on);
}
function setSpeed(i) {
  speed = clamp(i, 0, SPEEDS.length - 1);
  document.querySelectorAll('[data-speed]').forEach((b) => b.classList.toggle('on', +b.dataset.speed === speed));
}
function setTool(name) {
  view.tool = name;
  document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === name));
  $('view').style.cursor = name === 'inspect' ? 'default' : 'crosshair';
  showHint(TOOL_HINTS[name]);
}
function showHint(text) {
  $('hint').textContent = text;
  $('hint').classList.add('show');
  hintWait = 7;
}
function toggle(key) {
  view[key] = !view[key];
  $(key === 'glow' ? 't-glow' : 't-haze').classList.toggle('on', view[key]);
  dirty = true;
}
function fitView() {
  view.zoom = 1; view.cx = W / 2; view.cy = H / 2;
  clampView();
}
function newWorld() {
  resetWorld();
  select(null);
  view.highlight = null; hazeTick = -1; logKey = ''; dirty = true;
  updateHud();
}
function select(o) {
  view.selected = o;
  if (!o) { view.follow = false; $('i-follow').checked = false; }
  updateInspector();
}

function bindControls() {
  document.querySelectorAll('[data-speed]').forEach((b) => (b.onclick = () => setSpeed(+b.dataset.speed)));
  document.querySelectorAll('[data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
  $('play').onclick = () => setRunning(!running);
  $('new').onclick = newWorld;
  $('t-glow').onclick = () => toggle('glow');
  $('t-haze').onclick = () => toggle('haze');
  $('i-close').onclick = () => select(null);
  $('i-follow').onchange = (e) => {
    view.follow = e.target.checked;
    if (view.follow && view.zoom < 3) view.zoom = 4;
  };
  $('p-light').oninput = (e) => { P.light = e.target.value / 100; updateLight(); hazeTick = -1; };
  $('p-mut').oninput = (e) => { P.mutation = e.target.value / 100; };
  // Buttons drop focus after a click, so Space and the shortcuts keep working.
  document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });
  $('legend').innerHTML = TYPES.map((T, t) =>
    `<li title="${T.name}: ${T.role}"><i style="background:rgb(${T.rgb});box-shadow:0 0 5px rgb(${T.rgb})"></i>${T.name}<b id="lg-${t}">0</b></li>`).join('');
  $('comp').innerHTML = TYPES.map((T) => `<i style="background:rgb(${T.rgb})"></i>`).join('');
  $('i-genes').innerHTML = GENES.map(([k, name]) => `<div class="gene"><span>${name}</span><u><i data-gene="${k}"></i></u></div>`).join('');
  const ol = $('species');
  for (let i = 0; i < 6; i++) {
    const li = document.createElement('li');
    li.innerHTML = '<canvas width="56" height="56"></canvas><div class="f-txt"><b></b><span></span></div><em></em>';
    li.title = 'Highlight this form in the world';
    li.onclick = () => {
      if (!li.m) return;
      view.highlight = view.highlight === li.m ? null : li.m;
      updateForms();
    };
    ol.appendChild(li);
  }
}

function bindKeys() {
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.type === 'range' && e.key.startsWith('Arrow')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === ' ') setRunning(!running);
    else if (k >= '1' && k <= '4') setTool(TOOL_KEYS[+k - 1]);
    else if (k === 'r') newWorld();
    else if (k === 'f') fitView();
    else if (k === 'g') toggle('glow');
    else if (k === 'l') toggle('haze');
    else if (k === 'h') document.body.classList.toggle('bare');
    else if (k === '+' || k === '=' || k === ']') setSpeed(speed + 1);
    else if (k === '-' || k === '_' || k === '[') setSpeed(speed - 1);
    else if (k === '.' && !running) { step(); dirty = true; }
    else if (k === 'Escape') { select(null); view.highlight = null; }
    else return;
    e.preventDefault();
  });
}

// ---- pointer ------------------------------------------------------------------------------
function bindPointer() {
  const el = $('view');
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    const pan = { mode: 'pan', x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: 0, clear: false };
    if (e.button !== 0 || e.shiftKey) pointer = pan;
    else if (view.tool === 'inspect') {
      const o = pickOrg(w.x, w.y);
      if (o) { select(o); pointer = null; } else pointer = Object.assign(pan, { clear: true });
    } else {
      pointer = { mode: 'tool', wait: 0 };
      useTool(w, 0, true);
    }
  });
  el.addEventListener('pointermove', (e) => {
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    if (pointer && pointer.mode === 'pan') {
      const sc = viewScale();
      pointer.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      view.cx = pointer.cx - (e.clientX - pointer.x) / sc;
      view.cy = pointer.cy - (e.clientY - pointer.y) / sc;
      clampView();
      if (pointer.moved > 4) view.follow = $('i-follow').checked = false;
    } else if (!pointer && view.tool === 'inspect') view.hover = pickOrg(w.x, w.y);
  });
  const end = () => {
    if (pointer && pointer.mode === 'pan' && pointer.clear && pointer.moved <= 4) select(null);
    pointer = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (!pointer) view.pointer = view.hover = null; });
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const before = screenToWorld(e.offsetX, e.offsetY);
    view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0015), 1, 16);
    const after = screenToWorld(e.offsetX, e.offsetY);
    view.cx += before.x - after.x;
    view.cy += before.y - after.y;
    clampView();
  }, { passive: false });
}

function useTool(w, dt, first) {
  if (view.tool === 'feed') feedAt(w.x, w.y, view.brush, first ? 3 : 14 * dt);
  else if (view.tool === 'zap') zapAt(w.x, w.y, 3);
  else if (view.tool === 'seed' && (first || (pointer.wait += dt) > 0.3)) {
    pointer.wait = 0;
    seedAt(w.x, w.y, 10);
  }
  dirty = true;
}

// ---- HUD ------------------------------------------------------------------------------------
function setText(id, v) {
  const el = $(id);
  if (el.textContent !== v) el.textContent = v;
}

function updateHud() {
  const st = world.stats, e = world.era;
  setText('era-num', 'Era ' + ROMAN[e]);
  setText('era-name', ERAS[e][0]);
  setText('era-desc', ERAS[e][1]);
  document.querySelectorAll('#era-track i').forEach((el, i) => el.classList.toggle('on', i <= e));
  setText('clock', 'T+' + clockText(world.t / TPS));
  setText('s-orgs', fmtInt(st.orgs));
  setText('s-cells', fmtInt(st.cells));
  setText('s-multi', fmtInt(st.multi));
  setText('s-species', fmtInt(st.species));
  setText('s-max', String(st.maxN));
  setText('s-mean', st.wavg.toFixed(1));
  const bars = $('comp').children, total = Math.max(1, st.cells);
  for (let t = 0; t < NT; t++) {
    bars[t].style.width = ((100 * st.types[t]) / total).toFixed(2) + '%';
    setText('lg-' + t, fmtInt(st.types[t]));
  }
  updateForms();
  updateInspector();
  updateLog();
  drawChart();
}

function updateForms() {
  const top = world.top.slice(0, 6);
  $('species').querySelectorAll('li').forEach((li, i) => {
    const m = top[i];
    li.hidden = !m;
    if (!m) { li.m = null; return; }
    if (li.m !== m) {
      li.m = m;
      const c = li.querySelector('canvas'), g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.drawImage(glyph(m, 28), 0, 0, c.width, c.height);
      li.querySelector('b').textContent = m.name;
      li.querySelector('span').textContent = `${m.n} ${m.n === 1 ? 'cell' : 'cells'} · ${roleOf(m)}`;
    }
    li.querySelector('em').textContent = '×' + fmtInt(m.alive);
    li.classList.toggle('on', view.highlight === m);
  });
}

function updateInspector() {
  const o = view.selected, card = $('inspector');
  card.hidden = !o;
  $('right').classList.toggle('inspecting', !!o);
  if (!o) return;
  const m = o.morph;
  if (card.o !== o) {
    card.o = o;
    const c = $('i-glyph'), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(glyph(m, 48), 0, 0, c.width, c.height);
    $('i-name').textContent = m.name;
    $('i-role').textContent = roleOf(m);
    document.querySelectorAll('[data-gene]').forEach((el) => {
      const k = el.dataset.gene, v = k === 'disperse' ? (o.genes[k] - 1) / 9 : o.genes[k];
      el.style.width = (v * 100).toFixed(0) + '%';
    });
  }
  const status = $('i-status');
  status.textContent = statusOf(o);
  status.style.color = o.alive ? MODE_COLOR[o.mode] || 'var(--ink)' : 'var(--coral)';
  $('i-energy').style.width = (o.alive ? clamp(o.E / (10 + 1.5 * m.cost), 0, 1) * 100 : 0) + '%';
  const rows = [
    ['Cells', `${o.n} / ${m.n}`], ['Body plan', SYM_NAMES[m.sym]], ['Generation', o.gen],
    ['Age', clockText(o.age / TPS)], ['Offspring', o.kids], ['Kills', o.kills],
    ['Of its form', fmtInt(m.alive)], ['Descends from', m.parent || 'the soup'],
  ];
  const html = rows.map(([k, v]) => `<div><dt>${k}</dt><dd title="${esc(v)}">${esc(v)}</dd></div>`).join('');
  const dl = $('i-stats');
  if (dl.html !== html) { dl.html = html; dl.innerHTML = html; }
}

function updateLog() {
  const items = world.events.slice(0, 6);
  const key = items.map((e) => e.t + e.text).join('|');
  if (key === logKey) return;
  logKey = key;
  $('log').innerHTML = items.map((e) =>
    `<li class="k-${e.kind}"><time>${clockText(e.t / TPS)}</time><span>${esc(e.text)}</span></li>`).join('');
}

// Body size over the whole run, on a log scale, with era marks.
function drawChart() {
  const c = $('chart'), d = view.dpr, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);
  const hs = world.hist, n = hs.t.length, t1 = Math.max(world.t, 60 * TPS);
  const X = (t) => (t / t1) * (w - 1), Y = (v) => h - 1 - (Math.log2(Math.max(1, v)) / 6) * (h - 6);
  g.font = `9px ${MONO}`;
  g.textAlign = 'right';
  g.lineWidth = 1;
  for (const v of [4, 16, 64]) {
    const y = Math.round(Y(v)) + 0.5;
    g.strokeStyle = 'rgba(150, 180, 220, 0.09)';
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.fillStyle = 'rgba(150, 170, 200, 0.5)';
    g.fillText(String(v), w - 2, y - 3);
  }
  g.textAlign = 'left';
  for (let i = 1; i < world.eraT.length; i++) {
    const x = Math.round(X(world.eraT[i])) + 0.5;
    g.strokeStyle = 'rgba(92, 242, 182, 0.28)';
    g.beginPath(); g.moveTo(x, 10); g.lineTo(x, h); g.stroke();
    g.fillStyle = 'rgba(92, 242, 182, 0.75)';
    g.fillText(ROMAN[i], x + 2, 7);
  }
  if (n < 2) return;
  g.beginPath();
  g.moveTo(X(hs.t[0]), h);
  for (let i = 0; i < n; i++) g.lineTo(X(hs.t[i]), Y(hs.wavg[i]));
  g.lineTo(X(hs.t[n - 1]), h);
  g.closePath();
  g.fillStyle = 'rgba(230, 237, 247, 0.1)';
  g.fill();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.wavg[i]));
  g.strokeStyle = 'rgba(230, 237, 247, 0.6)';
  g.stroke();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.max[i]));
  g.strokeStyle = ACCENT;
  g.shadowColor = ACCENT; g.shadowBlur = 4;
  g.stroke();
  g.shadowBlur = 0;
}

// ---- main loop -------------------------------------------------------------------------------
function follow() {
  const o = view.selected;
  if (!view.follow || !o || !o.alive) return;
  const b = bounds(o);
  view.cx += (b.cx - view.cx) * 0.12;
  view.cy += (b.cy - view.cy) * 0.12;
  clampView();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  if (running) {
    acc += dt * TPS * SPEEDS[speed];
    const t0 = performance.now();
    while (acc >= 1) {
      step();
      acc -= 1;
      dirty = true;
      if (performance.now() - t0 > 14) { acc = 0; break; } // can't keep up: drop the backlog
    }
  }
  if (pointer && pointer.mode === 'tool' && view.pointer) useTool(view.pointer, dt, false);
  follow();
  const hz = (world.t / 30) | 0;
  if (view.haze && hz !== hazeTick) { hazeTick = hz; paintHaze(); }
  if (dirty) {
    paintTexture();
    if (view.glow) paintBloom();
    dirty = running;                                      // keep painting so flashes fade
  }
  render();
  if ((hudWait -= dt) <= 0) { hudWait = 0.25; updateHud(); }
  if (hintWait > 0 && (hintWait -= dt) <= 0) $('hint').classList.remove('show');
}

function boot() {
  initRender($('view'));
  bindControls();
  bindPointer();
  bindKeys();
  const fit = () => { resizeView(innerWidth, innerHeight); dirty = true; };
  addEventListener('resize', fit);
  fit();
  setSpeed(1);
  setTool('inspect');
  setRunning(true);
  newWorld();
  requestAnimationFrame(frame);
}

boot();

})();
</script>
</body>
</html>
