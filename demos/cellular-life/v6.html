<script>
(() => {
'use strict';
// Biosphere (Cellular Life v6): a side view of a living world: sky, land and sea, from the
// clouds down to the deep seafloor. Geometry, cell types, genes, body plans and species.
// No DOM, so the simulation also runs headless in Node for tuning.

// ---- the world -----------------------------------------------------------------------------
// WW x WH units: x wraps round, y runs from the top of the sky (0) down to the deep seafloor.
const WW = 1800, WH = 1000, TPS = 30, TAU = Math.PI * 2;
const BIN = 25, BW = WW / BIN, BH = WH / BIN, NB = BW * BH; // grid for light, wind, current and food

const mod = (v, m) => ((v % m) + m) % m;
const wrapX = (x) => (x < 0 ? x + WW : x >= WW ? x - WW : x);
const wdx = (d) => (d > WW / 2 ? d - WW : d < -WW / 2 ? d + WW : d); // the short way round
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const binAt = (x, y) => clamp((y / BIN) | 0, 0, BH - 1) * BW + Math.min(BW - 1, (wrapX(x) / BIN) | 0);

// ---- helpers ---------------------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (n) => (Math.random() * n) | 0;
function gauss() {
  let u = 0;
  while (!u) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random());
}
function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}
const angWrap = (a) => mod(a + Math.PI, TAU) - Math.PI;

// ---- cell types ---------------------------------------------------------------------------------
// buoy: positive floats, negative sinks. Each type does one job; doing many jobs at once
// means carrying many kinds of cell.
const PHOTO = 0, FILTER = 1, JAW = 2, FLAG = 3, MUSCLE = 4, SPIKE = 5, SHELL = 6, EYE = 7, HOLD = 8, WING = 9, LEG = 10, NT = 11;
const TYPES = [
  { name: 'Photo', role: 'harvests light; slightly buoyant', cost: 4, upkeep: 0.01, hp: 1, size: 1, buoy: 0.15, rgb: [96, 240, 150] },
  { name: 'Filter', role: 'strains drifting food from the water', cost: 4, upkeep: 0.009, hp: 1, size: 1, buoy: 0, rgb: [255, 200, 90] },
  { name: 'Jaw', role: 'bites creatures in front of it', cost: 5, upkeep: 0.016, hp: 1.5, size: 0.95, buoy: -0.2, rgb: [255, 84, 84] },
  { name: 'Flagellum', role: 'pushes away from the side it sticks out of', cost: 4, upkeep: 0.012, hp: 1, size: 0.8, buoy: 0, rgb: [90, 205, 255] },
  { name: 'Muscle', role: 'bends the body; chains of it swim like eels', cost: 5, upkeep: 0.012, hp: 1.5, size: 1, buoy: -0.1, rgb: [240, 130, 205] },
  { name: 'Spike', role: 'stings whatever touches it', cost: 5, upkeep: 0.015, hp: 1.5, size: 0.85, buoy: -0.3, rgb: [255, 160, 60] },
  { name: 'Shell', role: 'armour that also keeps the body from drying out in air; heavy', cost: 5, upkeep: 0.01, hp: 4, size: 1.1, buoy: -1, rgb: [170, 150, 255] },
  { name: 'Eye', role: 'sees food, prey, kin and threats', cost: 5, upkeep: 0.015, hp: 1, size: 0.85, buoy: 0, rgb: [240, 245, 255] },
  { name: 'Holdfast', role: 'anchors to the ground; roots draw water on land and food at vents', cost: 4, upkeep: 0.008, hp: 2, size: 1, buoy: -0.6, rgb: [190, 145, 95] },
  { name: 'Wing', role: 'a fin in water; lift in air', cost: 5, upkeep: 0.012, hp: 1, size: 0.9, buoy: 0, rgb: [200, 235, 255] },
  { name: 'Leg', role: 'walks on the ground or the seabed', cost: 4, upkeep: 0.01, hp: 1.5, size: 0.85, buoy: -0.2, rgb: [255, 225, 150] },
];
const COST = TYPES.map((t) => t.cost);
const UPKEEP = TYPES.map((t) => t.upkeep);
const cellRadius = (t, z) => (3 + 2.6 * z) * TYPES[t].size;

// ---- genes -------------------------------------------------------------------------------------
// Gait and behaviour ride alongside the body plan. tag is a neutral marker that drifts over
// the generations: creatures with close tags are kin, and never bite or sting each other.
const GENES = [
  ['f', 'Beat rate'], ['amp', 'Undulation'], ['pulse', 'Pulsing'], ['agility', 'Agility'],
  ['depth', 'Preferred depth'], ['light', 'Light seeking'], ['food', 'Foraging'], ['prey', 'Hunting'],
  ['flee', 'Caution'], ['school', 'Schooling'], ['settle', 'Settling'], ['invest', 'Offspring size'],
];
const GENE_KEYS = ['f', 'amp', 'wave', 'pulse', 'agility', 'depth', 'light', 'food', 'prey', 'flee', 'school', 'settle'];
function randomGenes() {
  const g = { tag: Math.random(), invest: rand(0.4, 0.6) };
  for (const k of GENE_KEYS) g[k] = Math.random();
  g.pulse = Math.random() < 0.3 ? g.pulse : 0;
  return g;
}
function mutateGenes(g, rate) {
  const c = { ...g };
  c.tag = mod(g.tag + gauss() * 0.01 * rate, 1);
  for (const k of GENE_KEYS) if (Math.random() < 0.2 * rate) c[k] = clamp(g[k] + gauss() * 0.12, 0, 1);
  if (Math.random() < 0.2 * rate) c.invest = clamp(g.invest + gauss() * 0.05, 0.15, 1);
  return c;
}
// Mating mixes two parents' genes, each gene from one or the other.
function crossGenes(a, b) {
  const c = { tag: mod(a.tag + angWrap((b.tag - a.tag) * TAU) / TAU / 2, 1) };
  for (const k of [...GENE_KEYS, 'invest']) c[k] = Math.random() < 0.5 ? a[k] : b[k];
  return c;
}

// ---- body plans ----------------------------------------------------------------------------------
// A plan is the zygote's type and size plus base cells {p, a, t, z}: parent (0 = the zygote,
// k = base cell k), angle from the parent's direction, type, and size 0..1. A global
// symmetry can copy every branch (mirrored, or repeated round the zygote), but mutations
// also grow chains, copy limbs and mirror single branches, so most symmetry is local.
const MAX_BODY = 48;
const SYMS = ['asymmetric', 'bilateral', 'triradial', 'tetraradial', 'pentaradial'];
const AXIAL = 0.14; // branches this close to straight ahead or behind lie on the body axis

function makePlan(root, rz, cells, sym) {
  const par = [-1], ang = [0], typ = [root], siz = [rz], dep = [0];
  const imgs = [[{ i: 0, sg: 1, ax: true }]];
  for (const c of cells) {
    const out = [];
    for (const Pm of imgs[c.p]) {
      let list;
      if (sym >= 2 && c.p === 0) {
        const k = sym + 1;
        list = [];
        for (let j = 0; j < k; j++) list.push({ a: c.a + (TAU * j) / k, sg: 1, ax: false });
      } else if (sym === 1 && Pm.ax) {
        const axial = Math.abs(c.a) < AXIAL || Math.PI - Math.abs(c.a) < AXIAL;
        list = axial ? [{ a: c.a, sg: 1, ax: true }] : [{ a: c.a, sg: 1, ax: false }, { a: -c.a, sg: -1, ax: false }];
      } else list = [{ a: Pm.sg * c.a, sg: Pm.sg, ax: false }];
      for (const L of list) {
        if (par.length >= MAX_BODY) return null;
        out.push({ i: par.length, sg: L.sg, ax: L.ax });
        par.push(Pm.i); ang.push(L.a); typ.push(c.t); siz.push(c.z); dep.push(dep[Pm.i] + 1);
      }
    }
    imgs.push(out);
  }
  const n = par.length, rad = new Float32Array(n), len = new Float32Array(n);
  const rx = new Float32Array(n), ry = new Float32Array(n), dir = new Float32Array(n);
  const count = new Int16Array(NT);
  let cost = 0, mass = 0, reach = 0, depthMax = 0, buoy = 0;
  for (let i = 0; i < n; i++) {
    const t = typ[i];
    rad[i] = cellRadius(t, siz[i]);
    count[t]++; cost += COST[t]; buoy += TYPES[t].buoy;
    mass += ((rad[i] * rad[i]) / 16) * (t === SHELL ? 2 : 1);
    depthMax = Math.max(depthMax, dep[i]);
    if (i === 0) continue;
    const p = par[i];
    len[i] = 0.88 * (rad[p] + rad[i]);
    dir[i] = (p === 0 ? 0 : dir[p]) + ang[i];               // resting pose, heading along +x
    rx[i] = rx[p] + Math.cos(dir[i]) * len[i];
    ry[i] = ry[p] + Math.sin(dir[i]) * len[i];
    reach = Math.max(reach, Math.hypot(rx[i], ry[i]) + rad[i]);
  }
  // Propulsion, in the body's frame. A flagellum pushes away from the side it sticks out
  // of, so flagella all round a body cancel out. Muscles deep in a chain undulate it and
  // drive it toward the zygote end, like an eel.
  let px = 0, py = 0, mx = 0, my = 0, mn = 0;
  for (let i = 0; i < n; i++) {
    if (typ[i] === FLAG || typ[i] === WING) {        // wings row like fins underwater
      const a = i === 0 ? Math.PI : dir[i], k = typ[i] === FLAG ? 1 : 0.6;
      px -= Math.cos(a) * k; py -= Math.sin(a) * k;
    } else if (typ[i] === MUSCLE && dep[i] >= 1) { mx += rx[i]; my += ry[i]; mn++; }
  }
  let swim = 0;
  if (mn >= 1) {
    const L = Math.hypot(mx, my) / mn;                      // how far the muscles sit behind
    if (L > 3) { const k = 0.7 * Math.min(mn, 10) * Math.min(1, L / 16); px -= (mx / mn / L) * k; py -= (my / mn / L) * k; swim = mn; }
  }
  const pMag = Math.hypot(px, py), fAng = pMag > 0.05 ? Math.atan2(py, px) : 0;
  // streamlining: drag rises with the body's width across its direction of travel
  let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
  const cf = Math.cos(fAng), sf = Math.sin(fAng);
  for (let i = 0; i < n; i++) {
    const u = rx[i] * cf + ry[i] * sf, v = -rx[i] * sf + ry[i] * cf;
    a0 = Math.min(a0, u - rad[i]); a1 = Math.max(a1, u + rad[i]);
    b0 = Math.min(b0, v - rad[i]); b1 = Math.max(b1, v + rad[i]);
  }
  const length = a1 - a0, width = b1 - b0;
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += rx[i]; cy += ry[i]; }
  return {
    root, rz, cells, sym, n, cost, mass, count, depthMax, buoy, pMag, fAng, swim,
    wings: count[WING], legs: count[LEG],
    drag: 0.45 + (1.1 * width) / (length + width), length, width,
    reach: Math.max(reach, rad[0]), cx: cx / n, cy: cy / n,
    kinds: count.reduce((a, c) => a + (c > 0 ? 1 : 0), 0),
    par: Int16Array.from(par), ang: Float32Array.from(ang), typ: Uint8Array.from(typ),
    dep: Uint8Array.from(dep), rad, len, rx, ry, dir,
  };
}

function randomType(not) {
  let t;
  do t = randi(NT); while (t === not);
  return t;
}

// Base cells in the branch that grows from base cell k (k included).
function subtree(cells, k) {
  const inside = new Set([k]);
  for (let j = k + 1; j < cells.length; j++) if (inside.has(cells[j].p - 1)) inside.add(j);
  return [...inside].sort((a, b) => a - b);
}

// Copy a branch onto parent q at angle a. sign -1 mirrors it.
function copyBranch(cells, list, q, a, sign) {
  const map = new Map();
  for (const j of list) {
    const c = cells[j], p = j === list[0] ? q : map.get(c.p - 1) + 1;
    map.set(j, cells.length);
    cells.push({ p, a: j === list[0] ? a : sign * c.a, t: c.t, z: c.z });
  }
}

// One random change to a body plan. Returns a new plan, or null if the change was invalid.
function mutatePlan(pl) {
  const cells = pl.cells.map((c) => ({ ...c }));
  let root = pl.root, rz = pl.rz, sym = pl.sym;
  const r = Math.random(), K = cells.length;
  if (r < 0.24) {                                   // bud a new cell anywhere
    const p = randi(K + 1), pt = p ? cells[p - 1].t : root;
    cells.push({ p, a: p ? angWrap(gauss() * 0.9) : rand(-Math.PI, Math.PI), t: Math.random() < 0.4 ? pt : randi(NT), z: Math.random() });
  } else if (r < 0.42) {                            // extend a chain: worms and stalks
    const leaves = [];
    for (let k = 0; k < K; k++) if (!cells.some((c) => c.p === k + 1)) leaves.push(k);
    const k = leaves.length ? leaves[randi(leaves.length)] : -1;
    const t = k < 0 ? root : cells[k].t;
    cells.push({ p: k + 1, a: k < 0 ? Math.PI : angWrap(gauss() * 0.25), t: Math.random() < 0.8 ? t : randi(NT), z: k < 0 ? rz : cells[k].z });
  } else if (r < 0.52) {                            // copy a limb onto another cell
    if (!K) return null;
    const k = randi(K), list = subtree(cells, k);
    if (list.length > 8) return null;
    const free = [];
    for (let q = 0; q <= K; q++) if (!list.includes(q - 1)) free.push(q);
    copyBranch(cells, list, free[randi(free.length)], angWrap(cells[k].a + gauss() * 0.8), 1);
  } else if (r < 0.6) {                             // mirror a limb across its parent
    if (!K) return null;
    const k = randi(K), list = subtree(cells, k);
    if (list.length > 8 || Math.abs(cells[k].a) < AXIAL) return null;
    copyBranch(cells, list, cells[k].p, -cells[k].a, -1);
  } else if (r < 0.7) {                             // lose an end cell
    const leaves = [];
    for (let k = 0; k < K; k++) if (!cells.some((c) => c.p === k + 1)) leaves.push(k);
    if (!leaves.length) return null;
    const k = leaves[randi(leaves.length)];
    cells.splice(k, 1);
    for (const c of cells) if (c.p > k + 1) c.p--;
  } else if (r < 0.84) {                            // a cell changes type
    const k = randi(K + 1);
    if (k === 0) root = randomType(root);
    else cells[k - 1].t = randomType(cells[k - 1].t);
  } else if (r < 0.96) {                            // a cell changes angle or size
    if (!K) rz = clamp(rz + gauss() * 0.25, 0, 1);
    else {
      const c = cells[randi(K)];
      if (Math.random() < 0.6) c.a = angWrap(c.a + gauss() * 0.4);
      else c.z = clamp(c.z + gauss() * 0.25, 0, 1);
    }
  } else {                                          // the whole body turns bilateral, or stops being
    sym = pl.sym ? 0 : 1;                           // (repeats round the body come only from copied limbs)
  }
  return makePlan(root, rz, cells, sym);
}

// How different two plans are. Becoming multicellular always counts as a big step.
function planDist(a, b) {
  let d = (a.root !== b.root) + (a.sym !== b.sym) + 0.6 * Math.abs(a.cells.length - b.cells.length);
  if ((a.n === 1) !== (b.n === 1)) d += 2;
  const n = Math.min(a.cells.length, b.cells.length);
  for (let i = 0; i < n; i++) {
    const x = a.cells[i], y = b.cells[i];
    d += (x.t !== y.t) + 0.5 * (x.p !== y.p) + 0.25 * Math.abs(angWrap(x.a - y.a)) + 0.25 * Math.abs(x.z - y.z);
  }
  return d;
}

// ---- species ----------------------------------------------------------------------------------------
// A species is a cluster of similar plans around a founding plan. A child whose plan has
// drifted far enough from its species' founder starts a new species, with a related colour.
const SPECIES_D = 2.2;
let speciesSeq = 0;
const SYL1 = ['Thal', 'Nere', 'Pela', 'Cora', 'Myx', 'Sal', 'Teth', 'Aby', 'Med', 'Cten', 'Siph',
  'Noct', 'Vel', 'Ech', 'Plan', 'Aur', 'Lum', 'Hyd', 'Zo', 'Oph', 'Phy', 'Glau', 'Ben', 'Lam'];
const SYL2 = ['ella', 'ia', 'ops', 'ix', 'ara', 'ina', 'oda', 'ula', 'ena', 'ys', 'aster', 'opsis',
  'ora', 'eon', 'ite', 'ax', 'is', 'ana', 'ea', 'on', 'ura', 'ida', 'ella', 'oma'];

function newSpecies(proto, hue, parent, name) {
  const id = ++speciesSeq, h = hash32(id * 7919 + 13);
  const sp = {
    id, proto, hue: mod(hue, 360), parent: parent ? parent.name : '', kids: [],
    name: name || SYL1[h % SYL1.length] + SYL2[(h >>> 11) % SYL2.length] + '-' + id,
    born: world.t, alive: 0, peak: 0, total: 0, cells: 0, mass: 0, blight: 0, blightT: -1e9, glyph: null,
  };
  if (parent) parent.kids.push(sp);
  return sp;
}

function speciesFor(sp, plan) {
  if (plan === sp.proto || planDist(plan, sp.proto) < SPECIES_D) return sp;
  sp.kids = sp.kids.filter((k) => k.alive > 0);
  for (const k of sp.kids) if (planDist(plan, k.proto) < SPECIES_D) return k;
  return newSpecies(plan, sp.hue + (Math.random() < 0.5 ? -1 : 1) * rand(18, 45), sp);
}

// Biosphere: a living world, side on: sky, land and sea. Creatures are soft bodies of cells
// that grow from a single zygote cell along their body plan. Sunlight crosses the air, is
// shaded by whatever photosynthesises above, and fades with depth under water; it comes and
// goes with the day. Out of the water bodies fall unless wings hold them up, walk on legs,
// and dry out unless shells or roots protect them. No DOM, so it also runs in Node.

const P = { light: 0.5, food: 0.5, mutation: 0.5, daynight: true }; // settings

// ---- tuning --------------------------------------------------------------------------------------
const SEA = 380;                // mean sea level
const TIDE = 12, TIDE_T = 75;   // tide height, and its period in seconds
const DAY = 80;                 // seconds in a day, when day and night are on
const MOON = 0.06;              // light at night, as a share of noon's
const DEPTH = 380;              // under water, light falls to 1/e every this many units down
const PHOTO_GAIN = 0.065;       // energy per tick from one photo cell in full light
const BIN_CAP = 3;              // photo cells one patch of light feeds at the full rate
const SHADE_K = 0.02;           // how much each unit of light demand shades what is below
const SHADE = 2 * BIN_CAP;      // demand above which light-feeders stop breeding there
const CHEMO = 0.05, VENT_R = 130, VENT_CAP = 30; // what a vent gives an anchored creature
const ROOTED = 1.6;             // how much better an anchored photo cell does, fed by the ground
const DRY = 0.04;               // energy per tick lost by each unprotected cell out of the water
const GRAZE_COOL = 4;
const BITE_RATE = 0.16, STING_RATE = 0.2, SHELL_BLOCK = 0.9, PREY_SHARE = 0.8, HANDLING = 30;
const THRUST = 0.2, DRAG = 0.08, VMAX = 1.8, FOLLOW = 0.4, SWAY = 0.5, BUOY = 0.01, TRIM = 0.006;
const GRAVITY = 0.045;          // fall per tick per tick, out of the water
const AIR_DRAG = 0.03;
const LIFT = 0.12;              // lift per wing at full effort, per unit of mass
const WALK = 0.1;               // push per leg on the ground, per unit of mass
const MOVE_COST = 0.003;        // energy per tick per unit of propulsion at full effort
const GROW_EVERY = 8, LIFE_BASE = 75, LIFE_PER_CELL = 1; // long enough to live through a night
const KIN = 0.05, STRUCT_RATE = 0.14;
const SENSE_BASE = 40, SENSE_EYE = 40, SENSE_MAX = 160;
const BLIGHT_SHARE = 0.25;      // a species holding more than this share of multicellular life sickens
const MAX_ORGS = 2000, MAX_CELLS = 6000, MAX_FOOD = 6000;
const VENT_RATE = 0.6, SNOW_RATE = 0.12, BLOOM_RATE = 1.6, SPORE_RATE = 0.002, FOOD_E = 1.4, SINK = 0.15;
const ROT = [0.9993, 0.998, 0.997, 0.999]; // per tick: marine snow and litter, plankton, vent broth, spores
const SCALE = Float32Array.from({ length: MAX_BODY + 1 }, (_, n) => (n ? Math.max(0.85, n ** -0.1) : 1));
const M_DRIFT = 0, M_GROW = 1, M_WANDER = 2, M_FORAGE = 3, M_HUNT = 4, M_FLEE = 5, M_LIGHT = 6, M_SCHOOL = 7, M_SETTLE = 8, M_ROOT = 9;
const MODE_NAMES = ['Drifting', 'Growing', 'Wandering', 'Foraging', 'Hunting', 'Fleeing', 'Seeking light', 'Schooling', 'Settling', 'Rooted'];

// ---- ways of life, read from a creature's body and situation ---------------------------------------
const ECO = [
  ['Plankton', 'single cells adrift', ''],
  ['Drifter', 'colonies carried by the current', 'Drifting colonies form'],
  ['Floater', 'buoyant light-feeders at the surface', 'Floaters bloom at the surface'],
  ['Swimmer', 'bodies driven by flagella or fins', 'Swimmers take to open water'],
  ['Worm', 'undulating swimmers and seabed crawlers', 'Worms appear'],
  ['Hunter', 'swimmers with jaws', 'Hunters appear'],
  ['Kelp', 'anchored light-feeders under water', 'Kelp takes root'],
  ['Reef', 'anchored filter-feeders', 'Reefs form on the seabed'],
  ['Vent dweller', 'anchored at the vents', 'Life gathers at the vents'],
  ['Land plant', 'rooted on dry land', 'Plants colonise the land'],
  ['Walker', 'moving about on dry land', 'Animals walk onto the land'],
  ['Flyer', 'living in the air', 'Life takes to the air'],
];
const E_PLANK = 0, E_DRIFT = 1, E_FLOAT = 2, E_SWIM = 3, E_WORM = 4, E_HUNT = 5;
const E_KELP = 6, E_REEF = 7, E_VENT = 8, E_PLANT = 9, E_WALK = 10, E_FLY = 11, NE = 12;

// ---- state ------------------------------------------------------------------------------------------
const FLOOR = new Float32Array(WW);
const floorAt = (x) => FLOOR[Math.min(WW - 1, wrapX(x) | 0)];
let seaY = SEA, sun = 1;        // the sea level and the strength of the sun, this tick
const light = new Float32Array(NB), demandNow = new Float32Array(NB), demandPrev = new Float32Array(NB);
const flowU = new Float32Array(NB), flowV = new Float32Array(NB);
const fx = new Float32Array(MAX_FOOD), fy = new Float32Array(MAX_FOOD), fe = new Float32Array(MAX_FOOD);
const fvy = new Float32Array(MAX_FOOD), fk = new Uint8Array(MAX_FOOD); // vertical speed; kind
const fhead = new Int32Array(NB).fill(-1), fnext = new Int32Array(MAX_FOOD);
let nFood = 0;
// every living cell, hashed into 20-unit buckets each tick, for contact and sight
const HB = 20, HBW = WW / HB, HBH = WH / HB, HMAX = MAX_CELLS + 4000;
const hhead = new Int32Array(HBW * HBH).fill(-1), hnext = new Int32Array(HMAX);
const hx = new Float32Array(HMAX), hy = new Float32Array(HMAX), hr = new Float32Array(HMAX);
const ho = new Int32Array(HMAX), hi = new Uint8Array(HMAX);
let nCells = 0;

const slots = [], freeSlots = [];
const world = { t: 0, seq: 0, orgs: [], born: [], species: new Set(), events: [], flags: {}, links: [], swirls: [], vents: [] };

class Org {
  constructor(slot, plan, genes, sp, x, y, h, E, gen) {
    const n = plan.n, t0 = plan.typ[0];
    this.slot = slot; this.id = ++world.seq;
    this.plan = plan; this.genes = genes; this.sp = sp;
    this.x = new Float32Array(n); this.y = new Float32Array(n); // cell positions, unwrapped round the zygote
    this.s = new Float32Array(n);                                // growth of each cell, 0..1
    this.hp = new Float32Array(n); this.on = new Uint8Array(n); this.cool = new Uint8Array(n);
    this.count = new Int16Array(NT);
    this.x[0] = x; this.y[0] = y; this.s[0] = 0.45; this.hp[0] = TYPES[t0].hp; this.on[0] = 1;
    this.n = 1; this.count[t0] = 1;
    this.h = h; this.want = h; this.vx = 0; this.vy = 0; this.phase = rand(0, TAU);
    this.cap = 10 + 1.5 * plan.cost;
    this.e0 = 1 + genes.invest * plan.cost;                      // energy given to each offspring
    this.seed = this.e0 + COST[t0] + 1;                          // what an offspring costs, zygote cell included
    this.repE = this.seed + (P.daynight ? 0.35 : 0.2) * this.cap; // keep enough back to get through the night
    this.E = E; this.age = 0; this.gen = gen;
    this.life = Math.round(TPS * (LIFE_BASE + LIFE_PER_CELL * n) * rand(0.8, 1.2));
    this.mass = 0.3; this.buoy = 0; this.prop = 0; this.income = 0; this.win = 0; this.urge = 0.6; this.effort = 0;
    this.grown = n === 1; this.alive = true; this.anchored = false; this.ay = 0; this.vent = 0; this.ventIdx = -1;
    this.ground = false; this.air = 0; this.wet = true; this.eco = E_PLANK;
    this.kills = 0; this.kids = 0; this.mates = 0; this.cause = ''; this.full = 0;
    this.mode = M_DRIFT; this.tx = 0; this.ty = 0; this.seen = 0;
  }
}

// ---- the world ---------------------------------------------------------------------------------------
const smooth = (a, b, t) => a + (b - a) * t * t * (3 - 2 * t);
// The height of a coast at distance d from a landmass's centre: highlands, a beach, a
// shallow shelf, then the slope down to the deep.
function coast(d, w, top, beach, shelf, slope) {
  if (d < w) return top;
  if ((d -= w) < beach) return smooth(top, SEA + 12, d / beach);
  if ((d -= beach) < shelf) return smooth(SEA + 12, SEA + 100, d / shelf);
  if ((d -= shelf) < slope) return smooth(SEA + 100, 920, d / slope);
  return Infinity;
}

function makeTerrain() {
  const ph = Array.from({ length: 5 }, () => rand(0, TAU));
  const land = { c: rand(0, WW), w: rand(170, 220) };
  const isle = { c: mod(land.c + WW / 2 + rand(-100, 100), WW), w: rand(35, 55) };
  const mount = { c: mod(isle.c + (Math.random() < 0.5 ? -1 : 1) * rand(260, 330), WW), w: rand(40, 70), top: rand(470, 520) };
  for (let x = 0; x < WW; x++) {
    let y = 905 + 14 * Math.sin((TAU * x) / WW + ph[0]) + 8 * Math.sin((TAU * 3 * x) / WW + ph[1]) + 4 * Math.sin((TAU * 11 * x) / WW + ph[2]);
    // the continent: rolling highlands with a peak, a beach, a wide shallow shelf
    const dl = Math.abs(wdx(x - land.c));
    const hills = SEA - 70 - 35 * (0.5 + 0.5 * Math.sin(x * 0.021 + ph[3])) - 90 * Math.max(0, 1 - (dl / 70) ** 2);
    y = Math.min(y, coast(dl, land.w, hills, 55, 150, 120));
    // a steep volcanic island
    const di = Math.abs(wdx(x - isle.c));
    y = Math.min(y, coast(di, isle.w, SEA - 45 - 40 * Math.max(0, 1 - (di / isle.w) ** 2), 30, 40, 130));
    // a seamount
    const dm = Math.abs(wdx(x - mount.c)) / mount.w;
    if (dm < 2) y = Math.min(y, smooth(mount.top, 920, Math.min(1, Math.max(0, dm - 0.5) / 1.5)));
    FLOOR[x] = y;
  }
  for (let k = 0; k < 10; k++) {
    const c = rand(0, WW), w = rand(8, 26), h = rand(8, 30);
    for (let dx = -w; dx <= w; dx++) {
      const x = mod(Math.round(c + dx), WW);
      FLOOR[x] -= h * Math.max(0, 1 - (dx / w) ** 2) ** 0.7;
    }
  }
  world.land = land; world.isle = isle;
  world.vents = [];
  for (let k = 0; k < 60 && world.vents.length < 3; k++) {
    const x = rand(0, WW);
    if (FLOOR[x | 0] < 820 || world.vents.some((v) => Math.abs(wdx(v.x - x)) < 200)) continue;
    world.vents.push({ x, y: FLOOR[x | 0] - 2, load: 0 });
  }
}

function resetWorld(seeds = 150) {
  demandNow.fill(0); demandPrev.fill(0); fhead.fill(-1); hhead.fill(-1);
  nFood = 0; nCells = 0; speciesSeq = 0;
  slots.length = 0; freeSlots.length = 0;
  Object.assign(world, {
    t: 0, seq: 0, orgs: [], born: [], species: new Set(), events: [], flags: {}, links: [], swirls: [],
    births: 0, deaths: 0, kills: 0, matings: 0, top: [], lead: null, leadT: -1e9,
    stats: { orgs: 0, cells: 0, multi: 0, species: 0, maxN: 0, wavg: 0, div: 1, ecoN: 0, eco: new Int32Array(NE), types: new Int32Array(NT) },
    hist: { every: TPS, next: 0, t: [], div: [], eco: [], max: [] },
    modes: [[1, 1], [2, 1], [3, 2]].map(([m, k]) => ({
      kx: (TAU * m) / WW, ky: (Math.PI * k) / (WH - SEA), a: rand(0.1, 0.16) / Math.max((TAU * m) / WW, (Math.PI * k) / (WH - SEA)),
      px: rand(0, TAU), dx: rand(-1, 1) * 0.02, cx: 0,
    })),
    clouds: Array.from({ length: 4 }, () => ({ x0: rand(0, WW), v: rand(-1, 1) * 4, w: rand(90, 200), k: rand(0.2, 0.4) })),
    surfaceDrift: (Math.random() < 0.5 ? -1 : 1) * rand(0.15, 0.3),
    wind: (Math.random() < 0.5 ? -1 : 1) * rand(0.25, 0.45),
  });
  makeTerrain();
  tick0();
  updateFlow();
  updateLight();
  for (let i = 0; i < 700; i++) {
    const x = rand(0, WW), f = floorAt(x);
    if (f > SEA + 20) addFood(x, rand(SEA + 10, f - 10), FOOD_E, 0, 0);
  }
  // the first cells drift in the sunlit sea; a few cling near the vents. The land is bare.
  for (let i = 0, tries = 0; i < seeds && tries < seeds * 20; tries++) {
    const r = Math.random(), t = r < 0.55 ? PHOTO : r < 0.88 ? FILTER : HOLD, sp = protoSpecies(t);
    const v = world.vents[randi(world.vents.length)], x = t === HOLD && v ? v.x + rand(-60, 60) : rand(0, WW), f = floorAt(x);
    if (f < SEA + 40) continue;
    const y = t === PHOTO ? rand(SEA + 8, Math.min(f - 10, SEA + 220)) : t === HOLD ? f - rand(10, 40) : rand(SEA + 10, f - 20);
    const g = randomGenes();
    if (t === HOLD) g.settle = rand(0.6, 1);
    spawn(sp.proto, g, sp, x, y, rand(0, TAU), 4, 0, null);
    i++;
  }
  flushBorn();
  hashCells();
  hashFood();
  logEvent('first', `${world.born.length + world.orgs.length} lone cells adrift in an empty sea; the land is bare`);
  census();
}

// The tide and the sun.
function tick0() {
  const secs = world.t / TPS;
  seaY = SEA + TIDE * Math.sin((TAU * secs) / TIDE_T);
  sun = P.daynight ? sunAt(dayPhase()) : 1;
}
// Days run a little longer than nights.
const sunAt = (phase) => Math.pow(clamp((Math.sin(TAU * phase) + 0.3) / 1.3, 0, 1), 0.6);
// How bright days must be for a whole day to bring as much light as constant light does.
const DAY_MEAN = Array.from({ length: 200 }, (_, i) => MOON + (1 - MOON) * sunAt(i / 200)).reduce((a, b) => a + b) / 200;
const dayPhase = () => mod(world.t / TPS / DAY + 0.12, 1); // 0 sunrise, 0.25 noon, 0.5 sunset

// Sunlight, dimmed by drifting cloud, crosses the air, then fades with depth in the sea.
// Whatever photosynthesises shades what is beneath it, and no light passes into the ground.
function updateLight() {
  // with day and night on, days are brighter so that a whole day brings as much light
  const secs = world.t / TPS, k = (0.4 + 1.2 * P.light) * (P.daynight ? (MOON + (1 - MOON) * sun) / DAY_MEAN : 1);
  const fall = Math.exp(-BIN / DEPTH);
  for (let bx = 0; bx < BW; bx++) {
    const x = (bx + 0.5) * BIN, floor = FLOOR[x | 0];
    let L = k;
    for (const c of world.clouds) {
      const d = wdx(x - mod(c.x0 + c.v * secs, WW)) / c.w;
      L *= 1 - c.k * Math.exp(-d * d);
    }
    for (let by = 0; by < BH; by++) {
      const b = by * BW + bx, y = (by + 0.5) * BIN;
      if (y > floor) { light[b] = 0; L = 0; continue; }
      if (y > seaY) L *= y - BIN < seaY ? Math.exp(-(y - seaY) / DEPTH) : fall;
      light[b] = L;
      L *= Math.exp(-SHADE_K * demandPrev[b]);
    }
  }
}

// Under water, a surface drift that fades with depth plus slow eddies (the curl of a few
// shifting waves) that cannot cross the surface or the seabed. In the air, a gusting wind.
function updateFlow() {
  const secs = world.t / TPS, sw = world.swirls;
  for (const m of world.modes) m.cx = m.px + m.dx * secs;
  const gust = world.wind * (0.6 + 0.4 * Math.sin((TAU * secs) / 140));
  for (let by = 0; by < BH; by++) {
    const y = (by + 0.5) * BIN;
    for (let bx = 0; bx < BW; bx++) {
      const x = (bx + 0.5) * BIN, floor = FLOOR[x | 0], b = by * BW + bx;
      let u = 0, v = 0;
      if (y > floor) { flowU[b] = 0; flowV[b] = 0; continue; }
      if (y <= seaY) {
        u = gust * (0.6 + 0.4 * Math.sin(x * 0.004 + secs * 0.05));
        v = 0.06 * Math.sin(x * 0.012 + secs * 0.3) * Math.min(1, (floor - y) / 80);
      } else {
        const d = y - seaY, depth = 0.35 + 0.65 * Math.exp(-d / 320);
        u = world.surfaceDrift * Math.exp(-d / 160);
        for (const m of world.modes) {
          const sx = Math.sin(m.kx * x + m.cx), cx = Math.cos(m.kx * x + m.cx);
          const sy = Math.sin(m.ky * (y - SEA)), cy = Math.cos(m.ky * (y - SEA));
          u += m.a * m.ky * sx * cy * depth;
          v -= m.a * m.kx * cx * sy * depth;
        }
        v *= Math.min(1, d / 60, (floor - y) / 60);
      }
      for (const s of sw) {
        const dx = wdx(x - s.x), dy = y - s.y, f = s.str * Math.exp(-(dx * dx + dy * dy) / (s.r * s.r));
        u += s.u * f; v += s.v * f;
      }
      flowU[b] = u; flowV[b] = v;
    }
  }
  for (let i = sw.length - 1; i >= 0; i--) if ((sw[i].str *= 0.96) < 0.02) sw.splice(i, 1);
}

let FU = 0, FV = 0; // sampleFlow's result
function sampleFlow(x, y) {
  const gx = wrapX(x) / BIN - 0.5, gy = clamp(y / BIN - 0.5, 0, BH - 1.001);
  const x0 = Math.floor(gx), y0 = Math.floor(gy), tx = gx - x0, ty = gy - y0;
  const xa = (x0 + BW) % BW, xb = (x0 + 1) % BW, ya = y0 * BW, yb = Math.min(BH - 1, y0 + 1) * BW;
  const a = ya + xa, b = ya + xb, c = yb + xa, d = yb + xb;
  const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
  FU = flowU[a] * w00 + flowU[b] * w10 + flowU[c] * w01 + flowU[d] * w11;
  FV = flowV[a] * w00 + flowV[b] * w10 + flowV[c] * w01 + flowV[d] * w11;
}

function addFood(x, y, e, kind, vy) {
  if (nFood >= MAX_FOOD || e < 0.15) return;
  fx[nFood] = mod(x, WW); fy[nFood] = clamp(y, 2, WH - 2); fe[nFood] = e; fk[nFood] = kind; fvy[nFood] = vy;
  nFood++;
}

// ---- birth and death ---------------------------------------------------------------------------------
function protoSpecies(t) {
  for (const sp of world.species) if (!sp.parent && sp.proto.n === 1 && sp.proto.root === t) return sp;
  return newSpecies(makePlan(t, 0.5, [], 0), t === PHOTO ? 140 : t === FILTER ? 40 : 15, null, TYPES[t].name + ' protocell');
}

function spawn(plan, genes, sp, x, y, h, E, gen, parent) {
  const slot = freeSlots.length ? freeSlots.pop() : slots.length;
  const o = new Org(slot, plan, genes, sp, mod(x, WW), clamp(y, 4, floorAt(x) - 4), h, E, gen);
  slots[slot] = o;
  world.born.push(o);
  if (sp.alive++ === 0) world.species.add(sp);
  sp.total++;
  if (sp.alive > sp.peak) sp.peak = sp.alive;
  if (parent) { parent.kids++; o.vx = parent.vx * 0.5; o.vy = parent.vy * 0.5; }
  world.births++;
  return o;
}

function flushBorn() {
  for (const o of world.born) if (o.alive) world.orgs.push(o);
  world.born.length = 0;
}

function die(o, cause, remains = true) {
  if (!o.alive) return;
  o.alive = false; o.cause = cause;
  const pl = o.plan, spare = Math.max(0, o.E) / Math.max(1, o.n);
  if (remains) {
    for (let i = 0; i < pl.n; i++) if (o.on[i]) addFood(o.x[i], o.y[i], COST[pl.typ[i]] * 0.4 + spare * 0.5, 0, 0);
  }
  slots[o.slot] = null; freeSlots.push(o.slot);
  if (--o.sp.alive === 0) extinct(o.sp);
  world.deaths++;
}

function extinct(sp) {
  world.species.delete(sp);
  if (sp.proto.n > 1 && sp.peak >= 50) logEvent('extinct', `${sp.name} died out after peaking at ${sp.peak}`, sp);
}

// Lose cell i and everything that grew from it. Losing the zygote cell is fatal.
function cutCell(o, i, food) {
  if (i === 0) return die(o, o.cause || 'eaten');
  const pl = o.plan;
  o.on[i] = 0; o.n--;
  if (food) addFood(o.x[i], o.y[i], COST[pl.typ[i]] * 0.4, 0, 0);
  for (let j = i + 1; j < pl.n; j++) {
    if (o.on[j] && !o.on[pl.par[j]]) {
      o.on[j] = 0; o.n--;
      addFood(o.x[j], o.y[j], COST[pl.typ[j]] * 0.4, 0, 0);
    }
  }
  o.grown = false;
}

const kin = (a, b) => {
  const d = Math.abs(a.genes.tag - b.genes.tag);
  return (d > 0.5 ? 1 - d : d) < KIN;
};

// ---- a tick of one creature's life --------------------------------------------------------------------
function live(o) {
  const pl = o.plan, n = pl.n;
  o.age++;
  if (o.full) o.full--;
  let gain = 0, mass = 0, buoy = 0, dry = 0;
  o.count.fill(0);
  o.wet = o.y[0] > seaY;
  sampleFlow(o.x[0], o.y[0]);
  const rel = Math.hypot(FU - o.vx, FV - o.vy);               // water or air streaming past
  const soil = o.anchored ? ROOTED : 1;                       // rooted light-feeders draw on the ground
  for (let i = 0; i < n; i++) {
    if (!o.on[i]) continue;
    const t = pl.typ[i], s = o.s[i], r = pl.rad[i] * s;
    o.count[t]++;
    mass += ((r * r) / 16) * (t === SHELL ? 2 : 1);
    buoy += TYPES[t].buoy * s;
    if (s < 1) o.s[i] = Math.min(1, s + 0.035);
    const wet = o.y[i] > seaY;
    if (o.y[i] < seaY - 6) dry++;                            // the splash zone stays wet
    if (t === PHOTO) {
      const b = binAt(o.x[i], o.y[i]), share = BIN_CAP / demandPrev[b];
      demandNow[b] += 1;
      // the glare right at the surface inhibits photosynthesis, so light-feeders spread down
      const glare = wet ? 0.55 + 0.45 * (1 - Math.exp(-(o.y[i] - seaY) / 20)) : 1;
      const got = PHOTO_GAIN * soil * glare * light[b] * (share < 1 ? share : 1) * s;
      gain += got;
      // plants on land shed spores into the wind, a little of what they make
      if (!wet && o.anchored && Math.random() < SPORE_RATE) { addFood(o.x[i], o.y[i] - 4, 0.9, 3, -0.03); gain -= 0.9; }
    } else if (t === FILTER) {
      if (o.cool[i]) o.cool[i]--;
      else gain += graze(o, i, rel);
    }
  }
  // an anchored body draws on its vent through its holdfast; each vent's output is shared
  if (o.anchored && o.count[HOLD] && o.wet) {
    const v = world.vents[o.ventIdx];
    gain += 0.002 + (v ? CHEMO * o.vent * Math.min(1, VENT_CAP / Math.max(1, v.load)) : 0);
  }
  o.mass = Math.max(0.2, mass);
  o.buoy = buoy;
  let up = 0;
  for (let t = 0; t < NT; t++) up += o.count[t] * UPKEEP[t] * (t === PHOTO ? 0.3 + 0.7 * sun : 1); // dormant at night
  // out of the water, cells dry out unless shells cover them or roots draw water
  const shield = 3 * o.count[SHELL] + (o.anchored ? 5 * o.count[HOLD] : 0);
  const thirst = DRY * Math.max(0, dry - shield);
  const prop = o.anchored || (!o.grown && o.n < 2) ? 0 : propulsion(o);
  o.prop = prop;
  const loco = o.anchored ? 0 : prop + o.count[WING] + o.count[LEG];
  o.effort = loco ? gait(o) * o.urge : 0;
  up = up * SCALE[o.n] * (1 + 1.5 * o.sp.blight) + MOVE_COST * loco * o.effort * o.effort + thirst;
  o.income = gain;
  o.E += gain - up;
  if (o.E > o.cap) o.E = o.cap;
  if (o.E <= 0) return die(o, thirst > gain * 0.5 && dry ? 'dried out' : 'starved');
  if (o.age > o.life) return die(o, 'died of old age');
  if (o.sp.blight > 0.05 && Math.random() < 0.001 * o.sp.blight) return die(o, 'killed by blight');
  if (!o.grown) {
    if ((world.t + o.slot) % GROW_EVERY === 0) grow(o);
  } else if (o.E >= o.repE) reproduce(o);
  if ((world.t + o.slot) % 5 === 0) think(o);
  move(o);
}

// How much of the plan's swimming propulsion the body has grown so far.
function propulsion(o) {
  const pl = o.plan;
  if (pl.pMag < 0.05) return 0;
  const k = (o.count[FLAG] + o.count[MUSCLE] + o.count[WING]) / Math.max(1, pl.count[FLAG] + pl.count[MUSCLE] + pl.count[WING]);
  return pl.pMag * k;
}

// A filter cell takes the nearest morsel within reach; more water (or air) streaming past
// widens its reach, and anchored filter-feeders spread tentacles.
function graze(o, i, rel) {
  const reach = o.plan.rad[i] * o.s[i] + (o.anchored ? 12 : 6) + 5 * Math.min(1.5, rel), r2 = reach * reach;
  const x = wrapX(o.x[i]), y = o.y[i];
  const bx = Math.min(BW - 1, (x / BIN) | 0), by = clamp((y / BIN) | 0, 0, BH - 1);
  for (let dy = -1; dy <= 1; dy++) {
    const yy = by + dy;
    if (yy < 0 || yy >= BH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      for (let k = fhead[yy * BW + ((bx + dx + BW) % BW)]; k >= 0; k = fnext[k]) {
        if (fe[k] <= 0) continue;
        const ex = wdx(fx[k] - x), ey = fy[k] - y;
        if (ex * ex + ey * ey > r2) continue;
        const e = fe[k];
        fe[k] = 0;
        o.cool[i] = GRAZE_COOL;
        return e * 0.9;
      }
    }
  }
  o.cool[i] = 2;
  return 0;
}

// How hard the body is pushing right now: a steady beat, helped by undulating a long body,
// or a burst once per stroke (a jet, or a wingbeat).
function gait(o) {
  const g = o.genes, c = Math.cos(o.phase);
  const glide = 0.6 + 0.8 * g.amp * (o.plan.swim ? 1 : 0.3);
  const burst = c > 0 ? c * c * c * 2.4 : 0;
  return ((1 - g.pulse) * glide + g.pulse * burst) * (0.5 + g.f);
}

function grow(o) {
  const pl = o.plan;
  if (nCells > MAX_CELLS + 800) return;            // the world is full
  for (let i = 1; i < pl.n; i++) {
    if (o.on[i] || !o.on[pl.par[i]]) continue;
    const c = COST[pl.typ[i]];
    if (o.E < c + 1) return;
    o.E -= c;
    o.on[i] = 1; o.n++; o.s[i] = 0.2; o.hp[i] = TYPES[pl.typ[i]].hp;
    o.x[i] = o.x[pl.par[i]]; o.y[i] = o.y[pl.par[i]];   // buds out of its parent cell
    return;
  }
  o.grown = true;
}

function reproduce(o) {
  if (world.orgs.length + world.born.length >= MAX_ORGS || nCells >= MAX_CELLS) return;
  const pl = o.plan, g = o.genes, back = pl.reach + 4;
  // the young are released from the far side of the body; anchored parents shed them upward
  const a = o.anchored ? -Math.PI / 2 + rand(-0.9, 0.9) : o.h + pl.fAng + Math.PI + rand(-0.5, 0.5);
  const bx = o.x[0] + Math.cos(a) * back, floor = floorAt(bx);
  let by = o.y[0] + Math.sin(a) * back;
  if (by > floor - 6) by = 2 * (floor - 6) - by;  // bounce off the ground
  if (by < 6 || by > floor - 4) return;
  if (pl.typ[0] === PHOTO && demandPrev[binAt(bx, by)] > SHADE) return; // no room in the light
  const mate = pl.n > 1 && Math.random() < 0.7 ? findMate(o) : null; // single cells just divide
  let plan = pl, genes = g;
  if (mate) {
    plan = Math.random() < 0.5 ? pl : mate.plan;
    genes = crossGenes(g, mate.genes);
    o.E -= o.seed * 0.5;
    mate.E -= o.seed * 0.5;
    o.mates++; mate.mates++; world.matings++;
    world.links.push({ a: o, b: mate, t: 20 });
    if (!world.flags.mate && o.sp.proto.n > 1) first('mate', `First mating: two ${o.sp.name} pair up`, o.sp);
  } else o.E -= o.seed;
  const rate = 2 * P.mutation;
  if (Math.random() < STRUCT_RATE * rate) plan = mutatePlan(plan) || plan;
  genes = mutateGenes(genes, rate);
  if (o.n < pl.n) o.grown = false;
  spawn(plan, genes, speciesFor(o.sp, plan), bx, by, rand(0, TAU), o.e0, o.gen + 1, o);
}

// A grown member of the same species nearby with energy to spare.
function findMate(o) {
  const x = wrapX(o.x[0]), y = o.y[0], R = 40 + o.plan.reach * 2, me = o.slot + 1;
  const bx = (x / HB) | 0, by = (clamp(y, 0, WH - 1) / HB) | 0, span = Math.ceil(R / HB);
  for (let dy = -span; dy <= span; dy++) {
    const yy = by + dy;
    if (yy < 0 || yy >= HBH) continue;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = hhead[yy * HBW + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        if (ho[k] === me || hi[k] !== 0) continue;   // look at zygote cells only
        const v = slots[ho[k] - 1];
        if (!v || v.sp !== o.sp || !v.grown || v.E < v.seed * 0.6 + 2) continue;
        const ex = wdx(hx[k] - x), ey = hy[k] - y;
        if (ex * ex + ey * ey < R * R) return v;
      }
    }
  }
  return null;
}

// ---- senses and steering -------------------------------------------------------------------------------
let stamp = 0;
function think(o) {
  const g = o.genes, pl = o.plan;
  if (o.anchored) { o.mode = M_ROOT; return; }
  const swims = o.prop > 0 && o.wet, flies = o.count[WING] > 0 && !o.wet, walks = o.ground && (o.count[LEG] || (!o.wet && o.count[MUSCLE]));
  if (!swims && !flies && !walks) { o.mode = o.grown ? M_DRIFT : M_GROW; return; }
  const worse = o.income < o.win;
  o.win = o.income;
  const R = Math.min(SENSE_MAX, SENSE_BASE + SENSE_EYE * o.count[EYE]), R2 = R * R, me = o.slot + 1;
  const x0 = wrapX(o.x[0]), y0 = o.y[0], jaws = o.count[JAW] > 0;
  const hungry = o.E < o.repE;
  let preyD = R2, preyX = 0, preyY = 0, ax = 0, ay = 0, fear = 0;
  let ku = 0, kv = 0, kx = 0, ky = 0, kn = 0, checked = 0;
  stamp++;
  const span = Math.ceil(R / HB), bx = (x0 / HB) | 0, by = (clamp(y0, 0, WH - 1) / HB) | 0, stride = span > 6 ? 2 : 1;
  for (let dy = -span; dy <= span && checked < 700; dy += stride) {
    const yy = by + dy;
    if (yy < 0 || yy >= HBH) continue;
    for (let dx = -span; dx <= span; dx += stride) {
      for (let k = hhead[yy * HBW + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        if (ho[k] === me) continue;
        checked++;
        const v = slots[ho[k] - 1];
        if (!v || !v.alive) continue;
        const ex = wdx(hx[k] - x0), ey = hy[k] - y0, d2 = ex * ex + ey * ey;
        if (d2 > R2) continue;
        if (kin(o, v)) {
          if (v.seen !== stamp) { v.seen = stamp; ku += Math.cos(v.h + v.plan.fAng); kv += Math.sin(v.h + v.plan.fAng); kx += ex; ky += ey; kn++; }
          continue;
        }
        if ((v.count[JAW] || v.count[SPIKE]) && v.mass > o.mass * 0.8) {
          const wt = 1 / (d2 + 100);
          ax -= ex * wt; ay -= ey * wt; fear += wt;
        }
        if (jaws && hungry && d2 < preyD && v.mass < o.mass * 1.5 && v.plan.typ[hi[k]] !== SHELL) {
          preyD = d2; preyX = ex; preyY = ey;
        }
      }
    }
  }
  let ux = 0, uy = 0, best = 0, mode = M_WANDER, urge = 0.55, tx = 0, ty = 0;
  const pull = (vx, vy, wt, m, u) => {
    const L = Math.hypot(vx, vy);
    if (!L || wt <= 0) return;
    ux += (vx / L) * wt; uy += (vy / L) * wt;
    if (wt > best) { best = wt; mode = m; urge = u; tx = vx; ty = vy; }
  };
  if (fear > 0) pull(ax, ay, g.flee * 3 * Math.min(1, fear * 300), M_FLEE, 1.4);
  if (preyD < R2) pull(preyX, preyY, g.prey * 2 * (1.3 - Math.sqrt(preyD) / R), M_HUNT, 1.25);
  if (o.count[FILTER] && g.food > 0.05) {
    const f = nearestFood(x0, y0, Math.min(R, 90));
    if (f) pull(f[0], f[1], g.food * 1.5 * (1.2 - Math.hypot(f[0], f[1]) / 90), M_FORAGE, 0.9);
  }
  if (o.count[PHOTO] && g.light > 0.05 && swims) {
    const here = light[binAt(x0, y0)], up = light[binAt(x0, y0 - R * 0.6)];
    if (up > here * 1.05) pull(0, -1, g.light * 3 * (up - here) / (here + 0.05), M_LIGHT, 0.7);
  }
  if (o.count[HOLD] && o.grown && g.settle > 0.5) pull(0, 1, g.settle * 1.2, M_SETTLE, 0.8);
  if (kn) {
    pull(ku / kn + (kx / kn) * 0.01, kv / kn + (ky / kn) * 0.01, g.school * (0.6 + 0.1 * kn), M_SCHOOL, 0.8);
    if (kn >= 4 && g.school > 0.5 && o.sp.proto.n > 1 && (o.sp.proto.count[FLAG] || o.sp.proto.count[WING]) && o.sp.alive >= 5 && !world.flags.school) {
      first('school', `First school: ${o.sp.name} move together`, o.sp);
    }
  }
  // each body heads back toward the height it is built for; swimmers cannot leave the sea
  const floor = floorAt(x0);
  let home = 30 + g.depth * (floor - 30);
  if (swims && !o.count[WING]) home = Math.max(home, seaY + 12);
  if (!walks) pull(0, home - y0, Math.min(0.6, Math.abs(home - y0) / 300), mode, urge);
  if (best < 0.12) {
    // run and tumble: keep going while income improves, turn when it falls
    if (worse || Math.random() < 0.08) o.want = o.h + pl.fAng + gauss() * 1.4;
    o.mode = M_WANDER; o.urge = 0.55;
    return;
  }
  o.want = Math.atan2(uy, ux);
  o.mode = mode; o.urge = urge; o.tx = x0 + tx; o.ty = y0 + ty;
}

function nearestFood(x, y, R) {
  const span = Math.ceil(R / BIN), bx = Math.min(BW - 1, (x / BIN) | 0), by = clamp((y / BIN) | 0, 0, BH - 1);
  let bd = R * R, best = null;
  for (let dy = -span; dy <= span; dy++) {
    const yy = by + dy;
    if (yy < 0 || yy >= BH) continue;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = fhead[yy * BW + ((bx + dx + BW) % BW)]; k >= 0; k = fnext[k]) {
        if (fe[k] <= 0) continue;
        const ex = wdx(fx[k] - x), ey = fy[k] - y, d2 = ex * ex + ey * ey;
        if (d2 < bd) { bd = d2; best = [ex, ey]; }
      }
    }
  }
  return best;
}

// ---- movement --------------------------------------------------------------------------------------------
// The zygote cell carries the body. In water: propulsion along the way its flagella, fins
// and muscles drive it, buoyancy, and drag toward the current. In air: gravity, lift from
// beating wings, and drag toward the wind. On the ground (land or seabed), legs walk it.
// Other cells spring toward their place relative to their parent, bent by the muscles'
// travelling wave and by the water or wind.
function move(o) {
  const pl = o.plan, g = o.genes, n = pl.n, M = o.mass;
  o.phase += (TAU * (0.3 + 2 * g.f)) / TPS;
  sampleFlow(o.x[0], o.y[0]);
  const wet = o.wet;
  let dx = 0, dy = 0;
  if (!o.anchored) {
    if (wet) {
      if (o.prop) {
        const turn = (0.03 + 0.1 * g.agility + 0.01 * o.count[MUSCLE]) / Math.sqrt(M);
        o.h = angWrap(o.h + clamp(angWrap(o.want - pl.fAng - o.h), -turn, turn));
        const push = (THRUST * o.prop * o.effort) / M, a = o.h + pl.fAng;
        o.vx += Math.cos(a) * push; o.vy += Math.sin(a) * push;
      }
      o.vy -= (BUOY * o.buoy) / M;
      if (!o.prop && !o.count[LEG]) {
        // drifting bodies trim their buoyancy, like plankton, toward the depth they are built
        // for; anything carrying a holdfast sinks to settle on the seabed
        const floor = floorAt(o.x[0]), home = o.count[HOLD] ? floor + 10 : Math.max(seaY + 8, 30 + g.depth * (floor - 30));
        o.vy += TRIM * clamp((home - o.y[0]) / 80, -1, 1) / Math.sqrt(M);
      }
      const k = (DRAG * pl.drag) / Math.pow(M, 0.2);
      o.vx = FU + (o.vx - FU) * (1 - k);
      o.vy = FV + (o.vy - FV) * (1 - k);
    } else {
      o.vy += GRAVITY;
      if (o.count[WING] && !o.ground) {
        // wingbeats lift the body, and part of their force drives it the way it wants to go
        const F = (LIFT * o.count[WING] * o.effort) / M;
        o.vy -= F * 0.8;
        o.vx += Math.cos(o.want) * F * 0.5; o.vy += Math.sin(o.want) * F * 0.5;
        o.h = angWrap(o.h + clamp(angWrap(o.want - pl.fAng - o.h), -0.08, 0.08));
      }
      const k = (AIR_DRAG * pl.drag) / Math.pow(M, 0.2);
      o.vx = FU + (o.vx - FU) * (1 - k);
      o.vy = FV + (o.vy - FV) * (1 - k);
    }
    if (o.ground) {
      const legs = o.count[LEG] + (wet ? 0 : 0.4 * o.count[MUSCLE]);
      if (legs) o.vx += (Math.cos(o.want) >= 0 ? 1 : -1) * (WALK * legs * o.effort) / M;
      o.vx *= 0.82;                                 // friction with the ground
    }
    const sp = Math.hypot(o.vx, o.vy);
    if (sp > VMAX) { o.vx *= VMAX / sp; o.vy *= VMAX / sp; }
    dx = o.vx; dy = o.vy;
    o.x[0] += dx; o.y[0] += dy;
  }
  const amp = 0.6 * g.amp, wave = 1.6 * g.wave, pulse = g.pulse > 0 ? g.pulse * Math.max(0, Math.cos(o.phase)) ** 3 : 0;
  const sway = wet ? SWAY : SWAY * 0.5, sx = (FU - o.vx) * sway, sy = (FV - o.vy) * sway;
  for (let i = 1; i < n; i++) {
    if (!o.on[i]) continue;
    const p = pl.par[i], d = pl.dep[i];
    let base;
    if (p === 0) base = o.h;
    else { const q = pl.par[p]; base = Math.atan2(o.y[p] - o.y[q], o.x[p] - o.x[q]); }
    let a = pl.ang[i];
    if (p === 0 && pulse) a += Math.sign(a) * pulse * 0.7;   // the power stroke sweeps limbs back
    const bend = pl.typ[i] === MUSCLE || pl.typ[p] === MUSCLE ? 1.6 : 1;
    const phi = base + a + amp * bend * (d > 1 ? 1 : 0.5) * Math.sin(o.phase - wave * d);
    const L = pl.len[i] * (0.35 + 0.65 * o.s[i]);
    const x = o.x[i] + dx + sx, y = o.y[i] + dy + sy;
    o.x[i] = x + (o.x[p] + Math.cos(phi) * L - x) * FOLLOW;
    o.y[i] = y + (o.y[p] + Math.sin(phi) * L - y) * FOLLOW;
  }
  // the top of the sky and the ground
  o.ground = false;
  for (let i = 0; i < n; i++) {
    if (!o.on[i]) continue;
    const r = pl.rad[i] * o.s[i], bottom = floorAt(o.x[i]) - r;
    if (o.y[i] < r) { o.y[i] = r; if (i === 0 && o.vy < 0) o.vy = 0; }
    else if (o.y[i] > bottom) {
      o.y[i] = bottom;
      o.ground = true;
      if (i === 0 && o.vy > 0) o.vy = 0;
      if (!o.anchored && pl.typ[i] === HOLD && o.s[i] > 0.8) anchor(o, i);
    }
  }
  // without wings, nothing climbs out of the open sea: the surface holds it in
  if (!o.count[WING] && !o.anchored && floorAt(o.x[0]) > seaY + 2) {
    for (let i = 0; i < n; i++) {
      if (!o.on[i]) continue;
      const top = seaY - pl.rad[i] * o.s[i];
      if (o.y[i] < top) { o.y[i] = top; if (i === 0 && o.vy < 0) o.vy = 0; }
    }
  }
  o.air = !wet && !o.ground ? o.air + 1 : 0;
  const wx = o.x[0] < 0 ? WW : o.x[0] >= WW ? -WW : 0;
  if (wx) for (let i = 0; i < n; i++) o.x[i] += wx;
}

// A holdfast touching the ground takes hold for good. The body turns to grow up and away
// from it, and the creature lives on what reaches it there.
function anchor(o, i) {
  const pl = o.plan;
  o.anchored = true; o.vx = 0; o.vy = 0; o.ay = o.y[i];
  const ang = Math.atan2(pl.cy - pl.ry[i], pl.cx - pl.rx[i]);
  if (Math.hypot(pl.cy - pl.ry[i], pl.cx - pl.rx[i]) > 2) o.h = -Math.PI / 2 - ang;
  let near = 0;
  world.vents.forEach((v, k) => {
    const d = Math.hypot(wdx(o.x[i] - v.x), o.y[i] - v.y), w = Math.exp(-(d * d) / (2 * VENT_R * VENT_R));
    if (w > near) { near = w; o.ventIdx = k; }
  });
  o.vent = near;
}

// ---- contact ------------------------------------------------------------------------------------------
function hashCells() {
  hhead.fill(-1);
  let k = 0;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const pl = o.plan;
    for (let i = 0; i < pl.n && k < HMAX; i++) {
      if (!o.on[i]) continue;
      const x = wrapX(o.x[i]), y = clamp(o.y[i], 0, WH - 0.01), b = ((y / HB) | 0) * HBW + ((x / HB) | 0);
      hx[k] = x; hy[k] = y; hr[k] = pl.rad[i] * o.s[i]; ho[k] = o.slot + 1; hi[k] = i;
      hnext[k] = hhead[b]; hhead[b] = k;
      k++;
    }
  }
  nCells = k;
}

// Cells of different creatures that overlap push apart, and jaws, spikes and filters act.
// Each pair is checked once: within a bucket, then against four of its eight neighbours.
const FWD_X = [1, -1, 0, 1], FWD_Y = [0, 1, 1, 1];
function collide() {
  hashCells();
  const HX = WW / 2;
  for (let by = 0; by < HBH; by++) {
    for (let bx = 0; bx < HBW; bx++) {
      const head = hhead[by * HBW + bx];
      if (head < 0) continue;
      for (let a = head; a >= 0; a = hnext[a]) {
        const ax = hx[a], ay = hy[a], ar = hr[a], ao = ho[a];
        for (let k = -1; k < 4; k++) {
          let b;
          if (k < 0) b = hnext[a];
          else {
            const nx = bx + FWD_X[k], ny = by + FWD_Y[k];
            if (ny >= HBH) continue;
            b = hhead[ny * HBW + (nx < 0 ? nx + HBW : nx >= HBW ? nx - HBW : nx)];
          }
          for (; b >= 0; b = hnext[b]) {
            if (ho[b] === ao) continue;
            let dx = hx[b] - ax;
            if (dx > HX) dx -= WW; else if (dx < -HX) dx += WW;
            const dy = hy[b] - ay, rr = ar + hr[b];
            if (dx * dx + dy * dy < rr * rr) touch(a, b, dx, dy, rr);
          }
        }
      }
    }
  }
}

function touch(a, b, dx, dy, rr) {
  const A = slots[ho[a] - 1], B = slots[ho[b] - 1];
  if (!A || !B || !A.alive || !B.alive) return;
  const ia = hi[a], ib = hi[b];
  if (!A.on[ia] || !B.on[ib]) return;
  const d = Math.sqrt(dx * dx + dy * dy) || 0.01, over = rr - d, nx = dx / d, ny = dy / d;
  let wa = A.anchored ? 0 : B.anchored ? 1 : B.mass / (A.mass + B.mass);
  if (A.anchored && B.anchored) wa = 0.5;
  const wb = 1 - wa, push = over * 0.5;
  A.x[ia] -= nx * push * wa; A.y[ia] -= ny * push * wa;
  B.x[ib] += nx * push * wb; B.y[ib] += ny * push * wb;
  if (!A.anchored) { A.vx -= nx * over * 0.03 * wa; A.vy -= ny * over * 0.03 * wa; }
  if (!B.anchored) { B.vx += nx * over * 0.03 * wb; B.vy += ny * over * 0.03 * wb; }
  const ta = A.plan.typ[ia], tb = B.plan.typ[ib];
  if (ta === JAW || ta === SPIKE) attack(A, ia, B, ib, ta, nx, ny);
  else if (ta === FILTER) graze1(A, B);
  if (!A.alive || !B.alive || !B.on[ib] || !A.on[ia]) return;
  if (tb === JAW || tb === SPIKE) attack(B, ib, A, ia, tb, -nx, -ny);
  else if (tb === FILTER) graze1(B, A);
}

// Filter-feeding bodies sieve lone cells out of the water too, as copepods graze plankton.
function graze1(A, B) {
  if (B.n !== 1 || A.n < 2 || B.mass > A.mass * 0.5 || kin(A, B) || Math.random() > 0.2) return;
  A.E = Math.min(A.cap, A.E + Math.max(0, B.E) * 0.6 + COST[B.plan.typ[0]] * 0.3);
  A.kills++;
  die(B, 'grazed by ' + A.sp.name, false);
}

// The way a cell faces: away from its parent, or the body's heading for the zygote cell.
function faceOf(o, i) {
  if (i === 0) return o.h;
  const p = o.plan.par[i];
  return Math.atan2(o.y[i] - o.y[p], o.x[i] - o.x[p]);
}

function attack(A, ia, B, ib, type, nx, ny) {
  if (kin(A, B)) return;
  if (type === JAW) {
    if (A.full) return;                                          // still swallowing
    const f = faceOf(A, ia);
    if (Math.cos(f) * nx + Math.sin(f) * ny < 0.3) return;     // jaws only bite what is in front
    if (B.n === 1 && A.n > 1 && B.mass < A.mass * 0.25) {         // a lone cell is swallowed whole
      if (Math.random() > BITE_RATE * 2) return;
      A.E = Math.min(A.cap, A.E + Math.max(0, B.E) * 0.8 + B.plan.cost * 0.3);
      A.kills++; world.kills++; A.full = HANDLING;
      die(B, 'swallowed by ' + A.sp.name, false);
      return;
    }
  }
  if (Math.random() > (type === JAW ? BITE_RATE : STING_RATE)) return;
  if (B.mass > A.mass * 1.5 && Math.random() * B.mass > A.mass * 1.5) return; // too big to hurt
  const tb = B.plan.typ[ib];
  if (tb === SHELL && Math.random() < SHELL_BLOCK) return;
  if ((B.hp[ib] -= 1) > 0) return;
  const share = B.E > 0 ? B.E / B.n : 0;
  B.E -= share;
  if (type === JAW) {
    A.E = Math.min(A.cap, A.E + COST[tb] * 0.5 + share * PREY_SHARE);
    A.kills++; world.kills++; A.full = HANDLING;
    B.cause = 'eaten by ' + A.sp.name;
    if (!world.flags.bite && A.sp.proto.n > 1 && A.sp.proto.count[JAW]) first('bite', `First predator: ${A.sp.name} bites into a ${B.sp.name}`, A.sp);
    cutCell(B, ib, false);
  } else {
    B.cause = 'stung by ' + A.sp.name;
    addFood(B.x[ib], B.y[ib], share * 0.8, 0, 0);
    cutCell(B, ib, true);
  }
}

// ---- food -----------------------------------------------------------------------------------------------
// In the sea, plankton blooms in the sunlit water, marine snow and the dead sink and settle on
// the seabed, and vents throw up plumes. In the air, spores ride the wind and drift down;
// litter on land stays where it falls. Everything slowly decays.
function foodStep() {
  let k = 0;
  for (let i = 0; i < nFood; i++) {
    const e = fe[i];
    if (e < 0.15) continue;
    let x = fx[i], y = fy[i], vy = fvy[i];
    const floor = floorAt(x);
    if (y >= floor - 1.5) y = floor - 1;                       // resting on the ground or seabed
    else if (y > seaY) {
      sampleFlow(x, y);
      vy += (SINK - vy) * 0.004;
      x = wrapX(x + FU + (Math.random() - 0.5) * 0.3);
      y += FV + vy + (Math.random() - 0.5) * 0.2;
    } else {
      sampleFlow(x, y);
      vy += ((fk[i] === 3 ? 0.04 : 0.6) - vy) * 0.05;          // spores float, litter falls
      x = wrapX(x + FU + (Math.random() - 0.5) * 0.4);
      y += vy + FV;
    }
    const f2 = floorAt(x);
    if (y > f2 - 1) y = f2 - 1;
    fx[k] = x; fy[k] = Math.max(1, y); fe[k] = e * ROT[fk[i]]; fvy[k] = vy; fk[k] = fk[i];
    k++;
  }
  nFood = k;
  const rate = 2 * P.food;
  for (const v of world.vents) {
    if (Math.random() < VENT_RATE * rate) addFood(v.x + rand(-6, 6), v.y - 3, FOOD_E, 2, rand(-0.9, -0.5));
  }
  for (let j = 0; j < 4; j++) {
    const x = rand(0, WW);
    if (floorAt(x) > seaY + 30) {
      if (Math.random() < SNOW_RATE * rate) addFood(x, seaY + rand(5, 200), FOOD_E, 0, 0);
      // plankton blooms where the sunlit sea is bright
      const y = seaY + rand(4, 240), L = light[binAt(x, y)];
      if (y < floorAt(x) && Math.random() < BLOOM_RATE * rate * L * L) addFood(x, y, FOOD_E, 1, 0.02);
    }
  }
  hashFood();
}

function hashFood() {
  fhead.fill(-1);
  for (let i = 0; i < nFood; i++) {
    const b = binAt(fx[i], fy[i]);
    fnext[i] = fhead[b]; fhead[b] = i;
  }
}

// ---- the world tick ------------------------------------------------------------------------------------
function step() {
  const t = ++world.t;
  tick0();
  if (t % 3 === 0) updateFlow();
  demandPrev.set(demandNow); demandNow.fill(0);
  if (t % 10 === 1) updateLight();
  const orgs = world.orgs;
  for (let i = orgs.length - 1; i > 0; i--) {     // fair turn order
    const j = randi(i + 1), tmp = orgs[i];
    orgs[i] = orgs[j]; orgs[j] = tmp;
  }
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) live(orgs[i]);
  collide();
  let k = 0;
  for (let i = 0; i < orgs.length; i++) if (orgs[i].alive) orgs[k++] = orgs[i];
  orgs.length = k;
  flushBorn();
  foodStep();
  for (let i = world.links.length - 1; i >= 0; i--) if (--world.links[i].t <= 0) world.links.splice(i, 1);
  if (t % 15 === 0) census();
}

// ---- census, ways of life and the record ----------------------------------------------------------------
function ecotypeOf(o) {
  const c = o.count;
  if (o.n === 1) return E_PLANK;
  if (o.anchored) return o.ay < SEA - 4 ? E_PLANT : o.vent > 0.3 ? E_VENT : c[PHOTO] >= c[FILTER] ? E_KELP : E_REEF;
  if (!o.wet) {
    if (c[WING] && o.air > 45) return E_FLY;
    if (o.ground && (c[LEG] || c[MUSCLE])) return E_WALK;
    if (o.ground && c[PHOTO] && floorAt(o.x[0]) < SEA - 4) return E_PLANT; // mats and crusts on dry land
  }
  if (o.prop > 0.5 || (o.ground && c[LEG])) {
    if (c[JAW]) return E_HUNT;
    return o.plan.swim >= 2 || c[LEG] || o.y[0] > floorAt(o.x[0]) - 25 ? E_WORM : E_SWIM;
  }
  if (o.buoy > 0.5 && c[PHOTO]) return E_FLOAT;
  return E_DRIFT;
}

function census() {
  const st = world.stats, F = world.flags, types = st.types, eco = st.eco;
  types.fill(0); eco.fill(0);
  for (const sp of world.species) { sp.cells = 0; (sp.ecoN || (sp.ecoN = new Int32Array(NE))).fill(0); }
  let orgs = 0, cells = 0, sq = 0, multi = 0, maxN = 0, big = null;
  for (const v of world.vents) v.load = 0;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    if (o.anchored && o.ventIdx >= 0 && o.count[HOLD]) world.vents[o.ventIdx].load += o.vent;
    const n = o.n, sp = o.sp;
    orgs++; cells += n; sq += n * n; sp.cells += n;
    for (let t = 0; t < NT; t++) types[t] += o.count[t];
    if (n > maxN) { maxN = n; big = o; }
    if (n > 1) multi++;
    const e = (o.eco = ecotypeOf(o));
    eco[e]++; sp.ecoN[e]++;
  }
  let ecoN = 0;
  for (const sp of world.species) {           // each species' usual way of life
    let best = 0;
    for (let e = 1; e < NE; e++) if (sp.ecoN[e] > sp.ecoN[best]) best = e;
    sp.eco = best;
  }
  // a way of life counts as established once one species lives it with several members
  for (let e = 0; e < NE; e++) {
    let best = null, bn = 0;
    for (const sp of world.species) if (sp.ecoN[e] > bn) { bn = sp.ecoN[e]; best = sp; }
    if (bn >= 5) {
      ecoN++;
      if (!F['eco' + e] && e > E_PLANK) first('eco' + e, `${ECO[e][2]}: ${best.name}`, best);
    }
  }
  for (const k of [5, 10, 20, 30, 40]) {
    if (maxN >= k && !F['size' + k]) first('size' + k, `First ${k}-cell creature: ${big.sp.name}`, big.sp);
  }
  // diversity: the effective number of species, weighted by cells
  let H = 0, multiCells = 0;
  for (const sp of world.species) if (sp.proto.n > 1) multiCells += sp.cells;
  for (const sp of world.species) {
    if (!sp.cells) continue;
    const p = sp.cells / Math.max(1, cells);
    H -= p * Math.log(p);
    // blight: a multicellular species that crowds out the rest sickens (plankton is spared)
    const q = sp.proto.n > 1 && multiCells > 1500 ? sp.cells / multiCells : 0;
    const target = clamp((q - BLIGHT_SHARE) * 3, 0, 1);
    sp.blight += (target - sp.blight) * 0.1;
    if (sp.blight > 0.5 && q > BLIGHT_SHARE && world.t - sp.blightT > 90 * TPS) {
      sp.blightT = world.t;
      logEvent('blight', `Blight sweeps through ${sp.name}, which holds ${Math.round(q * 100)}% of multicellular life`, sp);
    }
  }
  Object.assign(st, {
    orgs, cells, multi, maxN, ecoN, div: Math.exp(H), food: nFood,
    wavg: cells ? sq / cells : 0, species: world.species.size,
  });
  rankSpecies();
  sampleHistory();
  if (!orgs && !F.dead) {
    F.dead = world.t;
    logEvent('extinct', 'All life is extinct. Seed the world or start a new one.');
  } else if (orgs && F.dead) F.dead = 0;
}

function rankSpecies() {
  const list = [...world.species];
  for (const sp of list) sp.mass = sp.cells;
  list.sort((a, b) => b.mass - a.mass);
  world.top = list.slice(0, 8);
  const lead = list[0];
  if (lead && lead.proto.n > 1 && lead !== world.lead && world.t - world.leadT > 60 * TPS) {
    world.lead = lead; world.leadT = world.t;
    logEvent('lead', `New dominant species: ${lead.name}, ${lead.alive} creatures`, lead);
  }
}

function sampleHistory() {
  const h = world.hist;
  if (world.t < h.next) return;
  h.next = world.t + h.every;
  h.t.push(world.t); h.div.push(world.stats.div); h.eco.push(world.stats.ecoN); h.max.push(world.stats.maxN);
  if (h.t.length >= 480) {
    for (const k of ['t', 'div', 'eco', 'max']) h[k] = h[k].filter((_, i) => i % 2 === 0);
    h.every *= 2;
  }
}

function logEvent(kind, text, sp) {
  world.events.unshift({ t: world.t, kind, text, sp: sp || null });
  if (world.events.length > 80) world.events.length = 80;
}
function first(key, text, sp) {
  world.flags[key] = world.t;
  logEvent('first', text, sp);
}

// ---- tools ------------------------------------------------------------------------------------------------
function feedAt(x, y, r, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = Math.sqrt(Math.random()) * r;
    addFood(x + Math.cos(a) * d, y + Math.sin(a) * d, FOOD_E, 0, 0);
  }
}

// Push the water (or air) along the drag. The push spreads a little and fades.
function stirAt(x, y, dx, dy) {
  const L = Math.hypot(dx, dy);
  if (L < 0.5) return;
  world.swirls.push({ x: mod(x, WW), y, r: 60, u: dx / L, v: dy / L, str: clamp(L * 0.08, 0.8, 2.6) });
  if (world.swirls.length > 16) world.swirls.shift();
  updateFlow();
}

function zapAt(x, y, r) {
  const span = Math.ceil(r / HB) + 1, bx = (wrapX(x) / HB) | 0, by = (clamp(y, 0, WH - 1) / HB) | 0;
  for (let dy = -span; dy <= span; dy++) {
    const yy = by + dy;
    if (yy < 0 || yy >= HBH) continue;
    for (let dx = -span; dx <= span; dx++) {
      for (let k = hhead[yy * HBW + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        const o = slots[ho[k] - 1];
        if (!o || !o.alive || !o.on[hi[k]]) continue;
        const ex = wdx(hx[k] - x), ey = hy[k] - y;
        if (ex * ex + ey * ey > r * r) continue;
        o.cause = 'vaporised';
        cutCell(o, hi[k], true);
      }
    }
  }
}

function seedAt(x, y, n) {
  for (let i = 0; i < n; i++) {
    const sp = protoSpecies(Math.random() < 0.6 ? PHOTO : FILTER);
    spawn(sp.proto, randomGenes(), sp, x + rand(-20, 20), y + rand(-20, 20), rand(0, TAU), 4, 0, null);
  }
}

function pickOrg(x, y) {
  let best = null, bd = 14 * 14;
  const bx = (wrapX(x) / HB) | 0, by = (clamp(y, 0, WH - 1) / HB) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    const yy = by + dy;
    if (yy < 0 || yy >= HBH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      for (let k = hhead[yy * HBW + ((bx + dx + HBW) % HBW)]; k >= 0; k = hnext[k]) {
        const ex = wdx(hx[k] - x), ey = hy[k] - y, d2 = ex * ex + ey * ey;
        const o = slots[ho[k] - 1];
        if (d2 < bd && o && o.alive) { bd = d2; best = o; }
      }
    }
  }
  return best;
}

// Biosphere: canvas renderer, side on. A sky that follows the sun (or the moon and stars),
// drifting clouds, the sea with its moving surface and shafts of light, and the land and
// seabed in silhouette. Creatures are drawn in batches: one translucent membrane per
// creature, the cell bodies per species, then each kind of organelle. A downscaled copy of
// the frame added back on top gives the glow, which is stronger at night.

const ACCENT = '#5cf2b6';
const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace';
const view = {
  zoom: 1, cx: WW / 2, cy: WH / 2, cw: 1, ch: 1, dpr: 1, glow: true, currents: false,
  selected: null, follow: false, highlight: null, highlightEco: -1, hover: null, pointer: null, tool: 'inspect', brush: 40,
};
let cv, ctx, bloom, bctx;
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const STARS = Array.from({ length: 140 }, () => [Math.random() * WW, Math.random() * SEA * 0.9, Math.random()]);

function initRender(canvas) {
  cv = canvas;
  ctx = cv.getContext('2d');
  bloom = document.createElement('canvas');
  bctx = bloom.getContext('2d');
}

// ---- view geometry: zoom 1 shows the whole world, sky to seabed ------------------------------------
const viewScale = () => (view.ch / WH) * view.zoom; // css px per unit
function clampView() {
  const halfH = view.ch / 2 / viewScale();
  view.cy = halfH * 2 >= WH ? WH / 2 : clamp(view.cy, halfH, WH - halfH);
  view.cx = mod(view.cx, WW);
}
function screenToWorld(px, py) {
  const sc = viewScale();
  return { x: mod(view.cx + (px - view.cw / 2) / sc, WW), y: view.cy + (py - view.ch / 2) / sc };
}
function resizeView(w, h) {
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.cw = Math.max(1, w); view.ch = Math.max(1, h);
  cv.width = Math.round(view.cw * view.dpr);
  cv.height = Math.round(view.ch * view.dpr);
  bloom.width = Math.max(1, cv.width >> 2);
  bloom.height = Math.max(1, cv.height >> 2);
  clampView();
}
function speciesColors(sp) {
  if (!sp.col) {
    const h = sp.hue.toFixed(0);
    sp.col = { skin: `hsla(${h},70%,56%,0.32)`, body: `hsla(${h},72%,62%,0.9)`, line: `hsl(${h},80%,70%)` };
  }
  return sp.col;
}
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

// The images of a creature on screen, as x offsets: the copy nearest the view centre, plus
// copies across the seam when the window is wider than the world.
const imgX = [];
function images(o, halfW) {
  const pad = o.plan.reach + 12, rx = o.x[0] - view.cx, bx = wdx(rx);
  let n = 0;
  for (let k = -2; k <= 2; k++) {
    const x = bx + k * WW;
    if (x + pad < -halfW || x - pad > halfW) continue;
    imgX[n++] = x - rx;
  }
  return n;
}

// ---- frame ---------------------------------------------------------------------------------------------
const groups = new Map();
function render() {
  const d = view.dpr, sc = viewScale(), S = sc * d, W2 = cv.width / 2, H2 = cv.height / 2;
  const halfW = view.cw / 2 / sc;
  const X = (x, ox) => W2 + (x + ox - view.cx) * S, Y = (y) => H2 + (y - view.cy) * S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  drawSky(S, W2, Y, halfW);
  drawSea(S, W2, Y, halfW);
  if (view.currents) drawCurrents(S, W2, Y, halfW);
  drawFood(S, W2, Y, halfW);

  for (const list of groups.values()) list.length = 0;
  for (const o of world.orgs) {
    if (!o.alive) continue;
    const top = Y(o.y[0] - o.plan.reach - 12), bot = Y(o.y[0] + o.plan.reach + 12);
    if (bot < 0 || top > cv.height) continue;
    const n = images(o, halfW);
    if (!n) continue;
    let list = groups.get(o.sp);
    if (!list) groups.set(o.sp, (list = []));
    for (let k = 0; k < n; k++) list.push(o, imgX[k]);
  }
  const detail = 4.2 * S;
  // each creature's membrane is its own shape: a disc round every cell and a band of tissue
  // to its parent cell, so a body reads as one organism and neighbours stay apart
  for (const [sp, list] of groups) {
    ctx.fillStyle = speciesColors(sp).skin;
    for (let j = 0; j < list.length; j += 2) {
      const o = list[j], ox = list[j + 1], pl = o.plan;
      ctx.beginPath();
      for (let i = 0; i < pl.n; i++) {
        if (!o.on[i]) continue;
        const r = Math.max(1, pl.rad[i] * o.s[i] * S * 1.18), x = X(o.x[i], ox), y = Y(o.y[i]);
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
        if (i === 0) continue;
        const p = pl.par[i], px = X(o.x[p], ox), py = Y(o.y[p]), dx = x - px, dy = y - py, L = Math.hypot(dx, dy);
        if (L < 0.5) continue;
        const nx = -dy / L, ny = dx / L, w = r * 0.62, wp = pl.rad[p] * o.s[p] * S * 0.74;
        ctx.moveTo(px + nx * wp, py + ny * wp);
        ctx.lineTo(x + nx * w, y + ny * w);
        ctx.lineTo(x - nx * w, y - ny * w);
        ctx.lineTo(px - nx * wp, py - ny * wp);
        ctx.closePath();
      }
      ctx.fill();
    }
  }
  if (detail >= 1.6) {
    for (const [sp, list] of groups) {
      if (!list.length) continue;
      ctx.fillStyle = speciesColors(sp).body;
      ctx.beginPath();
      for (let j = 0; j < list.length; j += 2) {
        const o = list[j], ox = list[j + 1], pl = o.plan;
        for (let i = 0; i < pl.n; i++) {
          if (!o.on[i]) continue;
          const r = Math.max(0.6, pl.rad[i] * o.s[i] * S * 0.66), x = X(o.x[i], ox), y = Y(o.y[i]);
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, TAU);
        }
      }
      ctx.fill();
    }
  }
  if (detail >= 2.4) drawOrganelles(S, X, Y);
  drawLand(S, W2, Y, halfW);
  if (view.glow) {
    bctx.globalCompositeOperation = 'copy';
    bctx.drawImage(cv, 0, 0, bloom.width, bloom.height);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (0.32 + 0.35 * (1 - sun)) / Math.sqrt(view.zoom);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  drawOverlay(S, X, Y);
}

// ---- sky, sea and land -----------------------------------------------------------------------------------
const SKY = { night: [[4, 6, 16], [12, 22, 46]], dusk: [[36, 40, 86], [236, 140, 96]], day: [[52, 118, 196], [164, 212, 236]] };
function skyColors() {
  const s = sun;
  if (s < 0.3) { const t = s / 0.3; return [mix(SKY.night[0], SKY.dusk[0], t), mix(SKY.night[1], SKY.dusk[1], t)]; }
  const t = (s - 0.3) / 0.7;
  return [mix(SKY.dusk[0], SKY.day[0], t), mix(SKY.dusk[1], SKY.day[1], t)];
}

function drawSky(S, W2, Y, halfW) {
  const [top, low] = skyColors(), horizon = Y(seaY);
  const g = ctx.createLinearGradient(0, Y(0), 0, horizon);
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(low));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (horizon < 0) return;
  const d = view.dpr;
  // stars come out as the sun goes down
  if (sun < 0.4) {
    ctx.fillStyle = '#ffffff';
    for (const [sx, sy, tw] of STARS) {
      const x = W2 + wdx(sx - view.cx) * S, y = Y(sy);
      if (x < 0 || x > cv.width || y > horizon) continue;
      ctx.globalAlpha = (0.4 - sun) * 2.2 * (0.5 + 0.5 * Math.sin(world.t * 0.05 + tw * 20));
      ctx.fillRect(x, y, d * (tw > 0.85 ? 2 : 1), d * (tw > 0.85 ? 2 : 1));
    }
    ctx.globalAlpha = 1;
  }
  // the sun crosses the sky by day, the moon by night
  if (P.daynight) {
    const ph = dayPhase(), up = Math.sin(TAU * ph) + 0.3;
    // across the window from sunrise (left) to sunset (right), highest at noon
    const arc = (p) => {
      const u = mod(p + 0.048, 1) / 0.596, lift = Math.max(0, Math.sin(TAU * p) + 0.3) / 1.3;
      return [cv.width * (0.05 + 0.9 * u), horizon - lift * (horizon - Y(40))];
    };
    const body = (p, r, col, glow) => {
      const [x, y] = arc(p);
      if (y > horizon + r) return;
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
      gr.addColorStop(0, glow); gr.addColorStop(1, 'rgba(255,220,160,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    };
    if (up > 0) body(ph, 16 * d, '#fff4d6', 'rgba(255,220,150,0.45)');
    else body(mod(ph + 0.5, 1), 10 * d, '#e8eef8', 'rgba(200,215,255,0.25)');
  }
  // clouds, the same ones that dim the light below
  const secs = world.t / TPS, lit = 0.25 + 0.75 * sun;
  for (const c of world.clouds) {
    const x = W2 + wdx(mod(c.x0 + c.v * secs, WW) - view.cx) * S, y = Y(70 + c.w * 0.2), w = c.w * S;
    if (x + w * 1.5 < 0 || x - w * 1.5 > cv.width) continue;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, w);
    gr.addColorStop(0, `rgba(${Math.round(235 * lit)},${Math.round(240 * lit)},${Math.round(250 * lit)},${(0.18 + c.k * 0.5).toFixed(2)})`);
    gr.addColorStop(1, 'rgba(235,240,250,0)');
    ctx.fillStyle = gr;
    ctx.save(); ctx.translate(x, y); ctx.scale(1.6, 0.45); ctx.translate(-x, -y);
    ctx.fillRect(x - w, y - w, w * 2, w * 2);
    ctx.restore();
  }
}

// The sea below its rippling surface, darkening with depth, with shafts of sunlight.
function drawSea(S, W2, Y, halfW) {
  const top = Y(seaY), k = 0.25 + 0.75 * sun;
  if (top > cv.height) return;
  const g = ctx.createLinearGradient(0, top, 0, Y(WH));
  g.addColorStop(0, `rgb(${Math.round(20 * k)},${Math.round(92 * k)},${Math.round(118 * k)})`);
  g.addColorStop(0.25, `rgb(${Math.round(8 * k)},${Math.round(42 * k)},${Math.round(62 * k)})`);
  g.addColorStop(0.6, '#04121c');
  g.addColorStop(1, '#020508');
  ctx.fillStyle = g;
  ctx.beginPath();
  const wave = (x) => top + Math.sin(x * 0.012 + world.t * 0.06) * 1.6 * view.dpr;
  ctx.moveTo(0, cv.height);
  for (let x = 0; x <= cv.width + 12; x += 12) ctx.lineTo(x, wave(x));
  ctx.lineTo(cv.width, cv.height);
  ctx.closePath();
  ctx.fill();
  // light shafts by day
  if (sun > 0.05) {
    ctx.globalCompositeOperation = 'lighter';
    const t = world.t / TPS, ye = Y(seaY + 300);
    for (let i = 0; i < 10; i++) {
      const base = (i / 10) * WW + 40 * Math.sin(t * 0.05 + i * 1.7), dx = wdx(base - view.cx);
      if (Math.abs(dx) > halfW + 200 || floorAt(base) < seaY) continue;
      const x0 = W2 + dx * S, w = (22 + 16 * Math.sin(i * 3.1)) * S, slant = 90 * S;
      const gr = ctx.createLinearGradient(0, top, 0, ye);
      gr.addColorStop(0, `rgba(170,230,255,${(0.06 * sun).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(170,230,255,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(x0, top); ctx.lineTo(x0 + w, top); ctx.lineTo(x0 + w * 2.4 + slant, ye); ctx.lineTo(x0 + slant, ye);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // the surface itself
  ctx.strokeStyle = `rgba(200,240,255,${(0.2 + 0.25 * sun).toFixed(2)})`;
  ctx.lineWidth = view.dpr;
  ctx.beginPath();
  for (let x = 0; x <= cv.width + 12; x += 12) x ? ctx.lineTo(x, wave(x)) : ctx.moveTo(x, wave(x));
  ctx.stroke();
}

function drawCurrents(S, W2, Y, halfW) {
  ctx.strokeStyle = 'rgba(200,225,245,0.14)';
  ctx.lineWidth = view.dpr;
  ctx.beginPath();
  const step = 40, x0 = Math.floor((view.cx - halfW) / step) * step;
  for (let y = 20; y < WH; y += step) {
    for (let x = x0; x <= view.cx + halfW + step; x += step) {
      if (y > floorAt(x)) continue;
      sampleFlow(x, y);
      const sx = W2 + (x - view.cx) * S, sy = Y(y);
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + FU * 30 * S, sy + FV * 30 * S);
    }
  }
  ctx.stroke();
}

const FOOD_COL = ['rgba(225,215,200,0.55)', 'rgba(140,240,170,0.6)', 'rgba(255,170,90,0.7)', 'rgba(255,245,170,0.75)'];
function drawFood(S, W2, Y, halfW) {
  const d = view.dpr, r = clamp(0.8 * S, 0.7 * d, 2.4 * d), round = r > 1.6 * d;
  for (let kind = 0; kind < 4; kind++) {
    ctx.fillStyle = FOOD_COL[kind];
    ctx.beginPath();
    for (let i = 0; i < nFood; i++) {
      if (fk[i] !== kind) continue;
      const dx = wdx(fx[i] - view.cx);
      if (dx < -halfW || dx > halfW) continue;
      const x = W2 + dx * S, y = Y(fy[i]);
      if (y < -4 || y > cv.height + 4) continue;
      if (round) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); } else ctx.rect(x - r, y - r, r * 2, r * 2);
    }
    ctx.fill();
  }
}

// The ground in silhouette: earthy where it stands above the sea, dark below, rim-lit, with
// vents glowing on the deep seabed.
function drawLand(S, W2, Y, halfW) {
  const step = Math.max(2, 3 / S) | 0, x0 = Math.floor(view.cx - halfW) - step, x1 = Math.ceil(view.cx + halfW) + step;
  const k = 0.3 + 0.7 * sun, sea = Y(seaY);
  ctx.beginPath();
  ctx.moveTo(W2 + (x0 - view.cx) * S, cv.height + 2);
  for (let x = x0; x <= x1; x += step) ctx.lineTo(W2 + (x - view.cx) * S, Y(floorAt(x)));
  ctx.lineTo(W2 + (x1 - view.cx) * S, cv.height + 2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, Y(150), 0, Y(WH));
  const f = (v) => Math.round(v * k);
  const span = Math.max(1, Y(WH) - Y(150)), at = clamp((sea - Y(150)) / span, 0.01, 0.98);
  g.addColorStop(0, `rgb(${f(58)},${f(66)},${f(42)})`);
  g.addColorStop(at - 0.005, `rgb(${f(40)},${f(46)},${f(32)})`);
  g.addColorStop(at + 0.005, '#0c1a22');
  g.addColorStop(1, '#04080b');
  ctx.fillStyle = g;
  ctx.fill();
  // grass and rock edges catch the light above the sea; the seabed has a faint rim
  ctx.lineWidth = 1.5 * view.dpr;
  for (const [above, col] of [[true, `rgba(${f(150)},${f(190)},${f(110)},0.7)`], [false, 'rgba(120,180,200,0.22)']]) {
    ctx.strokeStyle = col;
    ctx.beginPath();
    let pen = false;
    for (let x = x0; x <= x1; x += step) {
      const fy = floorAt(x), ok = above ? fy < seaY : fy >= seaY, sx = W2 + (x - view.cx) * S, sy = Y(fy);
      if (!ok) { pen = false; continue; }
      pen ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      pen = true;
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const v of world.vents) {
    const dx = wdx(v.x - view.cx);
    if (Math.abs(dx) > halfW + 60) continue;
    const x = W2 + dx * S, y = Y(v.y), r = 34 * S, pulse = 0.75 + 0.25 * Math.sin(world.t * 0.07 + v.x);
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, r);
    g2.addColorStop(0, `rgba(255,170,90,${(0.5 * pulse).toFixed(3)})`);
    g2.addColorStop(0.4, `rgba(255,110,60,${(0.14 * pulse).toFixed(3)})`);
    g2.addColorStop(1, 'rgba(255,90,50,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---- organelles, one batch per kind across every visible creature ------------------------------------------
function drawOrganelles(S, X, Y) {
  const lists = [...groups.values()];
  const each = (type, fn) => {
    for (const list of lists) {
      for (let j = 0; j < list.length; j += 2) {
        const o = list[j], ox = list[j + 1], pl = o.plan;
        if (!o.count[type]) continue;
        for (let i = 0; i < pl.n; i++) if (o.on[i] && pl.typ[i] === type) fn(o, i, X(o.x[i], ox), Y(o.y[i]), pl.rad[i] * o.s[i] * S);
      }
    }
  };
  const face = (o, i) => (i === 0 ? o.h : Math.atan2(o.y[i] - o.y[o.plan.par[i]], o.x[i] - o.x[o.plan.par[i]]));
  ctx.lineCap = 'round';
  // wings: translucent vanes that beat
