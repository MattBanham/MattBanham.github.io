  ctx.fillStyle = rgba(TYPES[WING].rgb, 0.45);
  ctx.beginPath();
  each(WING, (o, i, x, y, r) => {
    const a = face(o, i) + Math.sin(o.phase * 2) * 0.5, c = Math.cos(a), s = Math.sin(a), L = r * 3.2;
    ctx.moveTo(x - s * r * 0.6, y + c * r * 0.6);
    ctx.quadraticCurveTo(x + c * L * 0.6 - s * r * 1.6, y + s * L * 0.6 + c * r * 1.6, x + c * L, y + s * L);
    ctx.lineTo(x + s * r * 0.6, y - c * r * 0.6);
    ctx.closePath();
  });
  ctx.fill();
  // legs: a pair of jointed limbs reaching down, stepping as the body walks
  ctx.strokeStyle = rgba(TYPES[LEG].rgb, 0.85);
  ctx.lineWidth = Math.max(0.8, 0.7 * S);
  ctx.beginPath();
  each(LEG, (o, i, x, y, r) => {
    for (const side of [-1, 1]) {
      const st = Math.sin(o.phase * 2 + side * 1.5) * r * 0.9;
      ctx.moveTo(x, y);
      ctx.lineTo(x + side * r * 1.1 + st * 0.5, y + r * 1.2);
      ctx.lineTo(x + side * r * 1.4 + st, y + r * 2.4);
    }
  });
  ctx.stroke();
  // flagella: beating whips
  ctx.strokeStyle = rgba(TYPES[FLAG].rgb, 0.85);
  ctx.lineWidth = Math.max(0.8, 0.9 * S);
  ctx.beginPath();
  each(FLAG, (o, i, x, y, r) => {
    const a = i === 0 ? o.h + Math.PI : face(o, i), c = Math.cos(a), s = Math.sin(a), L = r * 3.4;
    const wob = Math.sin(o.phase * 1.7 + i) * r * 1.3, x1 = x + c * r, y1 = y + s * r;
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(x1 + c * L * 0.5 - s * wob, y1 + s * L * 0.5 + c * wob, x1 + c * L + s * wob * 0.6, y1 + s * L - c * wob * 0.6);
  });
  ctx.stroke();
  // filter cells: a fringe of cilia
  ctx.strokeStyle = rgba(TYPES[FILTER].rgb, 0.6);
  ctx.lineWidth = Math.max(0.6, 0.45 * S);
  ctx.beginPath();
  each(FILTER, (o, i, x, y, r) => {
    const a0 = face(o, i), wav = Math.sin(o.phase * 2 + i) * 0.25;
    for (let k = -2; k <= 2; k++) {
      const a = a0 + k * 0.45 + wav;
      ctx.moveTo(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9);
      ctx.lineTo(x + Math.cos(a) * r * 1.9, y + Math.sin(a) * r * 1.9);
    }
  });
  ctx.stroke();
  // holdfasts: rootlets
  ctx.strokeStyle = rgba(TYPES[HOLD].rgb, 0.75);
  ctx.lineWidth = Math.max(0.7, 0.6 * S);
  ctx.beginPath();
  each(HOLD, (o, i, x, y, r) => {
    for (let k = -1; k <= 1; k++) {
      const a = Math.PI / 2 + k * 0.6;
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * r * 2 + k * r * 0.3, y + Math.sin(a) * r * 2);
    }
  });
  ctx.stroke();
  // muscles: a band across the body
  ctx.strokeStyle = rgba(TYPES[MUSCLE].rgb, 0.9);
  ctx.lineWidth = Math.max(0.8, 1.1 * S);
  ctx.beginPath();
  each(MUSCLE, (o, i, x, y, r) => {
    const a = face(o, i) + Math.PI / 2, c = Math.cos(a) * r * 0.75, s = Math.sin(a) * r * 0.75;
    ctx.moveTo(x - c, y - s); ctx.lineTo(x + c, y + s);
  });
  ctx.stroke();
  // shells: a bright rim
  ctx.strokeStyle = rgba(TYPES[SHELL].rgb, 0.9);
  ctx.lineWidth = Math.max(0.8, 1.1 * S);
  ctx.beginPath();
  each(SHELL, (o, i, x, y, r) => { ctx.moveTo(x + r * 1.02, y); ctx.arc(x, y, r * 1.02, 0, TAU); });
  ctx.stroke();
  // spikes and jaws
  ctx.fillStyle = rgba(TYPES[SPIKE].rgb, 0.9);
  ctx.beginPath();
  each(SPIKE, (o, i, x, y, r) => {
    const a = face(o, i), c = Math.cos(a), s = Math.sin(a);
    ctx.moveTo(x - s * r * 0.55, y + c * r * 0.55);
    ctx.lineTo(x + c * r * 2.3, y + s * r * 2.3);
    ctx.lineTo(x + s * r * 0.55, y - c * r * 0.55);
    ctx.closePath();
  });
  ctx.fill();
  ctx.fillStyle = rgba(TYPES[JAW].rgb, 0.95);
  ctx.beginPath();
  each(JAW, (o, i, x, y, r) => {
    const a = face(o, i), snap = o.full ? 0.15 : 0.45 + 0.15 * Math.sin(o.phase * 3);
    for (const side of [-1, 1]) {
      const b = a + side * snap, c = Math.cos(b), s = Math.sin(b);
      ctx.moveTo(x + c * r * 0.6 - s * side * r * 0.35, y + s * r * 0.6 + c * side * r * 0.35);
      ctx.lineTo(x + c * r * 2, y + s * r * 2);
      ctx.lineTo(x + c * r * 0.6 + s * side * r * 0.1, y + s * r * 0.6 - c * side * r * 0.1);
      ctx.closePath();
    }
  });
  ctx.fill();
  // chloroplasts, filter cores, eyes, holdfast cores
  for (const [type, k, col] of [[PHOTO, 0.42, rgba(TYPES[PHOTO].rgb, 0.95)], [FILTER, 0.45, rgba(TYPES[FILTER].rgb, 0.95)], [EYE, 0.55, rgba(TYPES[EYE].rgb, 1)], [HOLD, 0.45, rgba(TYPES[HOLD].rgb, 0.95)], [LEG, 0.4, rgba(TYPES[LEG].rgb, 0.95)]]) {
    ctx.fillStyle = col;
    ctx.beginPath();
    each(type, (o, i, x, y, r) => { ctx.moveTo(x + r * k, y); ctx.arc(x, y, r * k, 0, TAU); });
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(8,10,16,0.92)';
  ctx.beginPath();
  each(EYE, (o, i, x, y, r) => {
    const a = o.mode >= M_FORAGE && o.mode <= M_SCHOOL ? Math.atan2(o.ty - o.y[i], wdx(o.tx - o.x[i])) : o.h + o.plan.fAng;
    const px = x + Math.cos(a) * r * 0.24, py = y + Math.sin(a) * r * 0.24;
    ctx.moveTo(px + r * 0.27, py);
    ctx.arc(px, py, r * 0.27, 0, TAU);
  });
  ctx.fill();
}

// ---- overlay ------------------------------------------------------------------------------------------------
const MODE_COLOR = ['', '', '', '#ffc45c', '#ff5454', '#eef3ff', '#5cf2b6', '#5ac8ff', '#be915f', ''];
function bounds(o) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const pl = o.plan;
  for (let i = 0; i < pl.n; i++) {
    if (!o.on[i]) continue;
    const r = pl.rad[i] * o.s[i];
    x0 = Math.min(x0, o.x[i] - r); x1 = Math.max(x1, o.x[i] + r);
    y0 = Math.min(y0, o.y[i] - r); y1 = Math.max(y1, o.y[i] + r);
  }
  return { x0, y0, x1, y1 };
}
function bracket(x0, y0, x1, y1, L) {
  ctx.beginPath();
  ctx.moveTo(x0, y0 + L); ctx.lineTo(x0, y0); ctx.lineTo(x0 + L, y0);
  ctx.moveTo(x1 - L, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + L);
  ctx.moveTo(x1, y1 - L); ctx.lineTo(x1, y1); ctx.lineTo(x1 - L, y1);
  ctx.moveTo(x0 + L, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - L);
  ctx.stroke();
}
function drawTag(text, x, y, color) {
  const d = view.dpr;
  ctx.font = `${10 * d}px ${MONO}`;
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(3,7,12,0.7)';
  ctx.fillRect(x - 2 * d, y - 12 * d, ctx.measureText(text).width + 4 * d, 13 * d);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawOverlay(S, X, Y) {
  const d = view.dpr;
  const near = (o) => wdx(o.x[0] - view.cx) - (o.x[0] - view.cx); // offset to the nearest copy
  ctx.lineWidth = d;
  for (const L of world.links) {
    if (!L.a.alive || !L.b.alive) continue;
    const ox = near(L.a);
    ctx.strokeStyle = `rgba(255,170,220,${((L.t / 20) * 0.7).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(X(L.a.x[0], ox), Y(L.a.y[0]));
    ctx.lineTo(X(L.a.x[0] + wdx(L.b.x[0] - L.a.x[0]), ox), Y(L.b.y[0]));
    ctx.stroke();
  }
  const hl = view.highlight, he = view.highlightEco;
  if ((hl && hl.alive > 0) || he >= 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    let k = 0;
    for (const o of world.orgs) {
      if (!o.alive || (hl ? o.sp !== hl : o.eco !== he)) continue;
      const x = X(o.x[0], near(o)), y = Y(o.y[0]), r = (o.plan.reach + 6) * S;
      if (x < -r || y < -r || x > cv.width + r || y > cv.height + r) continue;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.stroke();
      if (++k >= 300) break;
    }
  }
  const o = view.selected;
  if (o && o.alive) {
    const ox = near(o), b = bounds(o), pad = 5 * d;
    const x0 = X(b.x0, ox) - pad, y0 = Y(b.y0) - pad, x1 = X(b.x1, ox) + pad, y1 = Y(b.y1) + pad;
    const cx = X(o.x[0], ox), cy = Y(o.y[0]);
    if (!o.anchored) {
      ctx.setLineDash([3 * d, 5 * d]);
      ctx.strokeStyle = 'rgba(236,242,255,0.25)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(SENSE_MAX, SENSE_BASE + SENSE_EYE * o.count[EYE]) * S, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      if (o.mode >= M_FORAGE && MODE_COLOR[o.mode]) {
        ctx.strokeStyle = MODE_COLOR[o.mode];
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + wdx(o.tx - o.x[0]) * S, cy + (o.ty - o.y[0]) * S);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 1.5 * d;
    bracket(x0, y0, x1, y1, Math.max(4 * d, Math.min(12 * d, (x1 - x0) / 3)));
    drawTag(o.sp.name.toUpperCase(), x0, y0 - 6 * d, ACCENT);
  }
  const h = view.hover;
  if (h && h.alive && h !== o && view.tool === 'inspect') {
    const ox = near(h), b = bounds(h), pad = 4 * d;
    ctx.strokeStyle = 'rgba(230,237,247,0.6)';
    ctx.lineWidth = d;
    bracket(X(b.x0, ox) - pad, Y(b.y0) - pad, X(b.x1, ox) + pad, Y(b.y1) + pad, 5 * d);
    drawTag(`${h.sp.name} · ${ECO[h.eco][0].toLowerCase()} · ${h.n}`, X(b.x0, ox) - pad, Y(b.y0) - pad - 4 * d, 'rgba(230,237,247,0.85)');
  }
  const p = view.pointer;
  if (p && view.tool !== 'inspect') {
    const r = (view.tool === 'zap' ? 14 : view.tool === 'seed' ? 20 : view.brush) * S;
    ctx.strokeStyle = view.tool === 'zap' ? 'rgba(205,195,255,0.8)' : 'rgba(230,237,247,0.5)';
    ctx.lineWidth = d;
    ctx.beginPath();
    ctx.arc(cv.width / 2 + wdx(p.x - view.cx) * S, Y(p.y), r, 0, TAU);
    ctx.stroke();
  }
}

// A small picture of a species' founding body at rest, for the HUD. Cached on the species.
function glyph(sp, size) {
  const key = 'g' + size;
  if (sp[key]) return sp[key];
  const d = Math.max(1, view.dpr), c = document.createElement('canvas'), pl = sp.proto;
  c.width = c.height = Math.round(size * d);
  const g = c.getContext('2d'), span = Math.max(12, pl.reach * 2.4), k = c.width / span;
  const rot = -Math.PI / 2 - (pl.pMag > 0.05 ? pl.fAng : 0);
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const P2 = (i) => [c.width / 2 + ((pl.rx[i] - pl.cx) * cr - (pl.ry[i] - pl.cy) * sr) * k, c.height / 2 + ((pl.rx[i] - pl.cx) * sr + (pl.ry[i] - pl.cy) * cr) * k];
  const col = speciesColors(sp);
  for (const [style, f] of [[col.skin, 1.3], [col.body, 0.72]]) {
    g.fillStyle = style;
    g.beginPath();
    for (let i = 0; i < pl.n; i++) {
      const [x, y] = P2(i), r = pl.rad[i] * k * f;
      g.moveTo(x + r, y);
      g.arc(x, y, r, 0, TAU);
    }
    g.fill();
  }
  for (let i = 0; i < pl.n; i++) {
    const t = pl.typ[i], [x, y] = P2(i), r = pl.rad[i] * k;
    g.fillStyle = g.strokeStyle = rgba(TYPES[t].rgb, 0.95);
    g.beginPath();
    if (t === SHELL) { g.lineWidth = Math.max(1, r * 0.3); g.arc(x, y, r, 0, TAU); g.stroke(); continue; }
    if (t === FLAG || t === WING) {
      const [px, py] = i === 0 ? [x, y - r] : P2(pl.par[i]), a = Math.atan2(y - py, x - px);
      g.lineWidth = Math.max(1, r * (t === WING ? 0.6 : 0.25));
      g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 3, y + Math.sin(a) * r * 3);
      g.stroke();
      continue;
    }
    g.arc(x, y, r * (t === SPIKE || t === JAW ? 0.6 : 0.45), 0, TAU);
    g.fill();
  }
  sp[key] = c;
  return c;
}

// Biosphere: controls, HUD and the main loop.

const SPEEDS = [0.5, 1, 2, 4, 8, 16];
const TOOL_KEYS = ['inspect', 'feed', 'stir', 'zap', 'seed'];
const TOOL_HINTS = {
  inspect: 'Click a creature to inspect it · drag to pan · scroll to zoom · N toggles day and night · H hides the HUD',
  feed: 'Drag to scatter food',
  stir: 'Drag to push the water or the wind',
  zap: 'Drag to vaporise cells · whatever grew from a lost cell goes with it',
  seed: 'Click to release a cluster of lone cells',
};
const $ = (id) => document.getElementById(id);
const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let running = true, speed = 1, acc = 0, last = 0, hudWait = 0, hintWait = 0, pointer = null, logKey = '';

function clockText(secs) {
  const s = Math.floor(secs), h = Math.floor(s / 3600);
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// What a body plan lives on, and what else it carries.
function roleOf(pl) {
  const c = pl.count, food = [];
  if (c[PHOTO]) food.push('light');
  if (c[FILTER]) food.push('drifting food');
  if (c[JAW]) food.push('prey');
  if (c[HOLD] && !food.length) food.push('the vents');
  const mods = [];
  if (pl.pMag > 0.5) mods.push(pl.swim >= 3 ? 'undulating' : 'swimming');
  if (c[WING]) mods.push('winged');
  if (c[LEG]) mods.push('legged');
  if (c[EYE]) mods.push('sighted');
  if (c[SHELL]) mods.push('armoured');
  if (c[SPIKE]) mods.push('spined');
  if (c[HOLD]) mods.push('rooting');
  return `Lives on ${food.join(' + ') || 'nothing yet'}${mods.length ? ' · ' + mods.join(', ') : ''}`;
}

function gaitOf(o) {
  if (o.anchored) return o.ay < SEA - 4 ? 'rooted on land' : 'anchored';
  if (!o.wet && o.count[WING] && o.air > 10) return 'flies';
  if (o.ground && (o.count[LEG] || (!o.wet && o.count[MUSCLE]))) return 'walks';
  if (!o.wet) return o.ground ? 'stranded' : 'falling';
  if (!o.prop) return 'drifts';
  if (o.plan.swim >= 3) return 'undulates';
  return o.genes.pulse > 0.5 ? 'pulses' : 'glides';
}

const statusOf = (o) => (o.alive ? MODE_NAMES[o.mode] : 'Dead · ' + o.cause);

// ---- controls ----------------------------------------------------------------------------------
function setRunning(on) {
  running = on;
  const b = $('play');
  b.textContent = on ? 'Pause' : 'Play';
  b.title = `${on ? 'Pause' : 'Play'} (Space)`;
  b.classList.toggle('on', !on);
}
function setSpeed(i) {
  speed = clamp(i, 0, SPEEDS.length - 1);
  document.querySelectorAll('[data-speed]').forEach((b) => b.classList.toggle('on', +b.dataset.speed === speed));
}
function setTool(name) {
  view.tool = name;
  document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === name));
  $('view').style.cursor = name === 'inspect' ? 'default' : 'crosshair';
  showHint(TOOL_HINTS[name]);
}
function showHint(text) {
  $('hint').textContent = text;
  $('hint').classList.add('show');
  hintWait = 7;
}
function toggle(key) {
  view[key] = !view[key];
  $(key === 'glow' ? 't-glow' : 't-flow').classList.toggle('on', view[key]);
}
function toggleDay() {
  P.daynight = !P.daynight;
  $('t-day').classList.toggle('on', P.daynight);
  tick0();
  updateLight();
  showHint(P.daynight ? 'Day and night: the sun rises and sets, and light-feeders rest at night' : 'Constant light: an endless, even day');
}
// Which part of the day it is.
function dayText() {
  if (!P.daynight) return 'constant light';
  const ph = dayPhase(), n = Math.floor(world.t / TPS / DAY + 0.12) + 1;
  const part = ph > 0.95 || ph < 0.02 ? 'dawn' : ph < 0.2 ? 'morning' : ph < 0.3 ? 'noon' : ph < 0.47 ? 'afternoon' : ph < 0.55 ? 'dusk' : 'night';
  return `day ${n} · ${part}`;
}
function fitView() { view.zoom = 1; clampView(); }
function newWorld() {
  resetWorld();
  select(null);
  view.highlight = null; view.highlightEco = -1; logKey = '';
  updateHud();
}
function select(o) {
  view.selected = o;
  if (!o) { view.follow = false; $('i-follow').checked = false; }
  updateInspector();
}

function bindControls() {
  document.querySelectorAll('[data-speed]').forEach((b) => (b.onclick = () => setSpeed(+b.dataset.speed)));
  document.querySelectorAll('[data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
  $('play').onclick = () => setRunning(!running);
  $('new').onclick = newWorld;
  $('t-glow').onclick = () => toggle('glow');
  $('t-flow').onclick = () => toggle('currents');
  $('t-day').onclick = toggleDay;
  $('i-close').onclick = () => select(null);
  $('i-follow').onchange = (e) => {
    view.follow = e.target.checked;
    if (view.follow && view.zoom < 2.5) view.zoom = 3;
  };
  $('p-light').oninput = (e) => { P.light = e.target.value / 100; updateLight(); };
  $('p-food').oninput = (e) => { P.food = e.target.value / 100; };
  $('p-mut').oninput = (e) => { P.mutation = e.target.value / 100; };
  // Buttons drop focus after a click, so Space and the shortcuts keep working.
  document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });
  $('legend').innerHTML = TYPES.map((T) =>
    `<li title="${T.name}: ${T.role}"><i style="background:rgb(${T.rgb});box-shadow:0 0 5px rgb(${T.rgb})"></i>${T.name}</li>`).join('');
  $('ecos').innerHTML = ECO.map(([name, desc], e) =>
    `<li data-eco="${e}" title="${name}: ${desc}. Click to highlight."><span>${name}</span><u><i></i></u><b>0</b></li>`).join('');
  $('ecos').querySelectorAll('li').forEach((li) => {
    li.onclick = () => {
      const e = +li.dataset.eco;
      view.highlightEco = view.highlightEco === e ? -1 : e;
      view.highlight = null;
      updateHud();
    };
  });
  $('i-genes').innerHTML = GENES.map(([k, name]) => `<div class="gene"><span>${name}</span><u><i data-gene="${k}"></i></u></div>`).join('');
  const ol = $('species');
  for (let i = 0; i < 6; i++) {
    const li = document.createElement('li');
    li.innerHTML = '<canvas width="56" height="56"></canvas><div class="f-txt"><b></b><span></span></div><em></em>';
    li.title = 'Highlight this species in the ocean';
    li.onclick = () => {
      if (!li.sp) return;
      view.highlight = view.highlight === li.sp ? null : li.sp;
      view.highlightEco = -1;
      updateHud();
    };
    ol.appendChild(li);
  }
}

function bindKeys() {
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.type === 'range' && e.key.startsWith('Arrow')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === ' ') setRunning(!running);
    else if (k >= '1' && k <= '5') setTool(TOOL_KEYS[+k - 1]);
    else if (k === 'r') newWorld();
    else if (k === 'f') fitView();
    else if (k === 'g') toggle('glow');
    else if (k === 'c') toggle('currents');
    else if (k === 'n') toggleDay();
    else if (k === 'h') document.body.classList.toggle('bare');
    else if (k === '+' || k === '=' || k === ']') setSpeed(speed + 1);
    else if (k === '-' || k === '_' || k === '[') setSpeed(speed - 1);
    else if (k === '.' && !running) step();
    else if (k === 'Escape') { select(null); view.highlight = null; view.highlightEco = -1; }
    else return;
    e.preventDefault();
  });
}

// ---- pointer -------------------------------------------------------------------------------------
function bindPointer() {
  const el = $('view');
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    const pan = { mode: 'pan', x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: 0, clear: false };
    if (e.button !== 0 || e.shiftKey) pointer = pan;
    else if (view.tool === 'inspect') {
      const o = pickOrg(w.x, w.y);
      if (o) { select(o); pointer = null; } else pointer = Object.assign(pan, { clear: true });
    } else {
      pointer = { mode: 'tool', wait: 0, px: e.clientX, py: e.clientY };
      useTool(w, 0, true);
    }
  });
  el.addEventListener('pointermove', (e) => {
    const w = screenToWorld(e.offsetX, e.offsetY);
    view.pointer = w;
    if (pointer && pointer.mode === 'pan') {
      const sc = viewScale();
      pointer.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      view.cx = pointer.cx - (e.clientX - pointer.x) / sc;
      view.cy = pointer.cy - (e.clientY - pointer.y) / sc;
      clampView();
      if (pointer.moved > 4) view.follow = $('i-follow').checked = false;
    } else if (pointer && pointer.mode === 'tool' && view.tool === 'stir') {
      const sc = viewScale();
      stirAt(w.x, w.y, (e.clientX - pointer.px) / sc, (e.clientY - pointer.py) / sc);
      pointer.px = e.clientX; pointer.py = e.clientY;
    } else if (!pointer && view.tool === 'inspect') view.hover = pickOrg(w.x, w.y);
  });
  const end = () => {
    if (pointer && pointer.mode === 'pan' && pointer.clear && pointer.moved <= 4) select(null);
    pointer = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (!pointer) view.pointer = view.hover = null; });
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const sc0 = viewScale(), mx = e.offsetX - view.cw / 2, my = e.offsetY - view.ch / 2;
    view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0015), 1, 12);
    const sc1 = viewScale();
    view.cx += mx / sc0 - mx / sc1;
    view.cy += my / sc0 - my / sc1;
    clampView();
  }, { passive: false });
}

function useTool(w, dt, first) {
  if (view.tool === 'feed') feedAt(w.x, w.y, view.brush, first ? 12 : Math.ceil(90 * dt));
  else if (view.tool === 'zap') zapAt(w.x, w.y, 14);
  else if (view.tool === 'seed' && (first || (pointer.wait += dt) > 0.3)) {
    pointer.wait = 0;
    seedAt(w.x, w.y, 8);
  }
}

// ---- HUD ---------------------------------------------------------------------------------------
function setText(id, v) {
  const el = $(id);
  if (el.textContent !== v) el.textContent = v;
}

function updateHud() {
  const st = world.stats;
  const live = ECO.map((_, e) => st.eco[e] >= 5);
  setText('eco-num', `${live.filter(Boolean).length} / ${NE}`);
  document.querySelectorAll('#eco-track i').forEach((el, i) => el.classList.toggle('on', live[i]));
  setText('eco-desc', ECO.filter((_, e) => live[e]).map(([n]) => n.toLowerCase()).join(' · ') || 'life is gone');
  setText('clock', 'T+' + clockText(world.t / TPS));
  setText('daytime', dayText());
  setText('s-orgs', fmtInt(st.orgs));
  setText('s-cells', fmtInt(st.cells));
  setText('s-species', fmtInt(st.species));
  setText('s-div', st.div.toFixed(1));
  setText('s-max', String(st.maxN));
  const most = Math.max(1, ...st.eco);
  $('ecos').querySelectorAll('li').forEach((li, e) => {
    li.querySelector('b').textContent = fmtInt(st.eco[e]);
    li.querySelector('i').style.width = ((100 * st.eco[e]) / most).toFixed(1) + '%';
    li.classList.toggle('live', live[e]);
    li.classList.toggle('on', view.highlightEco === e);
  });
  updateForms();
  updateInspector();
  updateLog();
  drawChart();
}

function updateForms() {
  const top = world.top.slice(0, 6);
  $('species').querySelectorAll('li').forEach((li, i) => {
    const sp = top[i];
    li.hidden = !sp;
    if (!sp) { li.sp = null; return; }
    if (li.sp !== sp) {
      li.sp = sp;
      const c = li.querySelector('canvas'), g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.drawImage(glyph(sp, 28), 0, 0, c.width, c.height);
      li.querySelector('b').textContent = sp.name;
    }
    let e = sp.eco ?? 0;
    li.querySelector('span').textContent = `${sp.proto.n} ${sp.proto.n === 1 ? 'cell' : 'cells'} · ${ECO[e][0].toLowerCase()}`;
    li.querySelector('em').textContent = '×' + fmtInt(sp.alive);
    li.classList.toggle('on', view.highlight === sp);
  });
}

function updateInspector() {
  const o = view.selected, card = $('inspector');
  card.hidden = !o;
  $('right').classList.toggle('inspecting', !!o);
  if (!o) return;
  const pl = o.plan;
  if (card.o !== o) {
    card.o = o;
    const c = $('i-glyph'), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(glyph(o.sp, 48), 0, 0, c.width, c.height);
    $('i-name').textContent = o.sp.name;
    $('i-role').textContent = roleOf(pl);
    document.querySelectorAll('[data-gene]').forEach((el) => { el.style.width = (o.genes[el.dataset.gene] * 100).toFixed(0) + '%'; });
  }
  const status = $('i-status');
  status.textContent = statusOf(o);
  status.style.color = o.alive ? MODE_COLOR[o.mode] || 'var(--ink)' : 'var(--coral)';
  $('i-energy').style.width = (o.alive ? clamp(o.E / o.cap, 0, 1) * 100 : 0) + '%';
  const rows = [
    ['Way of life', ECO[o.eco][0]], ['Cells', `${o.n} / ${pl.n}`], ['Body plan', SYMS[pl.sym]], ['Gait', gaitOf(o)],
    [o.wet ? 'Depth' : 'Height', String(Math.abs(Math.round(o.y[0] - seaY)))], ['Generation', o.gen], ['Age', clockText(o.age / TPS)], ['Offspring', o.kids],
    ['Mates', o.mates], ['Kills', o.kills], ['Of its species', fmtInt(o.sp.alive)], ['Descends from', o.sp.parent || 'the first cells'],
  ];
  const html = rows.map(([k, v]) => `<div><dt>${k}</dt><dd title="${esc(v)}">${esc(v)}</dd></div>`).join('');
  const dl = $('i-stats');
  if (dl.html !== html) { dl.html = html; dl.innerHTML = html; }
}

function updateLog() {
  const items = world.events.slice(0, 6);
  const key = items.map((e) => e.t + e.text).join('|');
  if (key === logKey) return;
  logKey = key;
  $('log').innerHTML = items.map((e) =>
    `<li class="k-${e.kind}"><time>${clockText(e.t / TPS)}</time><span>${esc(e.text)}</span></li>`).join('');
}

// Diversity over the whole run: the effective number of species, and ways of life.
function drawChart() {
  const c = $('chart'), d = view.dpr, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, w, h);
  const hs = world.hist, n = hs.t.length, t1 = Math.max(world.t, 60 * TPS);
  const top = Math.max(10, ...hs.div) * 1.1;
  const X = (t) => (t / t1) * (w - 1), Y = (v, m) => h - 2 - (v / m) * (h - 6);
  g.font = `9px ${MONO}`;
  g.textAlign = 'right';
  g.fillStyle = 'rgba(150, 170, 200, 0.5)';
  g.fillText(String(Math.round(top)), w - 2, 9);
  if (n < 2) return;
  g.lineWidth = 1;
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.eco[i], NE));
  g.strokeStyle = 'rgba(230, 237, 247, 0.6)';
  g.stroke();
  g.beginPath();
  g.moveTo(X(hs.t[0]), h);
  for (let i = 0; i < n; i++) g.lineTo(X(hs.t[i]), Y(hs.div[i], top));
  g.lineTo(X(hs.t[n - 1]), h);
  g.closePath();
  g.fillStyle = 'rgba(92, 242, 182, 0.08)';
  g.fill();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? 'lineTo' : 'moveTo'](X(hs.t[i]), Y(hs.div[i], top));
  g.strokeStyle = ACCENT;
  g.shadowColor = ACCENT; g.shadowBlur = 4;
  g.stroke();
  g.shadowBlur = 0;
}

// ---- main loop --------------------------------------------------------------------------------------
function follow() {
  const o = view.selected;
  if (!view.follow || !o || !o.alive) return;
  view.cx += wdx(o.x[0] - view.cx) * 0.12;
  view.cy += (o.y[0] - view.cy) * 0.12;
  clampView();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  if (running) {
    acc += dt * TPS * SPEEDS[speed];
    const t0 = performance.now();
    while (acc >= 1) {
      step();
      acc -= 1;
      if (performance.now() - t0 > 13) { acc = 0; break; } // can't keep up: drop the backlog
    }
  }
  if (pointer && pointer.mode === 'tool' && view.pointer) useTool(view.pointer, dt, false);
  follow();
  render();
  if ((hudWait -= dt) <= 0) { hudWait = 0.25; updateHud(); }
  if (hintWait > 0 && (hintWait -= dt) <= 0) $('hint').classList.remove('show');
}

function boot() {
  initRender($('view'));
  bindControls();
  bindPointer();
  bindKeys();
  const fit = () => resizeView(innerWidth, innerHeight);
  addEventListener('resize', fit);
  fit();
  setSpeed(1);
  setTool('inspect');
  setRunning(true);
  newWorld();
  requestAnimationFrame(frame);
}

boot();

})();
</script>
</body>
</html>
